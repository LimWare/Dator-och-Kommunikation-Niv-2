<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nätverk & Adressering - 26 Frågor (En i taget)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --correct: #22c55e;
      --wrong: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      width: 100%;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Progress bar */
    .progress-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #0b1120;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    /* Card */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .question-title {
      font-size: 1.15rem;
      color: var(--text);
      margin-bottom: 1.2rem;
      line-height: 1.4;
    }

    textarea {
      width: 100%;
      height: 100px;
      background: #0b1120;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.95rem;
      resize: vertical;
      margin-bottom: 1rem;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.6rem 1.2rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .solution {
      display: none;
      margin-top: 1.2rem;
      padding: 1rem;
      background: #0b1120;
      border-left: 4px solid var(--accent);
      border-radius: 4px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e2e8f0;
    }

    .self-check {
      display: none;
      margin-top: 1rem;
      gap: 0.75rem;
    }

    .btn-correct {
      flex: 1;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid var(--correct);
      color: var(--correct);
      padding: 0.6rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .btn-correct:hover {
      background: var(--correct);
      color: #fff;
    }

    .btn-wrong {
      flex: 1;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--wrong);
      color: var(--wrong);
      padding: 0.6rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .btn-wrong:hover {
      background: var(--wrong);
      color: #fff;
    }

    /* Slutresultat */
    .summary-card {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
    }

    .summary-score {
      font-size: 2.2rem;
      color: var(--accent);
      font-weight: bold;
      margin: 1rem 0;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Nätverk & Adressering</h1>
    <p class="subtitle">Skriv ditt svar, kontrollera mot facit och gå vidare till nästa fråga.</p>
  </header>

  <div class="progress-container" id="progress-container">
    <div class="progress-stats">
      <span id="question-indicator">Fråga 1 av 26</span>
      <span>Poäng: <strong id="score-counter">0</strong></span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="card" id="quiz-card">
    <div class="question-title" id="q-text"></div>
    <textarea id="user-input" placeholder="Skriv ditt svar här..."></textarea>
    
    <div class="btn-row">
      <button class="btn" id="btn-show-facit" onclick="showSolution()">Visa facit</button>
    </div>

    <div class="solution" id="solution-box"></div>

    <div class="self-check" id="check-box">
      <button class="btn-correct" onclick="handleAnswer(true)">✓ Jag kunde detta</button>
      <button class="btn-wrong" onclick="handleAnswer(false)">✕ Behöver öva mer</button>
    </div>
  </div>

  <div class="summary-card" id="summary-card">
    <h2>Träning klar!</h2>
    <div class="summary-score" id="final-score"></div>
    <p id="final-comment" style="color: var(--text-muted); margin-bottom: 1.5rem;"></p>
    <button class="btn" onclick="restartQuiz()">Starta om omgången</button>
  </div>
</div>

<script>
const questions = [
  {
    q: "Vilka olika nätverkstyper finns det och var används de?",
    a: "<b>PAN:</b> Personligt och mycket nära, typ Bluetooth till klocka eller hörlurar.<br><b>LAN:</b> Lokalt nätverk i ett hem, en skola eller ett kontor.<br><b>MAN:</b> Stadsnät som täcker en hel stad/kommun.<br><b>WAN:</b> Stort nätverk över länder/världen (Internet)."
  },
  {
    q: "Vilka olika typer av topologier finns det och var används de?",
    a: "<b>Stjärna:</b> Alla kopplas till central switch (standard hemma/kontor).<br><b>Buss:</b> Alla delar på samma kabel (fordon/bilar för att spara kabel).<br><b>Ring:</b> Datan går runt som en stafettpinne (telekom).<br><b>Mesh:</b> Alla har kontakt via flera vägar (datacenter, hög driftsäkerhet).<br><b>Träd:</b> Sammankopplade stjärnnät i nivåer (större företag).<br><b>Hybrid:</b> Blandning av två eller fler sorter."
  },
  {
    q: "Vilka typer av nätverksmedia finns det och vad för signaler skickar de?",
    a: "<b>Koppar:</b> TP-kabel och antennkabel (koax) – skickar el.<br><b>Fiber:</b> Glas-/plastkabel – skickar ljus.<br><b>Trådlöst:</b> Wi-Fi, 4G/5G och radio – skickar radiovågor."
  },
  {
    q: "Ge exempel på bunden kommunikation.",
    a: "Allt som går via en fysisk kabel (t.ex. vanlig nätverkskabel eller fiber), alltså inte trådlöst via luften."
  },
  {
    q: "Vilka typer av TP-kablar finns det?",
    a: "<b>Skärmning:</b> UTP (oskärmad, billigast) och STP (med metallskärm mot elektromagnetiska störningar).<br><b>Klasser:</b> Cat5e, Cat6, Cat6a, Cat7 och Cat8."
  },
  {
    q: "Vilken kapacitet har TP-kabeln och hur långt kan man sända?",
    a: "<b>Maxlängd:</b> Alltid max 100 meter.<br><b>Hastighet:</b> Cat5e ger 1 Gbps, Cat6/6a ger upp till 10 Gbps (Cat8 upp till 40 Gbps på korta sträckor)."
  },
  {
    q: "Beskriv en koaxialkabel och vilka fördelar och nackdelar den har.",
    a: "<b>Uppbyggnad:</b> Tjock koppartråd i mitten, plastisolering och en metallskärm runtom.<br><b>Fördel:</b> Tål yttre störningar jättebra och tål fysiskt stryk.<br><b>Nackdel:</b> Styv, svår att böja och har lägre kapacitet än fiber."
  },
  {
    q: "Vilka typer av fiberkablar finns det?",
    a: "<b>Singlemode:</b> Supertunn kärna med laser. För jättelånga sträckor (flera mil).<br><b>Multimode:</b> Tjockare kärna med enklare ljus (LED). För korta sträckor (inom ett hus/datacenter)."
  },
  {
    q: "Hur fungerar en fiberkabel rent tekniskt?",
    a: "Data görs om till ljusblixtar. Ljuset studsar inuti glastråden (totalreflektion) hela vägen till en mottagare (fotodiod) som gör om ljuset till ettor och nollor igen."
  },
  {
    q: "Vilka fördelar finns det med fiberkabel?",
    a: "• Blixtsnabbt och klarar enorma mängder data.<br>• Helt okänsligt för åska och elektriska störningar.<br>• Ljuset kan färdas mil utan att signalen blir svag.<br>• Går inte att avlyssna utan att länken bryts."
  },
  {
    q: "Hur är en MAC-adress uppbyggd?",
    a: "Den består av 6 bytes (48 bitar).<br>• De 3 första byten visar tillverkaren (OUI).<br>• De 3 sista byten är nätverkskortets unika serienummer (NIC)."
  },
  {
    q: "Vad är en MAC-adress?",
    a: "Nätverkskortets unika fysiska 'personnummer'. Den är inbränd på kortet från fabriken och ändras i grunden aldrig."
  },
  {
    q: "Vilka nätverksklasser finns det och ge exempel på adresser?",
    a: "<b>Klass A:</b> 1–126 (Ex: 10.0.0.1) – jättestora nätverk.<br><b>Klass B:</b> 128–191 (Ex: 172.16.0.1) – mellanstora nätverk.<br><b>Klass C:</b> 192–223 (Ex: 192.168.1.1) – små nät/hemmanätverk."
  },
  {
    q: "Hur räknar man ut Host-ID? (Husnumret)",
    a: "Man tar bort nätverksdelen (där subnätmasken har 255) från IP-adressen – siffrorna som blir över är Host-ID.<br><i>Exempel:</i> IP 192.168.1.25 med mask 255.255.255.0 ger Host-ID <b>.25</b>."
  },
  {
    q: "Hur räknar man ut Net-ID? (Gatunamnet)",
    a: "Man jämför IP-adressen med subnätmasken (AND-operation). Där masken har 255 behåller man siffrorna, resten blir nollor.<br><i>Exempel:</i> IP 192.168.1.25 med mask 255.255.255.0 ger Net-ID <b>192.168.1.0</b>."
  },
  {
    q: "Vilka adresser har Klass A?",
    a: "Adresser som börjar på <b>1 – 126</b> (Standardmask: 255.0.0.0 eller /8)."
  },
  {
    q: "Hur många nätverk kan Klass A ha?",
    a: "<b>126 stycken</b> (2^7 minus 0 och 127 som är reserverade)."
  },
  {
    q: "Hur många värdenheter kan Klass A ha?",
    a: "Cirka 16,7 miljoner per nätverk (exakt <b>16 777 214 st</b>)."
  },
  {
    q: "Vilka adresser har Klass B?",
    a: "Adresser som börjar på <b>128 – 191</b> (Standardmask: 255.255.0.0 eller /16). Man hoppar över 127 för loopback."
  },
  {
    q: "Hur många nätverk kan Klass B ha?",
    a: "<b>16 384 stycken</b> (cirka 16 tusen)."
  },
  {
    q: "Hur många värdenheter kan Klass B ha?",
    a: "<b>65 534 stycken</b> per nätverk."
  },
  {
    q: "Vilka adresser har Klass C?",
    a: "Adresser som börjar på <b>192 – 223</b> (Standardmask: 255.255.255.0 eller /24). Slutar på 223, inte 256!"
  },
  {
    q: "Hur många nätverk kan Klass C ha?",
    a: "Cirka 2,1 miljoner stycken (exakt <b>2 097 152 st</b>)."
  },
  {
    q: "Hur många värdenheter kan Klass C ha?",
    a: "<b>254 stycken</b> per nätverk (256 minus 2 = 254)."
  },
  {
    q: "Vad är en Default Gateway?",
    a: "Routerns IP-adress på det lokala nätet. Det är 'dörren ut' som datorn skickar all trafik till när mottagaren finns på ett annat nätverk eller på Internet."
  },
  {
    q: "Vilka olika typer av IPv4-adresser finns det?",
    a: "• <b>Unicast:</b> Skickar till en enskild enhet.<br>• <b>Multicast:</b> Skickar till en grupp (224.0.0.0–239.255.255.255).<br>• <b>Broadcast:</b> Skickar till alla lokalt (t.ex. 192.168.1.255).<br>• <b>Loopback:</b> Datorn pratar med sig själv internt (127.0.0.1).<br>• <b>Link-local:</b> Automatisk felsökningsadress vid saknad DHCP (169.254.x.x).<br>• <b>Unspecified:</b> Okänd adress under uppstart (0.0.0.0).<br>• <b>All-hosts broadcast:</b> Ropar till alla på kabeln (255.255.255.255)."
  }
];

let currentIndex = 0;
let score = 0;

function loadQuestion() {
  const current = questions[currentIndex];
  document.getElementById("question-indicator").innerText = `Fråga ${currentIndex + 1} av ${questions.length}`;
  document.getElementById("score-counter").innerText = score;
  document.getElementById("progress-fill").style.width = `${(currentIndex / questions.length) * 100}%`;
  
  document.getElementById("q-text").innerText = `${currentIndex + 1}. ${current.q}`;
  document.getElementById("user-input").value = "";
  
  document.getElementById("solution-box").innerHTML = current.a;
  document.getElementById("solution-box").style.display = "none";
  document.getElementById("check-box").style.display = "none";
  document.getElementById("btn-show-facit").style.display = "inline-block";
}

function showSolution() {
  document.getElementById("solution-box").style.display = "block";
  document.getElementById("check-box").style.display = "flex";
  document.getElementById("btn-show-facit").style.display = "none";
}

function handleAnswer(isCorrect) {
  if (isCorrect) score++;
  currentIndex++;

  if (currentIndex < questions.length) {
    loadQuestion();
  } else {
    showSummary();
  }
}

function showSummary() {
  document.getElementById("quiz-card").style.display = "none";
  document.getElementById("progress-container").style.display = "none";
  
  const summaryCard = document.getElementById("summary-card");
  summaryCard.style.display = "block";
  
  const percentage = Math.round((score / questions.length) * 100);
  document.getElementById("final-score").innerText = `${score} / ${questions.length} rätt (${percentage}%)`;
  
  let comment = "";
  if (percentage >= 90) comment = "Grymt jobbat! Du har stenkoll inför provet.";
  else if (percentage >= 70) comment = "Riktigt bra resultat! Repetera det lilla som missades så sitter allt.";
  else comment = "Bra försök! Kör en omgång till för att nöta in detaljerna.";
  
  document.getElementById("final-comment").innerText = comment;
}

function restartQuiz() {
  currentIndex = 0;
  score = 0;
  document.getElementById("quiz-card").style.display = "block";
  document.getElementById("progress-container").style.display = "flex";
  document.getElementById("summary-card").style.display = "none";
  loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
