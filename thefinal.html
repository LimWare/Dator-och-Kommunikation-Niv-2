<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nätverk & Adressering - 26 Frågor</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --correct-bg: rgba(34, 197, 94, 0.15);
      --correct-border: #22c55e;
      --wrong-bg: rgba(239, 68, 68, 0.15);
      --wrong-border: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 720px;
      width: 100%;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .progress-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #0b1120;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .question-title {
      font-size: 1.15rem;
      color: var(--text);
      margin-bottom: 1.2rem;
      line-height: 1.4;
    }

    textarea {
      width: 100%;
      height: 110px;
      background: #0b1120;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.95rem;
      resize: vertical;
      margin-bottom: 1rem;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.6rem 1.4rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    /* Feedback box */
    .feedback-box {
      display: none;
      margin-top: 1.2rem;
      padding: 1rem;
      border-radius: 6px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .feedback-box.correct {
      background: var(--correct-bg);
      border: 1px solid var(--correct-border);
    }

    .feedback-box.wrong {
      background: var(--wrong-bg);
      border: 1px solid var(--wrong-border);
    }

    .feedback-status {
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .correct .feedback-status {
      color: var(--correct-border);
    }

    .wrong .feedback-status {
      color: var(--wrong-border);
    }

    .solution-text {
      margin-top: 0.5rem;
      color: #e2e8f0;
    }

    .actions-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }

    /* Slutresultat */
    .summary-card {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
    }

    .summary-score {
      font-size: 2.2rem;
      color: var(--accent);
      font-weight: bold;
      margin: 1rem 0;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Nätverk & Adressering</h1>
    <p class="subtitle">Skriv ditt svar i rutan och klicka på Svara för automatisk kontroll.</p>
  </header>

  <div class="progress-container" id="progress-container">
    <div class="progress-stats">
      <span id="question-indicator">Fråga 1 av 26</span>
      <span>Poäng: <strong id="score-counter">0</strong></span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="card" id="quiz-card">
    <div class="question-title" id="q-text"></div>
    <textarea id="user-input" placeholder="Skriv ditt svar här..."></textarea>
    
    <div class="actions-row">
      <button class="btn" id="btn-submit" onclick="checkAnswer()">Svara</button>
      <button class="btn" id="btn-next" style="display: none;" onclick="nextQuestion()">Nästa fråga →</button>
    </div>

    <div class="feedback-box" id="feedback-box">
      <div class="feedback-status" id="feedback-status"></div>
      <div class="solution-text" id="solution-text"></div>
    </div>
  </div>

  <div class="summary-card" id="summary-card">
    <h2>Träning klar!</h2>
    <div class="summary-score" id="final-score"></div>
    <p id="final-comment" style="color: var(--text-muted); margin-bottom: 1.5rem;"></p>
    <button class="btn" onclick="restartQuiz()">Starta om omgången</button>
  </div>
</div>

<script>
const questions = [
  {
    q: "Vilka olika nätverkstyper finns det och var används de?",
    keywords: ["pan", "lan", "man", "wan"],
    minMatches: 3,
    a: "<b>PAN:</b> Personligt (Bluetooth/klocka).<br><b>LAN:</b> Lokalt (hem, skola, kontor).<br><b>MAN:</b> Stadsnät (stad/kommun).<br><b>WAN:</b> Världsnät/stort nät (Internet)."
  },
  {
    q: "Vilka olika typer av topologier finns det och var används de?",
    keywords: ["stjärn", "buss", "ring", "mesh", "träd", "hybrid"],
    minMatches: 3,
    a: "<b>Stjärna:</b> Central switch (hemma/kontor).<br><b>Buss:</b> Gemensam kabel (bilar/fordon).<br><b>Ring:</b> Cirkel/stafettpinne (telekom).<br><b>Mesh:</b> Flera vägar för redundans (datacenter).<br><b>Träd:</b> Stjärnnät i nivåer.<br><b>Hybrid:</b> Blandning."
  },
  {
    q: "Vilka typer av nätverksmedia finns det och vad för signaler skickar de?",
    keywords: ["koppar", "fiber", "trådlös", "el", "ljus", "radio"],
    minMatches: 3,
    a: "<b>Koppar:</b> TP-kabel och antennkabel (koax) – skickar el.<br><b>Fiber:</b> Glas-/plastkabel – skickar ljus.<br><b>Trådlöst:</b> Wi-Fi/4G/5G – skickar radiovågor."
  },
  {
    q: "Ge exempel på bunden kommunikation.",
    keywords: ["kabel", "fysisk", "tp", "fiber", "koppar"],
    minMatches: 1,
    a: "Allt som går via en fysisk kabel (t.ex. TP-kabel eller fiber), alltså inte trådlöst via luften."
  },
  {
    q: "Vilka typer av TP-kablar finns det?",
    keywords: ["utp", "stp", "cat"],
    minMatches: 2,
    a: "<b>Skärmning:</b> UTP (oskärmad, billigast) och STP (skärmad mot elstörningar).<br><b>Klasser:</b> Cat5e, Cat6, Cat6a, Cat7 och Cat8."
  },
  {
    q: "Vilken kapacitet har TP-kabeln och hur långt kan man sända?",
    keywords: ["100", "meter", "gbps", "1", "10"],
    minMatches: 2,
    a: "<b>Maxlängd:</b> Alltid max 100 meter.<br><b>Hastighet:</b> Cat5e ger 1 Gbps, Cat6/6a ger upp till 10 Gbps (Cat8 upp till 40 Gbps på korta sträckor)."
  },
  {
    q: "Beskriv en koaxialkabel och vilka fördelar och nackdelar den har.",
    keywords: ["koppar", "skärm", "störning", "styv", "böj"],
    minMatches: 2,
    a: "<b>Uppbyggnad:</b> Tjock koppartråd, isolering och metallskärm.<br><b>Fördel:</b> Tål störningar och stryk bra.<br><b>Nackdel:</b> Styv, svår att böja och lägre kapacitet än fiber."
  },
  {
    q: "Vilka typer av fiberkablar finns det?",
    keywords: ["singlemode", "multimode", "laser", "led"],
    minMatches: 2,
    a: "<b>Singlemode:</b> Supertunn kärna med laser. För långa sträckor (mil).<br><b>Multimode:</b> Tjockare kärna med LED-ljus. För korta sträckor (byggnad/datacenter)."
  },
  {
    q: "Hur fungerar en fiberkabel rent tekniskt?",
    keywords: ["ljus", "studs", "totalreflektion", "fotodiod"],
    minMatches: 2,
    a: "Data görs om till ljusblixtar. Ljuset studsar inuti glastråden (totalreflektion) hela vägen till en mottagare (fotodiod) som gör om ljuset till ettor och nollor."
  },
  {
    q: "Vilka fördelar finns det med fiberkabel?",
    keywords: ["snabb", "störning", "åska", "lång", "avlyssn"],
    minMatches: 2,
    a: "1. Blixtsnabbt och klarar enormt med data.<br>2. Helt okänsligt för åska och elektriska störningar.<br>3. Färdas flera mil utan signalförlust.<br>4. Svårt att avlyssna."
  },
  {
    q: "Hur är en MAC-adress uppbyggd?",
    keywords: ["6", "byte", "48", "bit", "oui", "nic", "tillverk"],
    minMatches: 2,
    a: "Den är på 6 bytes (48 bitar). De 3 första byten visar tillverkaren (OUI) och de 3 sista är nätverkskortets unika serienummer (NIC)."
  },
  {
    q: "Vad är en MAC-adress?",
    keywords: ["fysisk", "personnummer", "unik", "kort", "inbränd"],
    minMatches: 2,
    a: "Nätverkskortets unika fysiska 'personnummer'. Den är inbränd på kortet från fabriken och ändras i grunden aldrig."
  },
  {
    q: "Vilka nätverksklasser finns det och ge exempel på adresser?",
    keywords: ["klass a", "klass b", "klass c", "126", "191", "223", "192.168", "10."],
    minMatches: 3,
    a: "<b>Klass A:</b> 1–126 (t.ex. 10.0.0.1).<br><b>Klass B:</b> 128–191 (t.ex. 172.16.0.1).<br><b>Klass C:</b> 192–223 (t.ex. 192.168.1.1)."
  },
  {
    q: "Hur räknar man ut Host-ID? (Husnumret)",
    keywords: ["nätverk", "mask", "255", "kvar", "över", "25"],
    minMatches: 2,
    a: "Man tar bort nätverksdelen från IP-adressen (där masken har 255). Siffrorna som blir över är Host-ID. Ex: IP 192.168.1.25 med /24 ger <b>.25</b>."
  },
  {
    q: "Hur räknar man ut Net-ID? (Gatunamnet)",
    keywords: ["and", "mask", "255", "noll", "0", "192.168.1.0"],
    minMatches: 2,
    a: "Man jämför IP-adressen med subnätmasken (AND-operation). Där masken har 255 behåller man siffrorna, resten nollas. Ex: 192.168.1.25 med mask 255.255.255.0 ger <b>192.168.1.0</b>."
  },
  {
    q: "Vilka adresser har Klass A?",
    keywords: ["1", "126", "255.0.0.0", "/8"],
    minMatches: 2,
    a: "Adresser som börjar på <b>1 – 126</b> (Standardmask: 255.0.0.0 eller /8)."
  },
  {
    q: "Hur många nätverk kan Klass A ha?",
    keywords: ["126"],
    minMatches: 1,
    a: "<b>126 stycken</b> (2^7 minus 0 och 127 som är reserverade)."
  },
  {
    q: "Hur många värdenheter kan Klass A ha?",
    keywords: ["16", "miljon", "16777214", "16 777 214"],
    minMatches: 1,
    a: "Cirka 16,7 miljoner per nätverk (exakt <b>16 777 214 st</b>)."
  },
  {
    q: "Vilka adresser har Klass B?",
    keywords: ["128", "191", "255.255.0.0", "/16"],
    minMatches: 2,
    a: "Adresser som börjar på <b>128 – 191</b> (Standardmask: 255.255.0.0 eller /16). Man hoppar över 127 för loopback."
  },
  {
    q: "Hur många nätverk kan Klass B ha?",
    keywords: ["16 384", "16384", "16 tusen"],
    minMatches: 1,
    a: "<b>16 384 stycken</b> (cirka 16 tusen)."
  },
  {
    q: "Hur många värdenheter kan Klass B ha?",
    keywords: ["65 534", "65534"],
    minMatches: 1,
    a: "<b>65 534 stycken</b> per nätverk."
  },
  {
    q: "Vilka adresser har Klass C?",
    keywords: ["192", "223", "255.255.255.0", "/24"],
    minMatches: 2,
    a: "Adresser som börjar på <b>192 – 223</b> (Standardmask: 255.255.255.0 eller /24). Slutar på 223!"
  },
  {
    q: "Hur många nätverk kan Klass C ha?",
    keywords: ["2,1", "2.1", "miljon", "2097152", "2 097 152"],
    minMatches: 1,
    a: "Cirka 2,1 miljoner stycken (exakt <b>2 097 152 st</b>)."
  },
  {
    q: "Hur många värdenheter kan Klass C ha?",
    keywords: ["254"],
    minMatches: 1,
    a: "<b>254 stycken</b> per nätverk (256 minus nätverksadress och broadcast)."
  },
  {
    q: "Vad är en Default Gateway?",
    keywords: ["router", "ip", "lokal", "dörr", "internet", "annat"],
    minMatches: 2,
    a: "Routerns IP-adress på det lokala nätet. Det är 'dörren ut' dit datorn skickar trafik till andra nätverk eller Internet."
  },
  {
    q: "Vilka olika typer av IPv4-adresser finns det?",
    keywords: ["unicast", "multicast", "broadcast", "loopback", "link-local", "127.0.0.1"],
    minMatches: 3,
    a: "<b>Unicast:</b> Till en dator.<br><b>Multicast:</b> Till en grupp.<br><b>Broadcast:</b> Till alla lokalt.<br><b>Loopback:</b> Datorn själv (127.0.0.1).<br><b>Link-local:</b> APIPA vid saknad DHCP (169.254.x.x).<br><b>Unspecified:</b> Okänd adress (0.0.0.0)."
  }
];

let currentIndex = 0;
let score = 0;
let answered = false;

function loadQuestion() {
  answered = false;
  const current = questions[currentIndex];
  document.getElementById("question-indicator").innerText = `Fråga ${currentIndex + 1} av ${questions.length}`;
  document.getElementById("score-counter").innerText = score;
  document.getElementById("progress-fill").style.width = `${(currentIndex / questions.length) * 100}%`;
  
  document.getElementById("q-text").innerText = `${currentIndex + 1}. ${current.q}`;
  const input = document.getElementById("user-input");
  input.value = "";
  input.disabled = false;
  input.focus();
  
  const feedbackBox = document.getElementById("feedback-box");
  feedbackBox.style.display = "none";
  feedbackBox.className = "feedback-box";
  
  document.getElementById("btn-submit").style.display = "inline-block";
  document.getElementById("btn-next").style.display = "none";
}

function checkAnswer() {
  if (answered) return;
  
  const userText = document.getElementById("user-input").value.trim().toLowerCase();
  const current = questions[currentIndex];
  
  if (!userText) {
    alert("Skriv ett svar först!");
    return;
  }
  
  answered = true;
  document.getElementById("user-input").disabled = true;
  document.getElementById("btn-submit").style.display = "none";
  document.getElementById("btn-next").style.display = "inline-block";

  // Kontrollera mot nyckelord
  let matchCount = 0;
  current.keywords.forEach(kw => {
    if (userText.includes(kw.toLowerCase())) {
      matchCount++;
    }
  });

  const isCorrect = matchCount >= current.minMatches;
  const feedbackBox = document.getElementById("feedback-box");
  const statusEl = document.getElementById("feedback-status");
  const solutionEl = document.getElementById("solution-text");

  if (isCorrect) {
    score++;
    document.getElementById("score-counter").innerText = score;
    feedbackBox.className = "feedback-box correct";
    statusEl.innerHTML = "✓ Rätt svar!";
  } else {
    feedbackBox.className = "feedback-box wrong";
    statusEl.innerHTML = "✕ Inte helt rätt / Behöver kompletteras";
  }

  solutionEl.innerHTML = `<strong>Facit:</strong><br>${current.a}`;
  feedbackBox.style.display = "block";
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < questions.length) {
    loadQuestion();
  } else {
    showSummary();
  }
}

function showSummary() {
  document.getElementById("quiz-card").style.display = "none";
  document.getElementById("progress-container").style.display = "none";
  
  const summaryCard = document.getElementById("summary-card");
  summaryCard.style.display = "block";
  
  const percentage = Math.round((score / questions.length) * 100);
  document.getElementById("final-score").innerText = `${score} / ${questions.length} rätt (${percentage}%)`;
  
  let comment = "";
  if (percentage >= 90) comment = "Grymt jobbat! Du har stenkoll inför provet.";
  else if (percentage >= 70) comment = "Riktigt bra resultat! Repetera det lilla som missades så sitter allt.";
  else comment = "Bra försök! Kör en omgång till för att nöta in detaljerna.";
  
  document.getElementById("final-comment").innerText = comment;
}

function restartQuiz() {
  currentIndex = 0;
  score = 0;
  document.getElementById("quiz-card").style.display = "block";
  document.getElementById("progress-container").style.display = "flex";
  document.getElementById("summary-card").style.display = "none";
  loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
