<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nätverksquiz - 26 Frågor (Media, Topologier & IP)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border: #334155;
      --correct: #22c55e;
      --partial: #eab308;
      --wrong: #ef4444;
      --badge-bg: #1e1b4b;
      --badge-txt: #818cf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.85rem;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .smart-badge {
      display: inline-block;
      background: var(--badge-bg);
      border: 1px solid var(--badge-txt);
      color: var(--badge-txt);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 3px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .progress-container {
      margin-bottom: 18px;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #818cf8);
      transition: width 0.3s ease;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      min-height: 310px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .q-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .q-title {
      font-weight: 600;
      font-size: 1.2rem;
      line-height: 1.4;
    }

    .q-badge {
      background: #0f172a;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--accent);
      white-space: nowrap;
      border: 1px solid var(--border);
    }

    .hint-toggle {
      background: none;
      border: none;
      color: #fbbf24;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 12px;
      align-self: flex-start;
      padding: 0;
    }

    .hint-box {
      display: none;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: rgba(245, 158, 11, 0.08);
      border-left: 3px solid #f59e0b;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #fde68a;
    }

    .input-wrapper {
      margin-top: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b1120;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .result-box {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .result-correct {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid var(--correct);
      color: #86efac;
    }

    .result-partial {
      background: rgba(234, 179, 8, 0.12);
      border: 1px solid var(--partial);
      color: #fde047;
    }

    .result-wrong {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--wrong);
      color: #fca5a5;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      gap: 12px;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-submit {
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-nav {
      background: #334155;
      color: #fff;
    }

    .btn-nav:hover:not(:disabled) {
      background: #475569;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .summary-card {
      display: none;
      background: var(--card-bg);
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 36px 20px;
      text-align: center;
    }

    .summary-score {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent);
      margin: 12px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="smart-badge">⚡ Direkt rättning med tolerans</div>
    <h1>Nätverksquiz: Fullständig Repetition</h1>
  </header>

  <div class="progress-container" id="progressContainer">
    <div class="progress-labels">
      <span id="stepLabel">Fråga 1 av 26</span>
      <span id="scoreLabel">Poäng: 0.0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="card" id="quizCard">
    <div>
      <div class="q-top">
        <div class="q-title" id="qTitle">Laddar fråga...</div>
        <div class="q-badge" id="qBadge">1.0 p</div>
      </div>

      <button type="button" class="hint-toggle" onclick="toggleHint()">💡 Visa ledtråd</button>
      <div class="hint-box" id="qHint"></div>

      <div class="input-wrapper">
        <input type="text" id="ansInput" placeholder="Skriv ditt svar här..." autocomplete="off" onkeydown="handleKey(event)" />
      </div>

      <div class="result-box" id="resBox"></div>
    </div>

    <div class="card-actions">
      <button type="button" class="btn btn-nav" id="btnPrev" onclick="prevQuestion()" disabled>← Föregående</button>
      <button type="button" class="btn btn-submit" id="btnCheck" onclick="submitAnswer()">Rätta svar</button>
      <button type="button" class="btn btn-nav" id="btnNext" onclick="nextQuestion()">Nästa →</button>
    </div>
  </div>

  <div class="summary-card" id="summaryCard">
    <h2>Resultat</h2>
    <div class="summary-score" id="finalScore">0 / 26</div>
    <p id="finalFeedback" style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 24px;"></p>
    <button type="button" class="btn btn-submit" onclick="restartQuiz()">🔄 Gör om quizet</button>
  </div>
</div>

<script>
const questions = [
  {
    id: 1,
    q: "Vilka olika nätverkstyper finns det och var används de?",
    hint: "Fyra förkortningar (P, L, M, W) samt var de används (t.ex. Bluetooth, hem, stad, Internet).",
    fullCheck: (t) => (t.includes("pan") && t.includes("lan") && t.includes("man") && t.includes("wan")) && (t.includes("bluetooth") || t.includes("lokal") || t.includes("stad") || t.includes("internet") || t.includes("hem")),
    partialCheck: (t) => t.includes("pan") || t.includes("lan") || t.includes("man") || t.includes("wan"),
    expl: "PAN (personligt/Bluetooth), LAN (lokalt, hem/kontor), MAN (stadsnät), WAN (stort nätverk över länder/Internet)."
  },
  {
    id: 2,
    q: "Vilka olika typer av topologier finns det och var används de?",
    hint: "Nämn minst 3-4 stycken (stjärna, buss, ring, mesh, träd, hybrid) och något användningsområde.",
    fullCheck: (t) => {
      let c = 0;
      ["stjärn", "buss", "ring", "mesh", "träd", "hybrid"].forEach(x => { if(t.includes(x)) c++; });
      return c >= 3 && (t.includes("switch") || t.includes("bil") || t.includes("fordon") || t.includes("datacenter") || t.includes("stafett") || t.includes("kontor"));
    },
    partialCheck: (t) => {
      let c = 0;
      ["stjärn", "buss", "ring", "mesh", "träd", "hybrid"].forEach(x => { if(t.includes(x)) c++; });
      return c >= 2;
    },
    expl: "Stjärna (switch, hem/kontor), Buss (delad kabel, fordon), Ring (stafettpinne, telekom), Mesh (flera vägar, datacenter), Träd (nivåer), Hybrid (blandning)."
  },
  {
    id: 3,
    q: "Vilka typer av nätverksmedia finns det och vilka signaler skickar de?",
    hint: "Tre medier: Koppar, fiber och trådlöst – vilka fysiska signaler transporteras?",
    fullCheck: (t) => (t.includes("koppar") || t.includes("tp")) && t.includes("fiber") && (t.includes("trådlös") || t.includes("wifi")) && (t.includes("el") || t.includes("ljus") || t.includes("radio")),
    partialCheck: (t) => (t.includes("koppar") && t.includes("fiber")) || t.includes("el") || t.includes("ljus"),
    expl: "Koppar (TP/koax – el), Fiber (glas/plast – ljus), Trådlöst (Wi-Fi/radio – radiovågor)."
  },
  {
    id: 4,
    q: "Ge exempel på bunden kommunikation.",
    hint: "Motsatsen till trådlöst. Vilka typer av kablar används?",
    fullCheck: (t) => (t.includes("kabel") || t.includes("tråd") || t.includes("fysisk")) && (t.includes("tp") || t.includes("fiber") || t.includes("koppar") || t.includes("koax")),
    partialCheck: (t) => t.includes("kabel") || t.includes("tp") || t.includes("fiber"),
    expl: "Allt som går via en fysisk kabel, t.ex. TP-kabel (koppar) eller optisk fiberkabel."
  },
  {
    id: 5,
    q: "Vilka typer av TP-kablar finns det gällande skärmning och klasser?",
    hint: "Två typer av skärmning (U... och S...) samt kategorier (Cat...).",
    fullCheck: (t) => (t.includes("utp") && t.includes("stp")) && (t.includes("cat") || t.includes("kategori") || t.includes("skärm")),
    partialCheck: (t) => t.includes("utp") || t.includes("stp") || t.includes("cat5") || t.includes("cat6"),
    expl: "Skärmning: UTP (oskärmad) och STP (skärmad mot störningar). Klasser: Cat5e, Cat6, Cat6a, Cat7, Cat8."
  },
  {
    id: 6,
    q: "Vilken kapacitet har TP-kabeln och hur långt kan man maximalt sända?",
    hint: "En exakt maxlängd i meter och hastighet för Cat5e/Cat6.",
    fullCheck: (t) => (t.includes("100") || t.includes("hundra")) && (t.includes("gbps") || t.includes("gbit") || t.includes("1") || t.includes("10")),
    partialCheck: (t) => t.includes("100") || t.includes("gbps") || t.includes("gbit"),
    expl: "Maximal längd är alltid 100 meter. Cat5e klarar 1 Gbps, Cat6/6a upp till 10 Gbps (Cat8 upp till 40 Gbps på korta sträckor)."
  },
  {
    id: 7,
    q: "Beskriv en koaxialkabel samt dess fördelar och nackdelar.",
    hint: "Koppartråd i mitten med skärm. Tål störningar bra, men hur är böjligheten?",
    fullCheck: (t) => (t.includes("koppar") || t.includes("skärm")) && (t.includes("störning") || t.includes("tål")) && (t.includes("styv") || t.includes("böj") || t.includes("kapacitet")),
    partialCheck: (t) => t.includes("koppar") || t.includes("störning") || t.includes("styv"),
    expl: "Uppbyggd av kopparledare i mitten med metallskärm runtom. Fördel: Tål yttre störningar och stryk. Nackdel: Styv, svårböjd och lägre kapacitet än fiber."
  },
  {
    id: 8,
    q: "Vilka två huvudtyper av fiberkablar finns det och vad skiljer dem åt?",
    hint: "Single... och Multi... – tänk på ljuskälla (laser vs LED) och räckvidd.",
    fullCheck: (t) => (t.includes("singlemode") || t.includes("single mode") || t.includes("single")) && (t.includes("multimode") || t.includes("multi mode") || t.includes("multi")) && (t.includes("laser") || t.includes("led") || t.includes("lång") || t.includes("mil")),
    partialCheck: (t) => t.includes("singlemode") || t.includes("multimode"),
    expl: "Singlemode: Supertunn kärna, laser som ljuskälla, för mycket långa sträckor (flera mil). Multimode: Tjockare kärna, LED-ljus, för korta sträckor (inom datacenter/hus)."
  },
  {
    id: 9,
    q: "Hur fungerar en fiberkabel rent tekniskt?",
    hint: "Hur transporteras ljuset i kärnan och vad omvandlar det vid mottagaren?",
    fullCheck: (t) => (t.includes("ljus") || t.includes("laser")) && (t.includes("studs") || t.includes("totalreflektion")) && (t.includes("fotodiod") || t.includes("ettor") || t.includes("mottag")),
    partialCheck: (t) => t.includes("ljus") || t.includes("studs") || t.includes("totalreflektion") || t.includes("fotodiod"),
    expl: "Data görs om till ljussignaler som studsar inuti glaskärnan genom totalreflektion till en mottagare (fotodiod) som återskapar ettor och nollor."
  },
  {
    id: 10,
    q: "Vilka fördelar har fiberkabel jämfört med kopparkablar?",
    hint: "Tänk på hastighet, störningskänslighet (åska), räckvidd och avlyssning.",
    fullCheck: (t) => {
      let c = 0;
      ["snabb", "kapacitet", "störning", "åska", "mil", "lång", "avlyssn", "ljus"].forEach(x => { if(t.includes(x)) c++; });
      return c >= 2;
    },
    partialCheck: (t) => t.includes("snabb") || t.includes("störning") || t.includes("lång") || t.includes("avlyssn"),
    expl: "Blixtsnabbt med enorm kapacitet, helt okänsligt för elstörningar och åska, extrem räckvidd (mil) och mycket svårt att avlyssna."
  },
  {
    id: 11,
    q: "Hur är en MAC-adress uppbyggd?",
    hint: "Antal bytes/bitar samt vad första och sista halvan anger (OUI / NIC).",
    fullCheck: (t) => (t.includes("48") || t.includes("6 byte")) && (t.includes("oui") || t.includes("tillverk")) && (t.includes("nic") || t.includes("serienummer") || t.includes("unik")),
    partialCheck: (t) => t.includes("48") || t.includes("6 byte") || t.includes("oui") || t.includes("tillverk"),
    expl: "Den är på 6 bytes (48 bitar). De 3 första byten anger tillverkaren (OUI) och de 3 sista byten är nätverkskortets unika serienummer (NIC)."
  },
  {
    id: 12,
    q: "Vad är en MAC-adress?",
    hint: "Fysisk adress inbränd från fabriken – nätverkskortets...",
    fullCheck: (t) => (t.includes("fysisk") || t.includes("hårdvar") || t.includes("inbränd")) && (t.includes("personnummer") || t.includes("unik") || t.includes("kort")),
    partialCheck: (t) => t.includes("personnummer") || t.includes("unik") || t.includes("adress") || t.includes("fysisk"),
    expl: "Nätverkskortets unika fysiska hårdvaruadress ('personnummer'). Den bränns in på kortet från fabriken och ändras aldrig."
  },
  {
    id: 13,
    q: "Vilka nätverksklasser finns det och ge exempel på adresser?",
    hint: "Klass A, B och C – nämn gärna ett exempel eller startintervall för varje.",
    fullCheck: (t) => (t.includes("klass a") || t.includes("a")) && (t.includes("klass b") || t.includes("b")) && (t.includes("klass c") || t.includes("c")) && (t.includes("10.") || t.includes("172.") || t.includes("192.168") || t.includes("126") || t.includes("191")),
    partialCheck: (t) => t.includes("klass a") || t.includes("klass b") || t.includes("klass c"),
    expl: "Klass A (1–126, ex 10.0.0.1), Klass B (128–191, ex 172.16.0.1), Klass C (192–223, ex 192.168.1.1)."
  },
  {
    id: 14,
    q: "Hur räknar man ut Host-ID (husnumret)?",
    hint: "Vad gör man med nätverksdelen och subnätmasken?",
    fullCheck: (t) => (t.includes("ta bort") || t.includes("kvar") || t.includes("rest") || t.includes("över")) && (t.includes("nätverk") || t.includes("mask") || t.includes("255") || t.includes("25")),
    partialCheck: (t) => t.includes("kvar") || t.includes("mask") || t.includes("nätverk"),
    expl: "Man tar bort nätverksdelen (där subnätmasken har 255) från IP-adressen – siffrorna som blir över är Host-ID (t.ex. .25 i 192.168.1.25)."
  },
  {
    id: 15,
    q: "Hur räknar man ut Net-ID (gatunamnet)?",
    hint: "Vilken logisk operation görs med subnätmasken, och vad händer med siffrorna?",
    fullCheck: (t) => (t.includes("and") || t.includes("jämför")) && (t.includes("mask") || t.includes("255") || t.includes("noll")),
    partialCheck: (t) => t.includes("and") || t.includes("mask") || t.includes("255"),
    expl: "Man gör en logisk AND-jämförelse mellan IP-adressen och subnätmasken. Där masken har 255 behålls siffrorna, resten blir nollor (Net-ID)."
  },
  {
    id: 16,
    q: "Vilka adresser har Klass A och vilken är dess standardmask?",
    hint: "Börjar på 1 och slutar vid 126. Masken har 8 bitar.",
    fullCheck: (t) => (t.includes("1-126") || (t.includes("1") && t.includes("126"))) && (t.includes("255.0.0.0") || t.includes("/8")),
    partialCheck: (t) => t.includes("1-126") || t.includes("126") || t.includes("255.0.0.0") || t.includes("/8"),
    expl: "Adresser från 1 till 126 (1.0.0.0 – 126.255.255.255). Standardmask: 255.0.0.0 (/8)."
  },
  {
    id: 17,
    q: "Hur många nätverk kan Klass A maximalt ha?",
    hint: "2^7 minus de två reserverade nätverken 0 och 127.",
    fullCheck: (t) => t.includes("126"),
    partialCheck: (t) => t.includes("128") || t.includes("127"),
    expl: "126 stycken användbara nätverk (2^7 minus 0 och 127)."
  },
  {
    id: 18,
    q: "Hur många värdenheter (hosts) kan Klass A ha per nätverk?",
    hint: "2^24 minus 2. Cirka 16,7 miljoner.",
    fullCheck: (t) => t.includes("16 777 214") || t.includes("16777214") || t.includes("16 777 216") || (t.includes("16") && t.includes("miljon")),
    partialCheck: (t) => t.includes("16"),
    expl: "16 777 214 stycken användbara värdenheter per nätverk (2^24 - 2)."
  },
  {
    id: 19,
    q: "Vilka adresser har Klass B och vilken är standardmasken?",
    hint: "Börjar på 128 (eftersom 127 hoppas över) och slutar vid 191. Standardmask med två 255:or.",
    fullCheck: (t) => (t.includes("128") && t.includes("191")) && (t.includes("255.255.0.0") || t.includes("/16")),
    partialCheck: (t) => (t.includes("128") && t.includes("191")) || t.includes("255.255.0.0"),
    expl: "Adresser från 128 till 191 (128.0.0.0 – 191.255.255.255). Standardmask: 255.255.0.0 (/16). 127 hoppas över pga loopback."
  },
  {
    id: 20,
    q: "Hur många nätverk kan Klass B ha?",
    hint: "2^14. Cirka 16 tusen.",
    fullCheck: (t) => t.includes("16 384") || t.includes("16384") || (t.includes("16") && t.includes("tusen")),
    partialCheck: (t) => t.includes("16"),
    expl: "16 384 stycken nätverk (2^14)."
  },
  {
    id: 21,
    q: "Hur många värdenheter (hosts) kan Klass B ha per nätverk?",
    hint: "2^16 minus 2. Cirka 65 tusen.",
    fullCheck: (t) => t.includes("65 534") || t.includes("65534") || t.includes("65 536") || (t.includes("65") && t.includes("tusen")),
    partialCheck: (t) => t.includes("65"),
    expl: "65 534 stycken användbara värdenheter per nätverk (2^16 - 2)."
  },
  {
    id: 22,
    q: "Vilka adresser har Klass C och vilken är standardmasken?",
    hint: "Börjar på 192 och slutar på 223 (inte 255!). Standardmask med tre 255:or.",
    fullCheck: (t) => (t.includes("192") && t.includes("223")) && (t.includes("255.255.255.0") || t.includes("/24")),
    partialCheck: (t) => (t.includes("192") && t.includes("223")) || t.includes("255.255.255.0") || t.includes("192"),
    expl: "Adresser från 192 till 223 (192.0.0.0 – 223.255.255.255). Standardmask: 255.255.255.0 (/24). Slutar vid 223!"
  },
  {
    id: 23,
    q: "Hur många nätverk kan Klass C ha?",
    hint: "2^21. Cirka 2,1 miljoner.",
    fullCheck: (t) => t.includes("2 097 152") || t.includes("2097152") || (t.includes("2") && t.includes("miljon")),
    partialCheck: (t) => t.includes("2"),
    expl: "2 097 152 stycken nätverk (cirka 2,1 miljoner)."
  },
  {
    id: 24,
    q: "Hur många användbara värdenheter kan Klass C ha per nätverk?",
    hint: "256 minus Net-ID (.0) och broadcast (.255).",
    fullCheck: (t) => t.includes("254"),
    partialCheck: (t) => t.includes("256"),
    expl: "254 stycken användbara värdenheter (256 minus 2 = 254)."
  },
  {
    id: 25,
    q: "Vad är en Default Gateway och vilken funktion fyller den?",
    hint: "Routerns IP-adress på det lokala nätet – fungerar som 'dörren ut'.",
    fullCheck: (t) => t.includes("router") && (t.includes("lokal") || t.includes("dörr") || t.includes("annat") || t.includes("internet") || t.includes("vidare")),
    partialCheck: (t) => t.includes("router") || t.includes("gateway") || t.includes("dörr"),
    expl: "Routerns IP-adress på det lokala nätet. Den fungerar som dörren ut dit datorn skickar all trafik som ska till andra nätverk eller Internet."
  },
  {
    id: 26,
    q: "Nämn minst tre olika typer av IPv4-adresser/sändningssätt.",
    hint: "T.ex. Unicast, Multicast, Broadcast, Loopback, Link-local.",
    fullCheck: (t) => {
      const list = ["unicast", "multicast", "broadcast", "loopback", "link-local", "unspecified", "127.0.0.1"];
      let c = 0;
      list.forEach(x => { if (t.includes(x)) c++; });
      return c >= 3;
    },
    partialCheck: (t) => {
      const list = ["unicast", "multicast", "broadcast", "loopback", "link-local", "unspecified", "127.0.0.1"];
      let c = 0;
      list.forEach(x => { if (t.includes(x)) c++; });
      return c >= 1;
    },
    expl: "Unicast (en-till-en), Multicast (till grupp), Broadcast (till alla lokalt), Loopback (127.0.0.1) och Link-local (169.254.x.x / APIPA)."
  }
];

let currentIndex = 0;
let userAnswers = {};
let results = {};

function toggleHint() {
  const box = document.getElementById("qHint");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function handleKey(e) {
  if (e.key === "Enter") {
    submitAnswer();
  }
}

function normalize(str) {
  return str.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, " ").replace(/\s+/g, " ").trim();
}

function updateProgress() {
  const total = questions.length;
  const pct = ((currentIndex + 1) / total) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("stepLabel").textContent = `Fråga ${currentIndex + 1} av ${total}`;

  let totalScore = 0;
  for (let id in results) {
    totalScore += results[id].score;
  }
  document.getElementById("scoreLabel").textContent = `Poäng: ${totalScore.toFixed(1)}`;
}

function loadQuestion(idx) {
  const q = questions[idx];
  document.getElementById("qTitle").textContent = `${idx + 1}. ${q.q}`;
  document.getElementById("qHint").textContent = q.hint;
  document.getElementById("qHint").style.display = "none";

  const input = document.getElementById("ansInput");
  input.value = userAnswers[q.id] || "";
  input.focus();

  const resBox = document.getElementById("resBox");
  const badge = document.getElementById("qBadge");

  if (results[q.id]) {
    const res = results[q.id];
    resBox.style.display = "block";
    if (res.score >= 1.0) {
      resBox.className = "result-box result-correct";
      resBox.innerHTML = `<strong>Rätt! (1.0 p)</strong><br>${q.expl}`;
      badge.textContent = "1.0 / 1.0 p";
      badge.style.borderColor = "var(--correct)";
      badge.style.color = "#86efac";
    } else if (res.score >= 0.5) {
      resBox.className = "result-box result-partial";
      resBox.innerHTML = `<strong>Delvis rätt / nära! (0.5 p)</strong><br>${q.expl}`;
      badge.textContent = "0.5 / 1.0 p";
      badge.style.borderColor = "var(--partial)";
      badge.style.color = "#fde047";
    } else {
      resBox.className = "result-box result-wrong";
      resBox.innerHTML = `<strong>Inte riktigt (0.0 p)</strong><br><strong>Facit:</strong> ${q.expl}`;
      badge.textContent = "0.0 / 1.0 p";
      badge.style.borderColor = "var(--wrong)";
      badge.style.color = "#fca5a5";
    }
  } else {
    resBox.style.display = "none";
    badge.textContent = "1.0 p";
    badge.style.borderColor = "var(--border)";
    badge.style.color = "var(--accent)";
  }

  document.getElementById("btnPrev").disabled = (idx === 0);
  document.getElementById("btnNext").textContent = (idx === questions.length - 1) ? "Visa resultat →" : "Nästa →";
  updateProgress();
}

function submitAnswer() {
  const q = questions[currentIndex];
  const input = document.getElementById("ansInput");
  const userAns = input.value.trim();
  userAnswers[q.id] = userAns;

  if (!userAns) {
    results[q.id] = { score: 0 };
    loadQuestion(currentIndex);
    return;
  }

  const clean = normalize(userAns);
  let score = 0;

  if (q.fullCheck(clean)) {
    score = 1.0;
  } else if (q.partialCheck(clean)) {
    score = 0.5;
  }

  results[q.id] = { score: score };
  loadQuestion(currentIndex);
}

function nextQuestion() {
  const q = questions[currentIndex];
  userAnswers[q.id] = document.getElementById("ansInput").value.trim();

  if (currentIndex < questions.length - 1) {
    currentIndex++;
    loadQuestion(currentIndex);
  } else {
    showSummary();
  }
}

function prevQuestion() {
  const q = questions[currentIndex];
  userAnswers[q.id] = document.getElementById("ansInput").value.trim();

  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion(currentIndex);
  }
}

function showSummary() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressContainer").style.display = "none";

  let totalScore = 0;
  for (let id in results) {
    totalScore += results[id].score;
  }

  const summary = document.getElementById("summaryCard");
  summary.style.display = "block";
  document.getElementById("finalScore").textContent = `${totalScore.toFixed(1)} / ${questions.length} p`;

  const feedback = document.getElementById("finalFeedback");
  const pct = (totalScore / questions.length) * 100;
  if (pct >= 85) feedback.textContent = "Grymt jobbat! Du har stenkoll på nätverksgrunderna inför provet.";
  else if (pct >= 50) feedback.textContent = "Bra jobbat! Vissa delar sitter bra, repetera gärna intervallen och beräkningarna en gång till.";
  else feedback.textContent = "Bra försök! Gå gärna igenom facit och gör om quizet för att nöta in detaljerna.";
}

function restartQuiz() {
  currentIndex = 0;
  userAnswers = {};
  results = {};
  document.getElementById("summaryCard").style.display = "none";
  document.getElementById("quizCard").style.display = "flex";
  document.getElementById("progressContainer").style.display = "block";
  loadQuestion(0);
}

window.onload = () => loadQuestion(0);
</script>
</body>
</html>
