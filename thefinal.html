<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nätverk & Adressering - Examensläge</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --correct-bg: rgba(34, 197, 94, 0.15);
      --correct-border: #22c55e;
      --wrong-bg: rgba(239, 68, 68, 0.15);
      --wrong-border: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 760px;
      width: 100%;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .progress-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #0b1120;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .question-title {
      font-size: 1.15rem;
      color: var(--text);
      margin-bottom: 1.2rem;
      line-height: 1.4;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      height: 130px;
      background: #0b1120;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.85rem;
      font-size: 0.95rem;
      line-height: 1.4;
      resize: vertical;
      margin-bottom: 1rem;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.65rem 1.4rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .feedback-box {
      display: none;
      margin-top: 1.2rem;
      padding: 1.2rem;
      border-radius: 6px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .feedback-box.correct {
      background: var(--correct-bg);
      border: 1px solid var(--correct-border);
    }

    .feedback-box.wrong {
      background: var(--wrong-bg);
      border: 1px solid var(--wrong-border);
    }

    .feedback-status {
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    .correct .feedback-status {
      color: var(--correct-border);
    }

    .wrong .feedback-status {
      color: var(--wrong-border);
    }

    .solution-text {
      margin-top: 0.5rem;
      color: #e2e8f0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 0.8rem;
    }

    .actions-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.5rem;
    }

    .summary-card {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
    }

    .summary-score {
      font-size: 2.2rem;
      color: var(--accent);
      font-weight: bold;
      margin: 1rem 0;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Nätverk & Adressering</h1>
    <p class="subtitle">Skärpt rättningsläge: Svara utförligt med både termer och förklaringar.</p>
  </header>

  <div class="progress-container" id="progress-container">
    <div class="progress-stats">
      <span id="question-indicator">Fråga 1 av 26</span>
      <span>Poäng: <strong id="score-counter">0</strong></span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="card" id="quiz-card">
    <div class="question-title" id="q-text"></div>
    <textarea id="user-input" placeholder="Skriv ett utförligt svar här..."></textarea>
    
    <div class="actions-row">
      <button class="btn" id="btn-submit" onclick="checkAnswer()">Svara</button>
      <button class="btn" id="btn-next" style="display: none;" onclick="nextQuestion()">Nästa fråga →</button>
    </div>

    <div class="feedback-box" id="feedback-box">
      <div class="feedback-status" id="feedback-status"></div>
      <div class="solution-text" id="solution-text"></div>
    </div>
  </div>

  <div class="summary-card" id="summary-card">
    <h2>Träning klar!</h2>
    <div class="summary-score" id="final-score"></div>
    <p id="final-comment" style="color: var(--text-muted); margin-bottom: 1.5rem;"></p>
    <button class="btn" onclick="restartQuiz()">Starta om omgången</button>
  </div>
</div>

<script>
const questions = [
  {
    q: "Vilka olika nätverkstyper finns det och var används de?",
    minLen: 60,
    groups: [
      ["pan", "bluetooth", "klocka", "nära"],
      ["lan", "lokalt", "hem", "skola", "kontor"],
      ["man", "stad", "kommun", "metropol"],
      ["wan", "internet", "värld", "land"]
    ],
    minGroups: 4,
    a: "<b>PAN:</b> Personligt och mycket nära (Bluetooth, klockor, hörlurar).<br><b>LAN:</b> Lokalt nätverk i ett hem, en skola eller ett kontor.<br><b>MAN:</b> Stadsnät som täcker en hel stad eller kommun.<br><b>WAN:</b> Stort nätverk över länder/världen (Internet)."
  },
  {
    q: "Vilka olika typer av topologier finns det och var används de?",
    minLen: 60,
    groups: [
      ["stjärn", "star", "switch"],
      ["buss", "bus", "fordon", "bil", "kabel"],
      ["ring", "cirkel", "stafett"],
      ["mesh", "redundans", "datacenter", "flera"],
      ["träd", "tree", "hybrid"]
    ],
    minGroups: 4,
    a: "<b>Stjärna:</b> Kopplas till central switch (hem/kontor).<br><b>Buss:</b> Sammankopplad gemensam kabel (bilar/fordon).<br><b>Ring:</b> Cirkulär överföring som stafettpinne (telekom).<br><b>Mesh:</b> Maskor med flera vägar för redundans (datacenter).<br><b>Träd:</b> Stjärnnät ihopkopplade i hierarki.<br><b>Hybrid:</b> Kombination av olika topologier."
  },
  {
    q: "Vilka typer av nätverksmedia finns det och vad för signaler skickar de?",
    minLen: 40,
    groups: [
      ["koppar", "el", "ström", "elektrisk"],
      ["fiber", "ljus"],
      ["trådlös", "radio", "vågor"]
    ],
    minGroups: 3,
    a: "<b>Koppar:</b> TP-kabel och antennkabel (koax) – skickar <b>el/elektriska signaler</b>.<br><b>Fiber:</b> Glas-/plastkabel – skickar <b>ljus</b>.<br><b>Trådlöst:</b> Wi-Fi/mobilnät – skickar <b>radiovågor</b>."
  },
  {
    q: "Ge exempel på bunden kommunikation.",
    minLen: 20,
    groups: [
      ["kabel", "fysisk", "trådbunden"],
      ["tp", "fiber", "koppar", "ledare"]
    ],
    minGroups: 2,
    a: "All kommunikation som går via en <b>fysisk kabel</b> (t.ex. TP-kabel, koaxialkabel eller fiber), alltså inte trådlöst via luften."
  },
  {
    q: "Vilka typer av TP-kablar finns det?",
    minLen: 30,
    groups: [
      ["utp", "oskärmad", "unshielded"],
      ["stp", "skärmad", "shielded"],
      ["cat", "cat5", "cat6", "kategor"]
    ],
    minGroups: 2,
    a: "<b>Skärmning:</b> UTP (oskärmad, billigast) och STP (metallskärm mot störningar).<br><b>Klasser:</b> Cat5e, Cat6, Cat6a, Cat7 och Cat8."
  },
  {
    q: "Vilken kapacitet har TP-kabeln och hur långt kan man sända?",
    minLen: 25,
    groups: [
      ["100", "meter"],
      ["gbps", "gbit", "hastighet", "1", "10"]
    ],
    minGroups: 2,
    a: "<b>Maxlängd:</b> Alltid max <b>100 meter</b>.<br><b>Hastighet:</b> Cat5e klarar 1 Gbps, Cat6/6a upp till 10 Gbps (Cat8 upp till 40 Gbps på korta sträckor)."
  },
  {
    q: "Beskriv en koaxialkabel och vilka fördelar och nackdelar den har.",
    minLen: 40,
    groups: [
      ["koppar", "ledare", "skärm"],
      ["störning", "tål", "stryk", "skydd"],
      ["styv", "svår", "böja", "långsam", "kapacitet"]
    ],
    minGroups: 3,
    a: "<b>Uppbyggnad:</b> Tjock koppartråd, plastisolering och yttre metallskärm.<br><b>Fördel:</b> Tål störningar jättebra och tål fysiskt stryk.<br><b>Nackdel:</b> Styv, svår att böja och har lägre kapacitet än modern fiber."
  },
  {
    q: "Vilka typer av fiberkablar finns det?",
    minLen: 45,
    groups: [
      ["singlemode", "single", "smf"],
      ["multimode", "multi", "mmf"],
      ["laser"],
      ["led", "ljusdiod"],
      ["lång", "mil", "kort"]
    ],
    minGroups: 4,
    a: "<b>Singlemode:</b> Supertunn kärna, använder laser, för långa sträckor (flera mil).<br><b>Multimode:</b> Tjockare kärna, enklare ljus (LED), för korta sträckor (inom byggnad/datacenter)."
  },
  {
    q: "Hur fungerar en fiberkabel rent tekniskt?",
    minLen: 40,
    groups: [
      ["ljus", "blixt", "puls"],
      ["studs", "totalreflektion", "reflek"],
      ["fotodiod", "mottagare", "diod", "ettor"]
    ],
    minGroups: 2,
    a: "Data görs om till ljusblixtar. Ljuset studsar inuti glastråden genom <b>totalreflektion</b> hela vägen till en <b>fotodiod</b> som omvandlar ljuset till ettor och nollor igen."
  },
  {
    q: "Vilka fördelar finns det med fiberkabel?",
    minLen: 30,
    groups: [
      ["snabb", "kapacitet", "hastighet"],
      ["störning", "åska", "el"],
      ["lång", "mil", "räckvidd"],
      ["avlyssn", "säker"]
    ],
    minGroups: 2,
    a: "1. Extrem kapacitet och hastighet.<br>2. Helt okänsligt för elstörningar och åska.<br>3. Enorm räckvidd (mil utan repeater).<br>4. Mycket svårt att avlyssna obemärkt."
  },
  {
    q: "Hur är en MAC-adress uppbyggd?",
    minLen: 30,
    groups: [
      ["6", "sex", "48"],
      ["byte", "bit"],
      ["oui", "tillverk"],
      ["nic", "serienummer", "unik"]
    ],
    minGroups: 3,
    a: "Består av <b>6 bytes (48 bitar)</b>.<br>• De 3 första byten visar vem som är tillverkare (<b>OUI</b>).<br>• De 3 sista byten är nätverkskortets unika serienummer (<b>NIC</b>)."
  },
  {
    q: "Vad är en MAC-adress?",
    minLen: 25,
    groups: [
      ["fysisk", "hårdvara", "kort"],
      ["personnummer", "unik", "identifier"],
      ["inbränd", "fabrik", "ändras inte"]
    ],
    minGroups: 2,
    a: "Nätverkskortets unika <b>fysiska adress ('personnummer')</b> som är inbränd på kortet från fabriken och i grunden aldrig ändras."
  },
  {
    q: "Vilka nätverksklasser finns det och ge exempel på adresser?",
    minLen: 45,
    groups: [
      ["klass a", "a:", "1-126", "1–126", "10."],
      ["klass b", "b:", "128-191", "128–191", "172."],
      ["klass c", "c:", "192-223", "192–223", "192.168"]
    ],
    minGroups: 3,
    a: "<b>Klass A:</b> 1–126 (Ex: 10.0.0.1) – för jättestora nätverk.<br><b>Klass B:</b> 128–191 (Ex: 172.16.0.1) – för mellanstora nätverk.<br><b>Klass C:</b> 192–223 (Ex: 192.168.1.1) – för små nät/hemmanätverk."
  },
  {
    q: "Hur räknar man ut Host-ID? (Husnumret)",
    minLen: 35,
    groups: [
      ["ta bort", "nätverk", "där masken", "respektive"],
      ["kvar", "över", "siffror", "host", "husnummer", ".25"]
    ],
    minGroups: 2,
    a: "Man tar bort nätverksdelen från IP-adressen (där masken har 255) – siffrorna som blir kvar är Host-ID.<br><i>Exempel:</i> IP 192.168.1.25 med mask 255.255.255.0 ger Host-ID <b>.25</b>."
  },
  {
    q: "Hur räknar man ut Net-ID? (Gatunamnet)",
    minLen: 35,
    groups: [
      ["and", "jämför", "mask"],
      ["255", "behåll", "samma"],
      ["noll", "0", "192.168.1.0"]
    ],
    minGroups: 2,
    a: "Man gör en AND-operation mellan IP-adressen och subnätmasken. Där masken har 255 behålls siffrorna, resten blir nollor.<br><i>Exempel:</i> IP 192.168.1.25 med mask 255.255.255.0 ger Net-ID <b>192.168.1.0</b>."
  },
  {
    q: "Vilka adresser har Klass A?",
    minLen: 15,
    groups: [
      ["1", "126", "1-126", "1–126"],
      ["255.0.0.0", "/8"]
    ],
    minGroups: 2,
    a: "Adresser som börjar på <b>1 – 126</b> (Standardmask: <b>255.0.0.0</b> eller /8)."
  },
  {
    q: "Hur många nätverk kan Klass A ha?",
    minLen: 3,
    groups: [
      ["126"]
    ],
    minGroups: 1,
    a: "<b>126 stycken</b> (2^7 minus 0 och 127 som är reserverade)."
  },
  {
    q: "Hur många värdenheter kan Klass A ha?",
    minLen: 4,
    groups: [
      ["16", "miljon", "16777214", "16 777 214"]
    ],
    minGroups: 1,
    a: "Cirka 16,7 miljoner per nätverk (exakt <b>16 777 214 st</b>)."
  },
  {
    q: "Vilka adresser har Klass B?",
    minLen: 15,
    groups: [
      ["128", "191", "128-191", "128–191"],
      ["255.255.0.0", "/16"]
    ],
    minGroups: 2,
    a: "Adresser som börjar på <b>128 – 191</b> (Standardmask: <b>255.255.0.0</b> eller /16). 127 är reserverat för loopback."
  },
  {
    q: "Hur många nätverk kan Klass B ha?",
    minLen: 4,
    groups: [
      ["16 384", "16384", "16 tusen"]
    ],
    minGroups: 1,
    a: "<b>16 384 stycken</b> (cirka 16 tusen)."
  },
  {
    q: "Hur många värdenheter kan Klass B ha?",
    minLen: 4,
    groups: [
      ["65 534", "65534"]
    ],
    minGroups: 1,
    a: "<b>65 534 stycken</b> per nätverk."
  },
  {
    q: "Vilka adresser har Klass C?",
    minLen: 15,
    groups: [
      ["192", "223", "192-223", "192–223"],
      ["255.255.255.0", "/24"]
    ],
    minGroups: 2,
    a: "Adresser som börjar på <b>192 – 223</b> (Standardmask: <b>255.255.255.0</b> eller /24). Slutar på 223!"
  },
  {
    q: "Hur många nätverk kan Klass C ha?",
    minLen: 4,
    groups: [
      ["2,1", "2.1", "miljon", "2097152", "2 097 152"]
    ],
    minGroups: 1,
    a: "Cirka 2,1 miljoner stycken (exakt <b>2 097 152 st</b>)."
  },
  {
    q: "Hur många värdenheter kan Klass C ha?",
    minLen: 3,
    groups: [
      ["254"]
    ],
    minGroups: 1,
    a: "<b>254 stycken</b> per nätverk (256 minus Net-ID och Broadcast)."
  },
  {
    q: "Vad är en Default Gateway?",
    minLen: 30,
    groups: [
      ["router", "ip"],
      ["lokal", "eget nät"],
      ["dörr", "väg ut", "andra nät", "internet"]
    ],
    minGroups: 2,
    a: "Routerns IP-adress på det lokala nätet. Det fungerar som 'dörren ut' dit datorn skickar all trafik som ska till andra nätverk eller Internet."
  },
  {
    q: "Vilka olika typer av IPv4-adresser finns det?",
    minLen: 40,
    groups: [
      ["unicast"],
      ["multicast"],
      ["broadcast"],
      ["loopback", "127.0.0.1"],
      ["link-local", "apipa", "169.254"]
    ],
    minGroups: 4,
    a: "• <b>Unicast:</b> Skickar till en enskild enhet.<br>• <b>Multicast:</b> Skickar till en definierad grupp.<br>• <b>Broadcast:</b> Skickar till alla på lokala nätet.<br>• <b>Loopback:</b> Datorn testar sig själv internt (127.0.0.1).<br>• <b>Link-local:</b> Automatisk adress vid DHCP-avbrott (169.254.x.x).<br>• <b>Unspecified:</b> Startadress (0.0.0.0)."
  }
];

let currentIndex = 0;
let score = 0;
let answered = false;

function loadQuestion() {
  answered = false;
  const current = questions[currentIndex];
  document.getElementById("question-indicator").innerText = `Fråga ${currentIndex + 1} av ${questions.length}`;
  document.getElementById("score-counter").innerText = score;
  document.getElementById("progress-fill").style.width = `${(currentIndex / questions.length) * 100}%`;
  
  document.getElementById("q-text").innerText = `${currentIndex + 1}. ${current.q}`;
  const input = document.getElementById("user-input");
  input.value = "";
  input.disabled = false;
  input.focus();
  
  const feedbackBox = document.getElementById("feedback-box");
  feedbackBox.style.display = "none";
  feedbackBox.className = "feedback-box";
  
  document.getElementById("btn-submit").style.display = "inline-block";
  document.getElementById("btn-next").style.display = "none";
}

function checkAnswer() {
  if (answered) return;
  
  const userText = document.getElementById("user-input").value.trim().toLowerCase();
  const current = questions[currentIndex];
  
  if (!userText) {
    alert("Skriv ett svar först!");
    return;
  }

  // 1. Kontrollera längd
  if (userText.length < current.minLen) {
    alert(`Svaret är för kort! Du måste förklara mer utförligt (minst ${current.minLen} tecken).`);
    return;
  }
  
  answered = true;
  document.getElementById("user-input").disabled = true;
  document.getElementById("btn-submit").style.display = "none";
  document.getElementById("btn-next").style.display = "inline-block";

  // 2. Kontrollera att tillräckligt många obligatoriska begrepp/grupper finns med
  let matchedGroups = 0;
  current.groups.forEach(group => {
    const hasMatch = group.some(term => userText.includes(term));
    if (hasMatch) matchedGroups++;
  });

  const isCorrect = matchedGroups >= current.minGroups;
  const feedbackBox = document.getElementById("feedback-box");
  const statusEl = document.getElementById("feedback-status");
  const solutionEl = document.getElementById("solution-text");

  if (isCorrect) {
    score++;
    document.getElementById("score-counter").innerText = score;
    feedbackBox.className = "feedback-box correct";
    statusEl.innerHTML = "✓ Godkänt & utförligt svar!";
  } else {
    feedbackBox.className = "feedback-box wrong";
    statusEl.innerHTML = "✕ Ej fullt godkänt: Svaret saknade viktiga förklaringar eller begrepp.";
  }

  solutionEl.innerHTML = `<strong>Facit / Komplett svar:</strong><br>${current.a}`;
  feedbackBox.style.display = "block";
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < questions.length) {
    loadQuestion();
  } else {
    showSummary();
  }
}

function showSummary() {
  document.getElementById("quiz-card").style.display = "none";
  document.getElementById("progress-container").style.display = "none";
  
  const summaryCard = document.getElementById("summary-card");
  summaryCard.style.display = "block";
  
  const percentage = Math.round((score / questions.length) * 100);
  document.getElementById("final-score").innerText = `${score} / ${questions.length} rätt (${percentage}%)`;
  
  let comment = "";
  if (percentage >= 90) comment = "Mästerligt! Du behärskar både terminologin och förklaringarna.";
  else if (percentage >= 70) comment = "Mycket bra! Gå igenom de frågor där detaljer saknades.";
  else comment = "Kör ett varv till och fokusera på att skriva ut vad termerna faktiskt gör!";
  
  document.getElementById("final-comment").innerText = comment;
}

function restartQuiz() {
  currentIndex = 0;
  score = 0;
  document.getElementById("quiz-card").style.display = "block";
  document.getElementById("progress-container").style.display = "flex";
  document.getElementById("summary-card").style.display = "none";
  loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
