<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nätverksquiz - 26 Frågor (Fullständig Repetition)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border: #334155;
      --correct: #22c55e;
      --partial: #eab308;
      --wrong: #ef4444;
      --badge-bg: #1e1b4b;
      --badge-txt: #818cf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.85rem;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .smart-badge {
      display: inline-block;
      background: var(--badge-bg);
      border: 1px solid var(--badge-txt);
      color: var(--badge-txt);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 3px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .progress-container {
      margin-bottom: 18px;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #818cf8);
      transition: width 0.3s ease;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      min-height: 310px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .q-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .q-title {
      font-weight: 600;
      font-size: 1.2rem;
      line-height: 1.4;
    }

    .q-badge {
      background: #0f172a;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--accent);
      white-space: nowrap;
      border: 1px solid var(--border);
    }

    .hint-toggle {
      background: none;
      border: none;
      color: #fbbf24;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 12px;
      align-self: flex-start;
      padding: 0;
    }

    .hint-box {
      display: none;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: rgba(245, 158, 11, 0.08);
      border-left: 3px solid #f59e0b;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #fde68a;
    }

    .input-wrapper {
      margin-top: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b1120;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .result-box {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .result-correct {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid var(--correct);
      color: #86efac;
    }

    .result-partial {
      background: rgba(234, 179, 8, 0.12);
      border: 1px solid var(--partial);
      color: #fde047;
    }

    .result-wrong {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--wrong);
      color: #fca5a5;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      gap: 12px;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-submit {
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-nav {
      background: #334155;
      color: #fff;
    }

    .btn-nav:hover:not(:disabled) {
      background: #475569;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .summary-card {
      display: none;
      background: var(--card-bg);
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 36px 20px;
      text-align: center;
    }

    .summary-score {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent);
      margin: 12px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="smart-badge">⚡ Direkt rättning med tolerans</div>
    <h1>Nätverksquiz: Fullständig Repetition</h1>
  </header>

  <div class="progress-container" id="progressContainer">
    <div class="progress-labels">
      <span id="stepLabel">Fråga 1 av 26</span>
      <span id="scoreLabel">Poäng: 0.0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="card" id="quizCard">
    <div>
      <div class="q-top">
        <div class="q-title" id="qTitle">Laddar fråga...</div>
        <div class="q-badge" id="qBadge">1.0 p</div>
      </div>

      <button type="button" class="hint-toggle" onclick="toggleHint()">💡 Visa ledtråd</button>
      <div class="hint-box" id="qHint"></div>

      <div class="input-wrapper">
        <input type="text" id="ansInput" placeholder="Skriv ditt svar här..." autocomplete="off" onkeydown="handleKey(event)" />
      </div>

      <div class="result-box" id="resBox"></div>
    </div>

    <div class="card-actions">
      <button type="button" class="btn btn-nav" id="btnPrev" onclick="prevQuestion()" disabled>← Föregående</button>
      <button type="button" class="btn btn-submit" id="btnCheck" onclick="submitAnswer()">Rätta svar</button>
      <button type="button" class="btn btn-nav" id="btnNext" onclick="nextQuestion()">Nästa →</button>
    </div>
  </div>

  <div class="summary-card" id="summaryCard">
    <h2>Resultat</h2>
    <div class="summary-score" id="finalScore">0 / 26</div>
    <p id="finalFeedback" style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 24px;"></p>
    <button type="button" class="btn btn-submit" onclick="restartQuiz()">🔄 Gör om quizet</button>
  </div>
</div>

<script>
const questions = [
  {
    id: 1,
    q: "Vilka olika nätverkstyper finns det och var används de?",
    hint: "PAN, LAN, MAN, WAN – ange minst vad två av dem används till (t.ex. bluetooth, lokalt/hem, stad, internet).",
    fullCheck: (t) => (t.includes("pan") && t.includes("lan") && t.includes("man") && t.includes("wan")) && (t.includes("bluetooth") || t.includes("klock") || t.includes("hem") || t.includes("lokal") || t.includes("stad") || t.includes("internet")),
    partialCheck: (t) => t.includes("pan") && t.includes("lan") && t.includes("man") && t.includes("wan"),
    expl: "PAN: Personligt och nära (Bluetooth-lurar, smartklocka). LAN: Lokalt nätverk (hem, skola, kontor). MAN: Stadsnät inom en stad/kommun. WAN: Stora geografiska avstånd (stamnät, Internet)."
  },
  {
    id: 2,
    q: "Vilka olika typer av topologier finns det och var används de?",
    hint: "Stjärna, buss, ring, mesh, träd. Ange minst ett användningsområde (t.ex. switch/kontor, CAN-buss/fordon, datacenter).",
    fullCheck: (t) => {
      let count = 0;
      ["stjärn", "buss", "ring", "mesh", "träd", "hybrid"].forEach(w => { if (t.includes(w)) count++; });
      return count >= 3 && (t.includes("switch") || t.includes("fordon") || t.includes("bil") || t.includes("can") || t.includes("datacenter") || t.includes("telekom") || t.includes("kontor"));
    },
    partialCheck: (t) => {
      let count = 0;
      ["stjärn", "buss", "ring", "mesh", "träd", "hybrid"].forEach(w => { if (t.includes(w)) count++; });
      return count >= 3;
    },
    expl: "Stjärna: Central switch (dominerar LAN hemma/kontor). Buss: Gemensam kabel (fordon/CAN-bus för att spara kabel). Ring: Stafettpinne/slinga (telekom/FDDI). Mesh: Flera vägar (datacenter/internet). Träd: Flernivå-hierarki av stjärnnät."
  },
  {
    id: 3,
    q: "Vilka typer av nätverksmedia finns det?",
    hint: "Kopparkabel, fiberoptik och trådlösa medier. Vilka signaler skickas?",
    fullCheck: (t) => (t.includes("koppar") || t.includes("tp")) && t.includes("fiber") && (t.includes("trådlös") || t.includes("wifi") || t.includes("radio")),
    partialCheck: (t) => (t.includes("koppar") && t.includes("fiber")) || t.includes("trådlös"),
    expl: "Kopparkabel: TP (UTP/STP) och koax (elektriska signaler). Fiberoptik: Singlemode och Multimode (ljussignaler i glas/plast). Trådlösa media: Radiovågor (Wi-Fi, 4G/5G)."
  },
  {
    id: 4,
    q: "Ge exempel på bunden kommunikation.",
    hint: "Kommunikation via fysiska kablar till skillnad från obunden (Wi-Fi).",
    fullCheck: (t) => (t.includes("kabel") || t.includes("fysisk") || t.includes("bunden")) && (t.includes("tp") || t.includes("fiber") || t.includes("koppar") || t.includes("koax")),
    partialCheck: (t) => t.includes("kabel") || t.includes("tp") || t.includes("fiber"),
    expl: "Kommunikation via fysiska kablar: partvinnad nätverkskabel (TP), koaxialkabel eller fiberoptisk kabel (till skillnad från obunden kommunikation som Wi-Fi)."
  },
  {
    id: 5,
    q: "Vilka typer av TP-kablar finns det?",
    hint: "Skärmning (UTP, STP/FTP) och kategorier (Cat5e, Cat6, Cat6a, etc.).",
    fullCheck: (t) => (t.includes("utp") && (t.includes("stp") || t.includes("ftp"))) && (t.includes("cat") || t.includes("skärm")),
    partialCheck: (t) => t.includes("utp") || t.includes("stp") || t.includes("cat5") || t.includes("cat6"),
    expl: "Skärmningstyper: UTP (oskärmad) och STP/FTP (skärmad med metallfolie mot EMI). Prestandaklasser: Cat5e, Cat6, Cat6a, Cat7, Cat8."
  },
  {
    id: 6,
    q: "Vilken kapacitet har TP-kabeln och hur långt kan man sända?",
    hint: "Standard maxlängd är 100 m. Ange hastighet för Cat5e/Cat6.",
    fullCheck: (t) => (t.includes("100") || t.includes("hundra")) && (t.includes("gbps") || t.includes("gbit") || t.includes("10") || t.includes("1")),
    partialCheck: (t) => t.includes("100") || t.includes("gbps") || t.includes("gbit"),
    expl: "Maximal räckvidd är alltid 100 meter (90 m fast installation + 10 m patch). Kapacitet: Cat5e ger 1 Gbps, Cat6 ger 1 Gbps (10 Gbps upp till 55 m), Cat6a ger 10 Gbps hela 100 m, Cat8 ger 25–40 Gbps upp till 30 m."
  },
  {
    id: 7,
    q: "Beskriv en koaxialkabel och vilka fördelar och nackdelar den har.",
    hint: "Centrumledare i koppar med skärm. Tål yttre störningar, men är styv med begränsad bandbredd.",
    fullCheck: (t) => (t.includes("koppar") || t.includes("skärm")) && (t.includes("störning") || t.includes("tål")) && (t.includes("styv") || t.includes("böj") || t.includes("lägre") || t.includes("dyr")),
    partialCheck: (t) => (t.includes("koppar") || t.includes("skärm")) && (t.includes("störning") || t.includes("tål") || t.includes("styv")),
    expl: "Uppbyggnad: Centrumledare i koppar, isolering, skärmande metallfläta och skyddshölje. Fördel: Mycket god immunitet mot elektromagnetiska störningar och tål stryk. Nackdel: Styv, svårböjd och lägre bandbredd än fiber/Cat6a."
  },
  {
    id: 8,
    q: "Vilka typer av fiberkablar finns det?",
    hint: "Singlemode (SMF) och Multimode (MMF). Tänk på kärna, ljuskälla och räckvidd.",
    fullCheck: (t) => (t.includes("singlemode") || t.includes("smf") || t.includes("single")) && (t.includes("multimode") || t.includes("mmf") || t.includes("multi")) && (t.includes("laser") || t.includes("led") || t.includes("lång") || t.includes("mil") || t.includes("tunn")),
    partialCheck: (t) => t.includes("singlemode") || t.includes("multimode") || t.includes("smf") || t.includes("mmf"),
    expl: "Singlemode (SMF): Tunn kärna (~9 µm), använder laserljus för milslånga sträckor (MAN/WAN). Multimode (MMF): Grövre kärna (50/62,5 µm), använder LED/VCSEL för korta sträckor (LAN/datacenter, max ~500 m)."
  },
  {
    id: 9,
    q: "Hur fungerar en fiberkabel?",
    hint: "Ettor och nollor blir ljus, studsar via totalreflektion till en fotodiod.",
    fullCheck: (t) => (t.includes("ljus") || t.includes("laser")) && (t.includes("totalreflektion") || t.includes("studs")) && (t.includes("fotodiod") || t.includes("mottag") || t.includes("elektrisk") || t.includes("ettor")),
    partialCheck: (t) => t.includes("ljus") && (t.includes("totalreflektion") || t.includes("studs") || t.includes("fotodiod")),
    expl: "Data moduleras om till ljuspulser via laser eller lysdiod. Ljuset stannar kvar i glaskärnan genom totalreflektion mot manteln tills det når en fotodiod som gör om det till en elektrisk signal igen."
  },
  {
    id: 10,
    q: "Vilka fördelar finns det med fiberkabel?",
    hint: "Störningsimmunitet mot åska/EMI, bandbredd, räckvidd och avlyssningsskydd.",
    fullCheck: (t) => {
      let count = 0;
      ["störning", "åska", "emi", "snabb", "bandbredd", "mil", "lång", "avlyssn"].forEach(w => { if (t.includes(w)) count++; });
      return count >= 2;
    },
    partialCheck: (t) => t.includes("störning") || t.includes("snabb") || t.includes("avlyssn") || t.includes("lång"),
    expl: "Fullständigt okänslig för EMI och åska, extremt hög bandbredd och hastighet, mycket låg dämpning (milslång räckvidd utan förstärkare) samt mycket svår att avlyssna utan avbrott."
  },
  {
    id: 11,
    q: "Hur är en MAC-adress uppbyggd?",
    hint: "6 bytes (48 bitar). Vad visar de 3 första byten och vad visar de 3 sista?",
    fullCheck: (t) => (t.includes("6 byte") || t.includes("48 bit") || t.includes("48")) && (t.includes("oui") || t.includes("tillverk")) && (t.includes("nic") || t.includes("serienummer") || t.includes("unik") || t.includes("kort")),
    partialCheck: (t) => t.includes("48") || t.includes("6 byte") || t.includes("oui") || t.includes("tillverk"),
    expl: "Den är på 6 bytes (48 bitar / 12 hex-tecken). De 3 första byten är OUI (tillverkaren, tilldelad av IEEE) och de 3 sista byten är nätverkskortets unika serienummer (NIC)."
  },
  {
    id: 12,
    q: "Vad är en MAC-adress?",
    hint: "Nätverkskortets unika fysiska adress inbränd från fabriken.",
    fullCheck: (t) => (t.includes("fysisk") || t.includes("inbränd") || t.includes("hårdvar")) && (t.includes("personnummer") || t.includes("unik") || t.includes("kort")),
    partialCheck: (t) => t.includes("personnummer") || t.includes("fysisk") || t.includes("unik"),
    expl: "Nätverkskortets unika fysiska hårdvaruadress ('personnummer'). Den är inbränd på kortet från fabriken och ändras i grunden aldrig."
  },
  {
    id: 13,
    q: "Vilka nätverksklasser finns det och ge exempel?",
    hint: "Klass A, B och C – ange exempel på adresser som tillhör respektive klass.",
    fullCheck: (t) => (t.includes("klass a") || t.includes("1-126")) && (t.includes("klass b") || t.includes("128-191")) && (t.includes("klass c") || t.includes("192-223")),
    partialCheck: (t) => t.includes("klass a") || t.includes("klass b") || t.includes("klass c"),
    expl: "Klass A: 1–126 (t.ex. 10.0.0.1) för storföretag. Klass B: 128–191 (t.ex. 172.16.0.1) för mellanstora nät. Klass C: 192–223 (t.ex. 192.168.1.1) för små nät/hemmanät."
  },
  {
    id: 14,
    q: "Hur räknar man ut Host-ID (husnumret)?",
    hint: "Ta bort nätverksdelen där subnätmasken har 255.",
    fullCheck: (t) => (t.includes("ta bort") || t.includes("kvar") || t.includes("rest") || t.includes("över")) && (t.includes("nät") || t.includes("mask") || t.includes("255") || t.includes("25")),
    partialCheck: (t) => t.includes("kvar") || t.includes("mask") || t.includes("25"),
    expl: "Man tar IP-adressen och tar bort nätverksdelen (där masken har 255) – siffrorna som blir över är Host-ID. Ex: IP 192.168.1.25 med /24 ger Host-ID .25."
  },
  {
    id: 15,
    q: "Hur räknar man ut Net-ID (gatunamnet)?",
    hint: "Matematisk jämförelse med subnätmasken – vilken logisk operation används?",
    fullCheck: (t) => (t.includes("and") || t.includes("logisk")) && (t.includes("mask") || t.includes("255") || t.includes("noll") || t.includes("192.168.1.0")),
    partialCheck: (t) => t.includes("and") || t.includes("mask") || t.includes("255"),
    expl: "Man gör en matematisk AND-jämförelse mellan IP-adressen och subnätmasken. Där masken har 255 behålls siffrorna, resten blir nollor (t.ex. 192.168.1.0)."
  },
  {
    id: 16,
    q: "Vilka adresser har Klass A?",
    hint: "Intervall som börjar på 1 och standardmasken (/8).",
    fullCheck: (t) => (t.includes("1-126") || (t.includes("1") && t.includes("126"))) && (t.includes("255.0.0.0") || t.includes("/8")),
    partialCheck: (t) => t.includes("1-126") || t.includes("126") || t.includes("255.0.0.0") || t.includes("/8"),
    expl: "Adresser som börjar på 1 – 126. Standardmask: 255.0.0.0 (/8). Första biten är alltid låst till 0."
  },
  {
    id: 17,
    q: "Hur många nätverk kan Klass A ha och varför?",
    hint: "126 stycken (2^7 minus nätverk 0 och 127).",
    fullCheck: (t) => t.includes("126") && (t.includes("127") || t.includes("loopback") || t.includes("reserverad") || t.includes("2^7")),
    partialCheck: (t) => t.includes("126"),
    expl: "126 stycken användbara nät-ID (2^7 = 128 minus nätverk 0 och 127 som är reserverade för loopback)."
  },
  {
    id: 18,
    q: "Hur många värdenheter kan Klass A ha?",
    hint: "2^24 minus 2. Cirka 16,7 miljoner.",
    fullCheck: (t) => t.includes("16 777 214") || t.includes("16777214") || t.includes("16,7 miljon") || t.includes("16.7 miljon"),
    partialCheck: (t) => t.includes("16") && (t.includes("miljon") || t.includes("777")),
    expl: "Cirka 16,7 miljoner per nätverk (exakt 16 777 214 st via formeln 2^24 - 2)."
  },
  {
    id: 19,
    q: "Vilka adresser har Klass B?",
    hint: "Intervall som börjar på 128 (efter loopback) och standardmasken (/16).",
    fullCheck: (t) => (t.includes("128") && t.includes("191")) && (t.includes("255.255.0.0") || t.includes("/16") || t.includes("loopback")),
    partialCheck: (t) => (t.includes("128") && t.includes("191")) || t.includes("255.255.0.0"),
    expl: "Adresser som börjar på 128 – 191 (Standardmask: 255.255.0.0 eller /16). Man hoppar över 127 för loopback."
  },
  {
    id: 20,
    q: "Hur många nätverk kan Klass B ha?",
    hint: "2^14 – cirka 16 tusen.",
    fullCheck: (t) => t.includes("16 384") || t.includes("16384") || (t.includes("16") && t.includes("tusen")),
    partialCheck: (t) => t.includes("16"),
    expl: "16 384 stycken nät-ID (2^14)."
  },
  {
    id: 21,
    q: "Hur många värdenheter kan Klass B ha?",
    hint: "2^16 minus 2 – drygt 65 tusen.",
    fullCheck: (t) => t.includes("65 534") || t.includes("65534") || (t.includes("65") && t.includes("tusen")),
    partialCheck: (t) => t.includes("65"),
    expl: "65 534 stycken användbara värdenheter per nätverk (2^16 - 2)."
  },
  {
    id: 22,
    q: "Vilka adresser har Klass C?",
    hint: "Börjar på 192 och slutar på 223 (inte 255/256!). Standardmask /24.",
    fullCheck: (t) => (t.includes("192") && t.includes("223")) && (t.includes("255.255.255.0") || t.includes("/24") || t.includes("223")),
    partialCheck: (t) => (t.includes("192") && t.includes("223")) || t.includes("255.255.255.0"),
    expl: "Adresser som börjar på 192 – 223 (Standardmask: 255.255.255.0 eller /24). Obs: Slutar på 223, inte 256!"
  },
  {
    id: 23,
    q: "Hur många nätverk kan Klass C ha?",
    hint: "2^21 – cirka 2,1 miljoner.",
    fullCheck: (t) => t.includes("2 097 152") || t.includes("2097152") || (t.includes("2") && t.includes("miljon")),
    partialCheck: (t) => t.includes("2") || t.includes("miljon"),
    expl: "Cirka 2,1 miljoner stycken (exakt 2 097 152 st via 2^21)."
  },
  {
    id: 24,
    q: "Hur många värdenheter kan Klass C ha?",
    hint: "2^8 minus 2 (nätverksadress och broadcast borträknade).",
    fullCheck: (t) => t.includes("254"),
    partialCheck: (t) => t.includes("256"),
    expl: "254 stycken per nätverk (256 minus 2 = 254)."
  },
  {
    id: 25,
    q: "Vad är en Default Gateway?",
    hint: "Routerns lokala IP-adress som fungerar som dörren ut mot andra nät och internet.",
    fullCheck: (t) => (t.includes("router") || t.includes("gateway")) && (t.includes("dörr") || t.includes("andra nät") || t.includes("internet") || t.includes("lokal") || t.includes("skicka")),
    partialCheck: (t) => t.includes("router") || t.includes("gateway") || t.includes("dörr"),
    expl: "Routerns IP-adress på det lokala nätet. Det är 'dörren ut' dit datorn skickar all trafik när mottagaren finns på ett annat nätverk eller på Internet."
  },
  {
    id: 26,
    q: "Vilka olika typer av IPv4-adresser/sändningstyper finns det?",
    hint: "Nämn minst tre: Unicast, Multicast, Broadcast, Loopback, Link-local, Unspecified.",
    fullCheck: (t) => {
      let count = 0;
      ["unicast", "multicast", "broadcast", "loopback", "link-local", "unspecified", "127.0.0.1", "169.254"].forEach(w => { if (t.includes(w)) count++; });
      return count >= 3;
    },
    partialCheck: (t) => {
      let count = 0;
      ["unicast", "multicast", "broadcast", "loopback", "link-local", "unspecified"].forEach(w => { if (t.includes(w)) count++; });
      return count >= 1;
    },
    expl: "Unicast (till en dator), Multicast (till en grupp), Broadcast (till alla på lokala nätet), Loopback (interntest 127.0.0.1), Link-local (APIPA 169.254.x.x vid saknad DHCP), Unspecified (0.0.0.0 vid boot)."
  }
];

let currentIndex = 0;
let userAnswers = {};
let results = {};

function toggleHint() {
  const box = document.getElementById("qHint");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function handleKey(e) {
  if (e.key === "Enter") {
    submitAnswer();
  }
}

function normalize(str) {
  return str.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, " ").replace(/\s+/g, " ").trim();
}

function updateProgress() {
  const total = questions.length;
  const pct = ((currentIndex + 1) / total) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("stepLabel").textContent = `Fråga ${currentIndex + 1} av ${total}`;

  let totalScore = 0;
  for (let id in results) {
    totalScore += results[id].score;
  }
  document.getElementById("scoreLabel").textContent = `Poäng: ${totalScore.toFixed(1)}`;
}

function loadQuestion(idx) {
  const q = questions[idx];
  document.getElementById("qTitle").textContent = `${idx + 1}. ${q.q}`;
  document.getElementById("qHint").textContent = q.hint;
  document.getElementById("qHint").style.display = "none";

  const input = document.getElementById("ansInput");
  input.value = userAnswers[q.id] || "";
  input.focus();

  const resBox = document.getElementById("resBox");
  const badge = document.getElementById("qBadge");

  if (results[q.id]) {
    const res = results[q.id];
    resBox.style.display = "block";
    if (res.score >= 1.0) {
      resBox.className = "result-box result-correct";
      resBox.innerHTML = `<strong>Rätt! (1.0 p)</strong><br>${q.expl}`;
      badge.textContent = "1.0 / 1.0 p";
      badge.style.borderColor = "var(--correct)";
      badge.style.color = "#86efac";
    } else if (res.score >= 0.5) {
      resBox.className = "result-box result-partial";
      resBox.innerHTML = `<strong>Delvis rätt / nära! (0.5 p)</strong><br>${q.expl}`;
      badge.textContent = "0.5 / 1.0 p";
      badge.style.borderColor = "var(--partial)";
      badge.style.color = "#fde047";
    } else {
      resBox.className = "result-box result-wrong";
      resBox.innerHTML = `<strong>Inte riktigt (0.0 p)</strong><br><strong>Facit:</strong> ${q.expl}`;
      badge.textContent = "0.0 / 1.0 p";
      badge.style.borderColor = "var(--wrong)";
      badge.style.color = "#fca5a5";
    }
  } else {
    resBox.style.display = "none";
    badge.textContent = "1.0 p";
    badge.style.borderColor = "var(--border)";
    badge.style.color = "var(--accent)";
  }

  document.getElementById("btnPrev").disabled = (idx === 0);
  document.getElementById("btnNext").textContent = (idx === questions.length - 1) ? "Visa resultat →" : "Nästa →";
  updateProgress();
}

function submitAnswer() {
  const q = questions[currentIndex];
  const input = document.getElementById("ansInput");
  const userAns = input.value.trim();
  userAnswers[q.id] = userAns;

  if (!userAns) {
    results[q.id] = { score: 0 };
    loadQuestion(currentIndex);
    return;
  }

  const clean = normalize(userAns);
  let score = 0;

  if (q.fullCheck(clean)) {
    score = 1.0;
  } else if (q.partialCheck(clean)) {
    score = 0.5;
  }

  results[q.id] = { score: score };
  loadQuestion(currentIndex);
}

function nextQuestion() {
  const q = questions[currentIndex];
  userAnswers[q.id] = document.getElementById("ansInput").value.trim();

  if (currentIndex < questions.length - 1) {
    currentIndex++;
    loadQuestion(currentIndex);
  } else {
    showSummary();
  }
}

function prevQuestion() {
  const q = questions[currentIndex];
  userAnswers[q.id] = document.getElementById("ansInput").value.trim();

  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion(currentIndex);
  }
}

function showSummary() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressContainer").style.display = "none";

  let totalScore = 0;
  for (let id in results) {
    totalScore += results[id].score;
  }

  const summary = document.getElementById("summaryCard");
  summary.style.display = "block";
  document.getElementById("finalScore").textContent = `${totalScore.toFixed(1)} / ${questions.length} p`;

  const feedback = document.getElementById("finalFeedback");
  const pct = (totalScore / questions.length) * 100;
  if (pct >= 85) feedback.textContent = "Grymt jobbat! Du har stenkoll på nätverksgrunderna inför provet.";
  else if (pct >= 50) feedback.textContent = "Bra jobbat! Vissa delar sitter bra, repetera gärna intervallen och beräkningarna en gång till.";
  else feedback.textContent = "Bra försök! Gå gärna igenom facit och gör om quizet för att nöta in detaljerna.";
}

function restartQuiz() {
  currentIndex = 0;
  userAnswers = {};
  results = {};
  document.getElementById("summaryCard").style.display = "none";
  document.getElementById("quizCard").style.display = "flex";
  document.getElementById("progressContainer").style.display = "block";
  loadQuestion(0);
}

window.onload = () => loadQuestion(0);
</script>
</body>
</html>
