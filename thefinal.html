<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nätverk & Adressering - 26 Frågor (Fritext)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --correct: #22c55e;
      --wrong: #ef4444;
      --btn-hover: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .progress-box {
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 2rem;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--accent);
      display: flex;
      gap: 0.5rem;
    }

    textarea {
      width: 100%;
      height: 90px;
      background: #0b1120;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.95rem;
      resize: vertical;
      margin-bottom: 1rem;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.5rem 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--btn-hover);
      color: #fff;
    }

    .solution {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      background: #0f172a;
      border-left: 4px solid var(--accent);
      border-radius: 4px;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #e2e8f0;
    }

    .self-check {
      display: none;
      margin-top: 0.8rem;
      gap: 0.5rem;
    }

    .btn-correct {
      background: transparent;
      border: 1px solid var(--correct);
      color: var(--correct);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-wrong {
      background: transparent;
      border: 1px solid var(--wrong);
      color: var(--wrong);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-correct.active {
      background: var(--correct);
      color: #fff;
    }

    .btn-wrong.active {
      background: var(--wrong);
      color: #fff;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Nätverk & Adressering</h1>
    <p class="subtitle">Skriv dina egna svar, visa facit och markera om du svarade rätt eller fel.</p>
  </header>

  <div class="progress-box">
    <span>Resultat: <strong id="score">0</strong> / 26 rätt</span>
    <button class="btn" onclick="resetAll()">Börja om</button>
  </div>

  <div id="quiz-container"></div>
</div>

<script>
const questions = [
  {
    q: "Vilka olika nätverkstyper finns det och var används de?",
    a: "<b>PAN:</b> Personligt och mycket nära, typ Bluetooth till klocka eller hörlurar.<br><b>LAN:</b> Lokalt nätverk i ett hem, en skola eller ett kontor.<br><b>MAN:</b> Stadsnät som täcker en hel stad/kommun.<br><b>WAN:</b> Stort nätverk över länder/världen (Internet)."
  },
  {
    q: "Vilka olika typer av topologier finns det och var används de?",
    a: "<b>Stjärna:</b> Alla kopplas till central switch (standard hemma/kontor).<br><b>Buss:</b> Alla delar på samma kabel (fordon/bilar för att spara kabel).<br><b>Ring:</b> Datan går runt som en stafettpinne (telekom).<br><b>Mesh:</b> Alla har kontakt via flera vägar (datacenter, hög driftsäkerhet).<br><b>Träd:</b> Sammankopplade stjärnnät i nivåer (större företag).<br><b>Hybrid:</b> Blandning av två eller flera topologier."
  },
  {
    q: "Vilka typer av nätverksmedia finns det och vilka signaler skickas?",
    a: "<b>Koppar:</b> TP-kabel och antennkabel (koax) – skickar elektricitet.<br><b>Fiber:</b> Glas-/plastkabel – skickar ljus.<br><b>Trådlöst:</b> Wi-Fi, 4G/5G och radio – skickar radiovågor."
  },
  {
    q: "Ge exempel på bunden kommunikation.",
    a: "Allt som går via en fysisk kabel (t.ex. vanlig nätverkskabel eller fiber), alltså inte trådlöst via luften."
  },
  {
    q: "Vilka typer av TP-kablar finns det?",
    a: "<b>Skärmning:</b> UTP (oskärmad, billigast) och STP (med metallskärm mot elektromagnetiska störningar).<br><b>Klasser:</b> Cat5e, Cat6, Cat6a, Cat7 och Cat8."
  },
  {
    q: "Vilken kapacitet har TP-kabeln och hur långt kan man sända?",
    a: "<b>Maxlängd:</b> Alltid max 100 meter.<br><b>Hastighet:</b> Cat5e ger 1 Gbps, Cat6/6a ger upp till 10 Gbps (Cat8 upp till 40 Gbps på korta sträckor)."
  },
  {
    q: "Beskriv en koaxialkabel och vilka fördelar och nackdelar har den?",
    a: "<b>Uppbyggnad:</b> Tjock koppartråd i mitten, isolering och en yttre metallskärm runtom.<br><b>Fördel:</b> Tål yttre störningar jättebra och tål fysiskt stryk.<br><b>Nackdel:</b> Styv, svår att böja och har lägre kapacitet än fiber."
  },
  {
    q: "Vilka typer av fiberkablar finns det?",
    a: "<b>Singlemode:</b> Supertunn kärna, använder laser, för jättelånga sträckor (flera mil).<br><b>Multimode:</b> Tjockare kärna, enklare ljus (LED), för kortare sträckor (inom hus/datacenter)."
  },
  {
    q: "Hur fungerar en fiberkabel rent tekniskt?",
    a: "Data omvandlas till ljusblixtar. Ljuset studsar fram inuti glastråden (totalreflektion) till en mottagare (fotodiod) som gör om ljuset till ettor och nollor igen."
  },
  {
    q: "Vilka fördelar finns det med fiberkabel?",
    a: "1. Blixtsnabbt och klarar enorma mängder data.<br>2. Helt okänsligt för elstörningar och åska.<br>3. Ljuset färdas flera mil utan signalförlust.<br>4. Svårt att avlyssna utan att länken bryts."
  },
  {
    q: "Hur är en MAC-adress uppbyggd?",
    a: "Den består av 6 bytes (48 bitar).<br>• De 3 första byten visar vem som är tillverkare (OUI).<br>• De 3 sista byten är ett unikt serienummer för nätverkskortet (NIC)."
  },
  {
    q: "Vad är en MAC-adress?",
    a: "Nätverkskortets unika fysiska 'personnummer'. Den bränns in på kortet från fabriken och ändras i grunden aldrig."
  },
  {
    q: "Vilka nätverksklasser finns det och ge exempel på adresser?",
    a: "<b>Klass A:</b> 1–126 (Ex: 10.0.0.1) – för jättestora nätverk.<br><b>Klass B:</b> 128–191 (Ex: 172.16.0.1) – för mellanstora nätverk.<br><b>Klass C:</b> 192–223 (Ex: 192.168.1.1) – för små nät/hemmanätverk."
  },
  {
    q: "Hur räknar man ut Host-ID? (Husnumret)",
    a: "Man tar IP-adressen och tar bort nätverksdelen (där masken har 255). Siffrorna som blir över är Host-ID.<br><i>Exempel:</i> IP 192.168.1.25 med mask 255.255.255.0 ger Host-ID <b>.25</b>."
  },
  {
    q: "Hur räknar man ut Net-ID? (Gatunamnet)",
    a: "Man jämför IP-adressen med nätmasken (AND-operation). Där masken har 255 behåller man siffrorna, resten blir nollor.<br><i>Exempel:</i> IP 192.168.1.25 med mask 255.255.255.0 ger Net-ID <b>192.168.1.0</b>."
  },
  {
    q: "Vilka adresser har Klass A?",
    a: "Adresser som börjar på <b>1 – 126</b> (Standardmask: 255.0.0.0 eller /8)."
  },
  {
    q: "Hur många nätverk kan Klass A ha?",
    a: "<b>126 stycken</b> (2^7 minus 0 och 127 som är reserverade)."
  },
  {
    q: "Hur många värdenheter kan Klass A ha?",
    a: "Cirka 16,7 miljoner per nätverk (exakt <b>16 777 214 st</b>)."
  },
  {
    q: "Vilka adresser har Klass B?",
    a: "Adresser som börjar på <b>128 – 191</b> (Standardmask: 255.255.0.0 eller /16). Man hoppar över 127 då det är loopback."
  },
  {
    q: "Hur många nätverk kan Klass B ha?",
    a: "<b>16 384 stycken</b> (cirka 16 tusen)."
  },
  {
    q: "Hur många värdenheter kan Klass B ha?",
    a: "<b>65 534 stycken</b> per nätverk."
  },
  {
    q: "Vilka adresser har Klass C?",
    a: "Adresser som börjar på <b>192 – 223</b> (Standardmask: 255.255.255.0 eller /24). Slutar på 223, inte 255/256!"
  },
  {
    q: "Hur många nätverk kan Klass C ha?",
    a: "Cirka 2,1 miljoner stycken (exakt <b>2 097 152 st</b>)."
  },
  {
    q: "Hur många värdenheter kan Klass C ha?",
    a: "<b>254 stycken</b> per nätverk (256 minus nätverksadress och broadcast = 254)."
  },
  {
    q: "Vad är en Default Gateway?",
    a: "Routerns lokala IP-adress. Det är 'dörren ut' dit datorn skickar all trafik som ska till andra nätverk eller ut på Internet."
  },
  {
    q: "Vilka olika typer av IPv4-adresser finns det?",
    a: "• <b>Unicast:</b> Skickar till en enskild enhet.<br>• <b>Multicast:</b> Skickar till en grupp (224.0.0.0–239.255.255.255).<br>• <b>Broadcast:</b> Skickar till alla på det lokala nätet (t.ex. .255).<br>• <b>Loopback:</b> Datorn testar sig själv internt (127.0.0.1).<br>• <b>Link-local:</b> Automatisk adress vid saknad DHCP (169.254.x.x / APIPA).<br>• <b>Unspecified:</b> Okänd adress under uppstart (0.0.0.0).<br>• <b>All-hosts broadcast:</b> Ropar till alla på det fysiska segmentet (255.255.255.255)."
  }
];

const results = {};

function renderQuiz() {
  const container = document.getElementById("quiz-container");
  container.innerHTML = "";

  questions.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h2><span>${index + 1}.</span> ${item.q}</h2>
      <textarea placeholder="Skriv ditt svar här..."></textarea>
      <div>
        <button class="btn" onclick="toggleSolution(${index})">Visa facit</button>
      </div>
      <div class="solution" id="sol-${index}">${item.a}</div>
      <div class="self-check" id="check-${index}">
        <button class="btn-correct" id="btn-c-${index}" onclick="markResult(${index}, true)">Jag svarade rätt</button>
        <button class="btn-wrong" id="btn-w-${index}" onclick="markResult(${index}, false)">Jag svarade fel</button>
      </div>
    `;
    container.appendChild(card);
  });
}

function toggleSolution(index) {
  const sol = document.getElementById(`sol-${index}`);
  const check = document.getElementById(`check-${index}`);
  const isHidden = sol.style.display === "" || sol.style.display === "none";
  
  sol.style.display = isHidden ? "block" : "none";
  check.style.display = isHidden ? "flex" : "none";
}

function markResult(index, isCorrect) {
  results[index] = isCorrect;
  
  const btnC = document.getElementById(`btn-c-${index}`);
  const btnW = document.getElementById(`btn-w-${index}`);

  if (isCorrect) {
    btnC.classList.add("active");
    btnW.classList.remove("active");
  } else {
    btnW.classList.add("active");
    btnC.classList.remove("active");
  }

  updateScore();
}

function updateScore() {
  const score = Object.values(results).filter(v => v === true).length;
  document.getElementById("score").innerText = score;
}

function resetAll() {
  Object.keys(results).forEach(k => delete results[k]);
  renderQuiz();
  updateScore();
}

renderQuiz();
</script>

</body>
</html>
