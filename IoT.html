<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intensivträning: CPU och IoT - Jensen Campus</title>
  <style>
    :root {
      --bg: #060b11;
      --card-bg: #0b1522;
      --gold-primary: #e6c260;
      --gold-glow: rgba(230, 194, 96, 0.28);
      --gold-gradient: linear-gradient(135deg, #fae287 0%, #d4af37 50%, #9e7d23 100%);
      --gold-border: rgba(212, 175, 55, 0.55);
      --text: #f8fafc;
      --text-muted: #9fb0c3;
      --correct: #22c55e;
      --wrong: #ef4444;
      --opt-bg: #112033;
      --opt-hover: #182c45;
      --opt-border: rgba(212, 175, 55, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .modal-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 880px;
      border-radius: 26px;
      border: 2px solid var(--gold-border);
      padding: 34px 38px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 35px var(--gold-glow);
      display: flex;
      flex-direction: column;
      min-height: 740px;
      justify-content: space-between;
    }

    .header-box {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px;
      border-bottom: 1.5px solid var(--gold-border);
      padding-bottom: 20px;
      box-shadow: 0 6px 15px -8px var(--gold-glow);
    }

    .jensen-logo-svg {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #060b11;
      border: 2px solid var(--gold-primary);
      box-shadow: 0 0 16px var(--gold-glow);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
    }

    .header-titles h1 {
      font-size: 1.55rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    .header-titles p {
      font-size: 0.95rem;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .segments {
      display: flex;
      gap: 3px;
      flex: 1;
    }

    .seg {
      height: 6px;
      flex: 1;
      background: #18283b;
      border-radius: 3px;
      transition: background 0.2s;
    }

    .seg.correct { background: var(--correct); }
    .seg.wrong { background: var(--wrong); }
    .seg.current { 
      background: var(--gold-primary); 
      box-shadow: 0 0 8px var(--gold-primary);
    }

    .step-text {
      font-size: 1rem;
      color: var(--gold-primary);
      font-weight: 700;
      white-space: nowrap;
    }

    .pill-counter {
      display: flex;
      gap: 8px;
    }

    .count-pill {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
    }

    .pill-red { background: rgba(239, 68, 68, 0.22); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .pill-green { background: rgba(34, 197, 94, 0.22); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.4); }

    .q-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .q-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 800;
      color: #070e17;
      background: var(--gold-gradient);
      padding: 3px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      box-shadow: 0 2px 8px var(--gold-glow);
    }

    .q-type-badge {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: #121f30;
      border: 1px solid var(--gold-border);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .q-text {
      font-size: 1.28rem;
      font-weight: 700;
      line-height: 1.5;
      color: #ffffff;
      margin-bottom: 14px;
    }

    .hint-btn {
      background: none;
      border: none;
      color: var(--gold-primary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 18px;
      display: inline-block;
      padding: 0;
    }

    .hint-box {
      display: none;
      background: rgba(212, 175, 55, 0.1);
      border-left: 4px solid var(--gold-primary);
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 0.98rem;
      color: #fef08a;
      margin-bottom: 18px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 20px;
    }

    .opt-card {
      background: var(--opt-bg);
      border: 1px solid var(--opt-border);
      border-radius: 14px;
      padding: 16px 20px;
      color: #f1f5f9;
      text-align: left;
      font-size: 1.05rem;
      line-height: 1.45;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .opt-card:hover:not(:disabled) {
      background: var(--opt-hover);
      border-color: var(--gold-primary);
      transform: translateY(-1px);
    }

    .opt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .badge-result {
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .opt-card.correct-opt {
      background: rgba(34, 197, 94, 0.22);
      border-color: var(--correct);
    }
    .opt-card.correct-opt .badge-result { background: #22c55e; color: #fff; }

    .opt-card.wrong-opt {
      background: rgba(239, 68, 68, 0.22);
      border-color: var(--wrong);
    }
    .opt-card.wrong-opt .badge-result { background: #ef4444; color: #fff; }

    .opt-explanation {
      margin-top: 10px;
      padding-top: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e2e8f0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .text-input-wrapper {
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      border: 1.5px solid var(--gold-border);
      background: var(--opt-bg);
      color: #fff;
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      resize: vertical;
      min-height: 100px;
    }

    textarea:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 14px var(--gold-glow);
    }
    
    .char-counter {
        font-size: 0.85rem;
        color: var(--text-muted);
        text-align: right;
        margin-top: 5px;
    }

    .text-result-box {
      display: none;
      margin-top: 16px;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 1.02rem;
      line-height: 1.55;
    }
    .text-result-correct { background: rgba(34, 197, 94, 0.2); border: 1.5px solid var(--correct); color: #86efac; }
    .text-result-wrong { background: rgba(239, 68, 68, 0.2); border: 1.5px solid var(--wrong); color: #fca5a5; }

    .bottom-bar {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      margin-top: 14px;
    }

    .btn-action {
      padding: 12px 30px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-back { background: #132438; color: #cbd5e1; border: 1px solid var(--gold-border); }
    .btn-back:hover:not(:disabled) { background: #1b324e; }

    .btn-next { 
      background: var(--gold-gradient); 
      color: #070e17; 
      box-shadow: 0 0 16px var(--gold-glow); 
    }
    .btn-next:hover:not(:disabled) { 
      filter: brightness(1.1); 
      transform: translateY(-1px);
    }

    .btn-action:disabled { opacity: 0.35; cursor: not-allowed; }

    .summary-view {
      display: none;
      text-align: center;
      padding: 40px 16px;
    }
    .summary-view h2 { 
      font-size: 2.2rem; 
      margin-bottom: 12px; 
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800; 
    }
    .score-badge-large { 
      font-size: 3.8rem; 
      font-weight: 800; 
      color: var(--gold-primary); 
      margin: 16px 0; 
      text-shadow: 0 0 25px var(--gold-glow); 
    }
    .summary-desc { color: var(--text-muted); font-size: 1.15rem; max-width: 600px; margin: 0 auto 28px; line-height: 1.6; }
  </style>
</head>
<body>

<div class="modal-container">
  <div>
    <div class="header-box">
      <div class="jensen-logo-svg">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#d4af37" stroke-width="2.5" />
          <circle cx="50" cy="50" r="41" fill="none" stroke="#d4af37" stroke-width="1.2" />
          <polygon points="50,16 52,21 57,21 53,24 55,29 50,26 45,29 47,24 43,21 48,21" fill="#d4af37"/>
          <polygon points="63,22 64.5,25.5 68,25.5 65,28 66,31.5 63,29.5 60,31.5 61,28 58,25.5 61.5,25.5" fill="#d4af37"/>
          <polygon points="73,34 74.5,37.5 78,37.5 75,40 76,43.5 73,41.5 70,43.5 71,40 68,37.5 71.5,37.5" fill="#d4af37"/>
          <polygon points="58,35 59.5,38.5 63,38.5 60,41 61,44.5 58,42.5 55,44.5 56,41 53,38.5 56.5,38.5" fill="#d4af37"/>
          <polygon points="68,48 69.5,51.5 73,51.5 70,54 71,57.5 68,55.5 65,57.5 66,54 63,51.5 66.5,51.5" fill="#d4af37"/>
          <path d="M 33,26 L 52,26 L 52,40 C 52,45 42,48 33,48 C 24,48 24,40 24,40 L 24,26 Z" fill="none" stroke="#d4af37" stroke-width="1.2"/>
          <text x="38" y="36" fill="#d4af37" font-size="7.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">1996</text>
          <path d="M 32,70 C 37,58 48,50 63,45" fill="none" stroke="#d4af37" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="32" y1="70" x2="63" y2="45" stroke="#d4af37" stroke-width="1" />
          <line x1="30" y1="67" x2="68" y2="42" stroke="#d4af37" stroke-width="2.2" stroke-linecap="round"/>
          <polygon points="68,42 62,40 64,46" fill="#d4af37" />
          <circle cx="36" cy="62" r="5" fill="none" stroke="#d4af37" stroke-width="1.6" />
          <path id="textPath" d="M 20,68 A 38,38 0 0,0 80,68" fill="none" />
          <text fill="#d4af37" font-size="7.2" font-weight="bold" letter-spacing="1.5">
            <textPath href="#textPath" startOffset="50%" text-anchor="middle">JENSEN CAMPUS</textPath>
          </text>
        </svg>
      </div>
      <div class="header-titles">
        <h1>Intensivträning: CPU och IoT</h1>
        <p>Jensen Education • 10 Utvalda provfrågor (Mixat Flerval & Fritext)</p>
      </div>
    </div>

    <div class="progress-row" id="progressRow">
      <div class="segments" id="segments"></div>
      <div class="step-text" id="stepCounter">1/10</div>
      <div class="pill-counter">
        <div class="count-pill pill-red" id="pillWrong">✕ 0</div>
        <div class="count-pill pill-green" id="pillCorrect">✓ 0</div>
      </div>
    </div>

    <div id="quizContent">
      <div class="q-meta">
        <span class="q-badge" id="qBadge">Kategori</span>
        <span class="q-type-badge" id="qTypeBadge">Fråga</span>
      </div>
      <div class="q-text" id="qText">Laddar fråga...</div>

      <button type="button" class="hint-btn" onclick="toggleHint()">💡 Visa ledtråd</button>
      <div class="hint-box" id="hintBox"></div>

      <div id="questionContainer"></div>
    </div>

    <div class="summary-view" id="summaryView">
      <h2>Träning genomförd!</h2>
      <div class="score-badge-large" id="finalScore">0 / 10</div>
      <p class="summary-desc" id="finalFeedback"></p>
      <button type="button" class="btn-action btn-next" onclick="restartQuiz()">Gör om övningen</button>
    </div>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <button type="button" class="btn-action btn-back" id="btnBack" onclick="prevQuestion()" disabled>Tillbaka</button>
    <button type="button" class="btn-action btn-next" id="btnNext" onclick="nextQuestion()">Nästa</button>
  </div>
</div>

<script>
var questions = [
  {
    id: 1,
    type: "mc",
    module: "CPU-arkitektur",
    q: "Vilken buss anger var i minnet data ska läsas eller skrivas?",
    hint: "Namnet på bussen avslöjar vad den transporterar – den pekar ut platser.",
    options: [
      "Databussen",
      "Adressbussen",
      "Kontrollbussen",
      "Kommunikationsbussen"
    ],
    correct: 1,
    expl: "Adressbussen används specifikt för att ange på vilken minnesadress data ska läsas eller skrivas. (Databussen bär datan, kontrollbussen skickar styrsignaler)."
  },
  {
    id: 2,
    type: "mc",
    module: "Processorns Delar",
    q: "Vad är ALU:ns huvudsakliga funktion i en CPU?",
    hint: "ALU står för Arithmetic Logic Unit.",
    options: [
      "Att transportera information mellan processorns delar",
      "Att räkna och göra logiska jämförelser",
      "Att hålla takten i processorns arbete",
      "Att lagra ofta använd data nära processorn"
    ],
    correct: 1,
    expl: "ALU (Arithmetic Logic Unit) utför de faktiska beräkningarna (matematik) och de logiska operationerna."
  },
  {
    id: 3,
    type: "mc",
    module: "IoT-Processorer",
    q: "Vilken typ av IoT-processor passar bäst för enkla, strömsnåla uppgifter?",
    hint: "Till skillnad från en mikroprocessor, har den ofta inbyggt minne och är gjord för inbyggda system.",
    options: [
      "Mikrokontroller (MCU)",
      "Mikroprocessor (MPU)",
      "Systemkrets (SoC)",
      "Flertrådad CPU"
    ],
    correct: 0,
    expl: "En Mikrokontroller (MCU) är optimerad för att vara liten, billig och dra väldigt lite ström, perfekt för enkla IoT-uppgifter."
  },
  {
    id: 4,
    type: "mc",
    module: "Prestanda & Trådar",
    q: "Vad innebär 'Threading' (trådning)?",
    hint: "Ett program delas upp.",
    options: [
      "Att processorn anpassar sin klockfrekvens efter temperaturen",
      "Att ett program delas upp i mindre delar som processorn kan växla mellan",
      "Att flera fysiska kärnor slås samman till en",
      "En säkerhetsfunktion för IoT-enheter"
    ],
    correct: 1,
    expl: "Threading innebär att program delas upp i mindre delar (trådar). Processorn kan snabbt växla mellan dessa, eller köra dem samtidigt om den har flera kärnor."
  },
  {
    id: 5,
    type: "mc",
    module: "Företagsteknologi",
    q: "Vad är Intel vPro-teknologin främst till för?",
    hint: "Fokus på administration och IT-avdelningar.",
    options: [
      "Att öka klockfrekvensen vid spelande",
      "Att minska strömförbrukningen i IoT-enheter",
      "Att hjälpa IT-personal att övervaka och skydda företagsdatorer på distans",
      "Att styra robotdammsugare via Wi-Fi"
    ],
    correct: 2,
    expl: "Intel vPro är en företagsteknik som ger IT-personal möjlighet att fjärrstyra, övervaka och säkra datorer, även om operativsystemet har kraschat."
  },
  {
    id: 6,
    type: "text",
    module: "Samarbete i CPU",
    q: "Beskriv hur en instruktion hanteras i en CPU. Förklara samarbetet mellan Kontrollenheten och ALU:n.",
    hint: "Kontrollenheten hämtar och tolkar, ALU:n utför själva matematiken.",
    fullCheck: function(txt) {
        return (txt.indexOf("kontroll") !== -1 || txt.indexOf("styr") !== -1) && 
               (txt.indexOf("alu") !== -1 || txt.indexOf("räkna") !== -1 || txt.indexOf("beräkn") !== -1) &&
               (txt.indexOf("hämta") !== -1 || txt.indexOf("tolka") !== -1 || txt.indexOf("instruktion") !== -1);
    },
    partialCheck: function(txt) {
        return (txt.indexOf("kontroll") !== -1 || txt.indexOf("styr") !== -1) || 
               (txt.indexOf("alu") !== -1 || txt.indexOf("räkna") !== -1);
    },
    expl: "CPU:n hämtar, tolkar och utför instruktioner. Kontrollenheten styr vad delarna ska göra. ALU:n gör sedan beräkningar och logiska operationer, och resultatet lagras."
  },
  {
    id: 7,
    type: "text",
    module: "Trådar vs Kärnor",
    q: "Vad är skillnaden mellan hur processorn hanterar arbete via 'Multithreading' jämfört med en 'Flerkärnig CPU'?",
    hint: "Multithreading handlar ofta om att växla mellan trådar i en kärna. Flerkärnig innebär fysiskt delat arbete.",
    fullCheck: function(txt) {
        return (txt.indexOf("tråd") !== -1 || txt.indexOf("multi") !== -1) && 
               (txt.indexOf("växla") !== -1 || txt.indexOf("samma tidsperiod") !== -1 || txt.indexOf("vänta") !== -1) &&
               (txt.indexOf("kärn") !== -1 || txt.indexOf("fysisk") !== -1 || txt.indexOf("samtidig") !== -1);
    },
    partialCheck: function(txt) {
        return txt.indexOf("växla") !== -1 || txt.indexOf("samtidig") !== -1;
    },
    expl: "Multithreading gör att processorn kan arbeta med flera trådar under samma tidsperiod (t.ex. när en väntar arbetar en annan). Flera kärnor gör att processorn fysiskt kan utföra flera uppgifter helt samtidigt."
  },
  {
    id: 8,
    type: "text",
    module: "IoT Arkitektur",
    q: "Beskriv processorns roll i en IoT-arkitektur (vad gör den med data?).",
    hint: "Vad händer efter att en sensor skickat data till processorn?",
    fullCheck: function(txt) {
        return (txt.indexOf("tar emot") !== -1 || txt.indexOf("sensor") !== -1) && 
               (txt.indexOf("bearbetar") !== -1 || txt.indexOf("räknar") !== -1) &&
               (txt.indexOf("styr") !== -1 || txt.indexOf("skickar vidare") !== -1 || txt.indexOf("startar") !== -1);
    },
    partialCheck: function(txt) {
        return txt.indexOf("tar emot") !== -1 || txt.indexOf("skickar") !== -1;
    },
    expl: "Processorn tar emot data, bearbetar dem och styr sedan enheten (t.ex. startar en fläkt när en sensor visar hög temperatur). Den förbereder också data som ska skickas vidare över nätverket."
  },
  {
    id: 9,
    type: "text",
    module: "Avvägningar IoT",
    q: "När man ska välja en processor för en IoT-enhet behöver man väga fyra specifika egenskaper mot varandra. Vilka?",
    hint: "Tänk på kraft, batteri, pengar och fysiskt utrymme.",
    fullCheck: function(txt) {
        return txt.indexOf("prestanda") !== -1 && 
               (txt.indexOf("ström") !== -1 || txt.indexOf("energi") !== -1 || txt.indexOf("batteri") !== -1) &&
               (txt.indexOf("pris") !== -1 || txt.indexOf("kostnad") !== -1) &&
               (txt.indexOf("storlek") !== -1 || txt.indexOf("plats") !== -1);
    },
    partialCheck: function(txt) {
        var count = 0;
        if (txt.indexOf("prestanda") !== -1) count++;
        if (txt.indexOf("ström") !== -1 || txt.indexOf("energi") !== -1) count++;
        if (txt.indexOf("pris") !== -1 || txt.indexOf("kostnad") !== -1) count++;
        if (txt.indexOf("storlek") !== -1) count++;
        return count >= 2;
    },
    expl: "Man jämför Prestanda, Strömförbrukning, Pris och Storlek."
  },
  {
    id: 10,
    type: "text",
    module: "Register & Klocka",
    q: "Beskriv kortfattat funktionerna hos Register och Klockan i en CPU.",
    hint: "Ett är ett jättesnabbt minne, det andra styr tempot.",
    fullCheck: function(txt) {
        return (txt.indexOf("register") !== -1 && (txt.indexOf("just nu") !== -1 || txt.indexOf("tillfällig") !== -1 || txt.indexOf("lagra") !== -1)) && 
               (txt.indexOf("klock") !== -1 && (txt.indexOf("takt") !== -1 || txt.indexOf("hastighet") !== -1 || txt.indexOf("cykel") !== -1));
    },
    partialCheck: function(txt) {
        return txt.indexOf("just nu") !== -1 || txt.indexOf("takt") !== -1;
    },
    expl: "Register håller data som används just nu (tillfällig lagring i processorn). Klockan håller takten (frekvensen/cyklerna) i processorns arbete."
  }
];

var currentIndex = 0;
var userAnswers = {};

function shuffleArray(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = arr[i];
    arr[i] = arr[j];
    arr[j] = temp;
  }
  return arr;
}

function randomizeQuiz() {
  shuffleArray(questions);
  for (var i = 0; i < questions.length; i++) {
    var q = questions[i];
    if (q.type === "mc") {
      var correctText = q.options[q.correct];
      shuffleArray(q.options);
      q.correct = q.options.indexOf(correctText);
    }
  }
}

function initSegments() {
  var segContainer = document.getElementById("segments");
  var html = "";
  for (var i = 0; i < questions.length; i++) {
    html += "<div class='seg' id='seg-" + i + "'></div>";
  }
  segContainer.innerHTML = html;
}

function updateProgress() {
  var total = questions.length;
  document.getElementById("stepCounter").textContent = (currentIndex + 1) + "/" + total;

  var correctCount = 0;
  var wrongCount = 0;

  for (var i = 0; i < questions.length; i++) {
    var seg = document.getElementById("seg-" + i);
    if (!seg) continue;
    seg.className = "seg";
    
    if (userAnswers[i] !== undefined) {
      if (userAnswers[i].isCorrect) {
        seg.classList.add("correct");
        correctCount++;
      } else {
        seg.classList.add("wrong");
        wrongCount++;
      }
    } else if (i === currentIndex) {
      seg.classList.add("current");
    }
  }

  document.getElementById("pillCorrect").textContent = "✓ " + correctCount;
  document.getElementById("pillWrong").textContent = "✕ " + wrongCount;
}

function toggleHint() {
  var box = document.getElementById("hintBox");
  if (box.style.display === "block") {
    box.style.display = "none";
  } else {
    box.style.display = "block";
  }
}

function normalize(str) {
  return str.toLowerCase().replace(/[^a-zåäö0-9]/g, " ").replace(/\s+/g, " ").trim();
}

function checkTextInputLength() {
  var ta = document.getElementById("textInput");
  if (!ta) return;
  var len = ta.value.trim().length;
  var span = document.getElementById("charCountSpan");
  var btn = document.getElementById("submitTextBtn");
  
  if (span) {
    span.textContent = len;
    if (len < 30) {
      span.style.color = "#ef4444";
      if (btn) { btn.disabled = true; btn.style.opacity = "0.5"; btn.style.cursor = "not-allowed"; }
    } else {
      span.style.color = "#22c55e";
      if (btn) { btn.disabled = false; btn.style.opacity = "1"; btn.style.cursor = "pointer"; }
    }
  }
}

function loadQuestion(idx) {
  var q = questions[idx];
  document.getElementById("qBadge").textContent = q.module;
  document.getElementById("qTypeBadge").textContent = (q.type === "mc") ? "Flerval" : "Fritext (skriv svar)";
  document.getElementById("qText").textContent = (idx + 1) + ". " + q.q;
  document.getElementById("hintBox").textContent = q.hint;
  document.getElementById("hintBox").style.display = "none";

  var container = document.getElementById("questionContainer");
  container.innerHTML = "";

  var answerData = userAnswers[idx];

  if (q.type === "mc") {
    var list = document.createElement("div");
    list.className = "options-list";

    for (var optIdx = 0; optIdx < q.options.length; optIdx++) {
      var optText = q.options[optIdx];
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opt-card";

      var badgeHtml = "";
      var isSelected = (answerData && answerData.selected === optIdx);
      var isCorrectOpt = (optIdx === q.correct);

      if (answerData) {
        btn.disabled = true;
        if (isCorrectOpt) {
          btn.classList.add("correct-opt");
          badgeHtml = "<span class='badge-result'>✓ Rätt svar</span>";
        } else if (isSelected) {
          btn.classList.add("wrong-opt");
          badgeHtml = "<span class='badge-result'>✕ Fel svar</span>";
        }
      } else {
        (function(index) {
          btn.onclick = function() { chooseMcOption(index); };
        })(optIdx);
      }

      var extraText = isSelected ? " (Ditt svar)" : "";
      var explHtml = (answerData && (isCorrectOpt || isSelected)) ? "<div class='opt-explanation'>" + q.expl + "</div>" : "";

      btn.innerHTML = "<div class='opt-header'><span>" + optText + "<strong>" + extraText + "</strong></span>" + badgeHtml + "</div>" + explHtml;
      list.appendChild(btn);
    }
    container.appendChild(list);

  } else if (q.type === "text") {
    var wrapper = document.createElement("div");
    wrapper.className = "text-input-wrapper";

    var input = document.createElement("textarea");
    input.id = "textInput";
    input.placeholder = "Skriv ett utförligt svar här (minst 30 tecken krävs)...";
    input.autocomplete = "off";

    var charCounter = document.createElement("div");
    charCounter.className = "char-counter";
    charCounter.innerHTML = "Tecken: <span id='charCountSpan'>0</span> / 30 min";

    var resBox = document.createElement("div");
    resBox.id = "textResBox";
    resBox.className = "text-result-box";

    if (answerData) {
      input.value = answerData.textVal;
      input.disabled = true;
      charCounter.style.display = "none";
      resBox.style.display = "block";
      if (answerData.score >= 1.0) {
        resBox.className = "text-result-box text-result-correct";
        resBox.innerHTML = "<strong>✓ Helt rätt! (1.0 p)</strong><br>" + q.expl;
      } else if (answerData.score >= 0.5) {
        resBox.className = "text-result-box text-result-correct";
        resBox.innerHTML = "<strong>✓ Delvis rätt! (0.5 p)</strong><br><em>Saknade nyckelord men rätt spår.</em><br><br><strong>Fylligare svar:</strong> " + q.expl;
      } else {
        resBox.className = "text-result-box text-result-wrong";
        resBox.innerHTML = "<strong>✕ Inte riktigt (0.0 p)</strong><br><strong>Facit:</strong> " + q.expl;
      }
    } else {
      input.oninput = checkTextInputLength;
    }

    wrapper.appendChild(input);
    if (!answerData) wrapper.appendChild(charCounter);
    wrapper.appendChild(resBox);

    if (!answerData) {
      var submitBtn = document.createElement("button");
      submitBtn.type = "button";
      submitBtn.id = "submitTextBtn";
      submitBtn.className = "btn-action btn-next";
      submitBtn.style.marginTop = "14px";
      submitBtn.textContent = "Rätta svar";
      submitBtn.onclick = submitTextAnswer;
      submitBtn.disabled = true;
      submitBtn.style.opacity = "0.5";
      submitBtn.style.cursor = "not-allowed";
      wrapper.appendChild(submitBtn);
    }
    container.appendChild(wrapper);
  }

  document.getElementById("btnBack").disabled = (idx === 0);
  
  if (idx === questions.length - 1) {
      document.getElementById("btnNext").textContent = "Slutför";
  } else {
      document.getElementById("btnNext").textContent = "Nästa";
  }

  updateProgress();
}

function chooseMcOption(selectedIdx) {
  if (userAnswers[currentIndex] !== undefined) return;
  var q = questions[currentIndex];
  userAnswers[currentIndex] = {
    selected: selectedIdx,
    isCorrect: (selectedIdx === q.correct)
  };
  loadQuestion(currentIndex);
}

function submitTextAnswer() {
  var input = document.getElementById("textInput");
  var val = input.value.trim();
  if (!val || val.length < 30) return;

  var q = questions[currentIndex];
  var score = 0;

  if (q.fullCheck) {
    var clean = normalize(val);
    if (q.fullCheck(clean)) {
      score = 1.0;
    } else if (q.partialCheck && q.partialCheck(clean)) {
      score = 0.5;
    }
  }

  userAnswers[currentIndex] = {
    textVal: val,
    score: score,
    isCorrect: (score >= 0.5)
  };
  loadQuestion(currentIndex);
}

function nextQuestion() {
  if (questions[currentIndex].type === "text" && userAnswers[currentIndex] === undefined) {
      alert("Du måste svara på fritextfrågan (skriv minst 30 tecken och tryck 'Rätta svar') innan du går vidare.");
      return;
  }
  
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    loadQuestion(currentIndex);
  } else {
    showSummary();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion(currentIndex);
  }
}

function showSummary() {
  document.getElementById("quizContent").style.display = "none";
  document.getElementById("progressRow").style.display = "none";
  document.getElementById("bottomBar").style.display = "none";

  var correctCount = 0;
  for (var i = 0; i < questions.length; i++) {
    if (userAnswers[i] && userAnswers[i].isCorrect) {
      correctCount++;
    }
  }

  document.getElementById("summaryView").style.display = "block";
  document.getElementById("finalScore").textContent = correctCount + " / " + questions.length;

  var pct = (correctCount / questions.length) * 100;
  var fb = document.getElementById("finalFeedback");
  if (pct >= 85) {
    fb.textContent = "Fantastiskt bra jobbat! Du har stenkoll på både CPU:ns inre funktioner och IoT-arkitekturen.";
  } else if (pct >= 60) {
    fb.textContent = "Snyggt jobbat! Gå gärna igenom facit på fritextfrågorna för att få med alla detaljer på provet.";
  } else {
    fb.textContent = "Träna gärna en gång till! Se till att läsa facit-förklaringarna noga för att greppa hur delarna hänger ihop.";
  }
}

function restartQuiz() {
  currentIndex = 0;
  userAnswers = {};
  randomizeQuiz();
  document.getElementById("summaryView").style.display = "none";
  document.getElementById("quizContent").style.display = "block";
  document.getElementById("progressRow").style.display = "flex";
  document.getElementById("bottomBar").style.display = "flex";
  loadQuestion(0);
}

window.onload = function() {
  randomizeQuiz();
  initSegments();
  loadQuestion(0);
};
</script>
