<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intensivträning: Net-ID & Host-ID - Jensen Campus</title>
  <style>
    :root {
      --bg: #060b11;
      --card-bg: #0b1522;
      --gold-primary: #e6c260;
      --gold-glow: rgba(230, 194, 96, 0.28);
      --gold-gradient: linear-gradient(135deg, #fae287 0%, #d4af37 50%, #9e7d23 100%);
      --gold-border: rgba(212, 175, 55, 0.55);
      --text: #f8fafc;
      --text-muted: #9fb0c3;
      --correct: #22c55e;
      --wrong: #ef4444;
      --opt-bg: #112033;
      --opt-hover: #182c45;
      --opt-border: rgba(212, 175, 55, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .modal-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 880px;
      border-radius: 26px;
      border: 2px solid var(--gold-border);
      padding: 34px 38px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 35px var(--gold-glow);
      display: flex;
      flex-direction: column;
      min-height: 740px;
      justify-content: space-between;
    }

    .header-box {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px;
      border-bottom: 1.5px solid var(--gold-border);
      padding-bottom: 20px;
      box-shadow: 0 6px 15px -8px var(--gold-glow);
    }

    .jensen-logo-svg {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #060b11;
      border: 2px solid var(--gold-primary);
      box-shadow: 0 0 16px var(--gold-glow);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
    }

    .header-titles h1 {
      font-size: 1.55rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    .header-titles p {
      font-size: 0.95rem;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .segments {
      display: flex;
      gap: 3px;
      flex: 1;
    }

    .seg {
      height: 6px;
      flex: 1;
      background: #18283b;
      border-radius: 3px;
      transition: background 0.2s;
    }

    .seg.correct { background: var(--correct); }
    .seg.wrong { background: var(--wrong); }
    .seg.current { 
      background: var(--gold-primary); 
      box-shadow: 0 0 8px var(--gold-primary);
    }

    .step-text {
      font-size: 1rem;
      color: var(--gold-primary);
      font-weight: 700;
      white-space: nowrap;
    }

    .pill-counter {
      display: flex;
      gap: 8px;
    }

    .count-pill {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
    }

    .pill-red { background: rgba(239, 68, 68, 0.22); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .pill-green { background: rgba(34, 197, 94, 0.22); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.4); }

    .q-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .q-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 800;
      color: #070e17;
      background: var(--gold-gradient);
      padding: 3px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      box-shadow: 0 2px 8px var(--gold-glow);
    }

    .q-type-badge {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: #121f30;
      border: 1px solid var(--gold-border);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .q-text {
      font-size: 1.28rem;
      font-weight: 700;
      line-height: 1.5;
      color: #ffffff;
      margin-bottom: 14px;
    }

    .hint-btn {
      background: none;
      border: none;
      color: var(--gold-primary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 18px;
      display: inline-block;
      padding: 0;
    }

    .hint-box {
      display: none;
      background: rgba(212, 175, 55, 0.1);
      border-left: 4px solid var(--gold-primary);
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 0.98rem;
      color: #fef08a;
      margin-bottom: 18px;
    }

    .text-input-wrapper {
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      border: 1.5px solid var(--gold-border);
      background: var(--opt-bg);
      color: #fff;
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 14px var(--gold-glow);
    }

    .text-result-box {
      display: none;
      margin-top: 16px;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 1.02rem;
      line-height: 1.55;
    }
    .text-result-correct { background: rgba(34, 197, 94, 0.2); border: 1.5px solid var(--correct); color: #86efac; }
    .text-result-wrong { background: rgba(239, 68, 68, 0.2); border: 1.5px solid var(--wrong); color: #fca5a5; }

    .bottom-bar {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      margin-top: 14px;
    }

    .btn-action {
      padding: 12px 30px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-back { background: #132438; color: #cbd5e1; border: 1px solid var(--gold-border); }
    .btn-back:hover:not(:disabled) { background: #1b324e; }

    .btn-next { 
      background: var(--gold-gradient); 
      color: #070e17; 
      box-shadow: 0 0 16px var(--gold-glow); 
    }
    .btn-next:hover:not(:disabled) { 
      filter: brightness(1.1); 
      transform: translateY(-1px);
    }

    .btn-action:disabled { opacity: 0.35; cursor: not-allowed; }

    .summary-view {
      display: none;
      text-align: center;
      padding: 40px 16px;
    }
    .summary-view h2 { 
      font-size: 2.2rem; 
      margin-bottom: 12px; 
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800; 
    }
    .score-badge-large { 
      font-size: 3.8rem; 
      font-weight: 800; 
      color: var(--gold-primary); 
      margin: 16px 0; 
      text-shadow: 0 0 25px var(--gold-glow); 
    }
    .summary-desc { color: var(--text-muted); font-size: 1.15rem; max-width: 600px; margin: 0 auto 28px; line-height: 1.6; }
  </style>
</head>
<body>

<div class="modal-container">
  <div>
    <div class="header-box">
      <div class="jensen-logo-svg">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#d4af37" stroke-width="2.5" />
          <circle cx="50" cy="50" r="41" fill="none" stroke="#d4af37" stroke-width="1.2" />
          <polygon points="50,16 52,21 57,21 53,24 55,29 50,26 45,29 47,24 43,21 48,21" fill="#d4af37"/>
          <polygon points="63,22 64.5,25.5 68,25.5 65,28 66,31.5 63,29.5 60,31.5 61,28 58,25.5 61.5,25.5" fill="#d4af37"/>
          <polygon points="73,34 74.5,37.5 78,37.5 75,40 76,43.5 73,41.5 70,43.5 71,40 68,37.5 71.5,37.5" fill="#d4af37"/>
          <polygon points="58,35 59.5,38.5 63,38.5 60,41 61,44.5 58,42.5 55,44.5 56,41 53,38.5 56.5,38.5" fill="#d4af37"/>
          <polygon points="68,48 69.5,51.5 73,51.5 70,54 71,57.5 68,55.5 65,57.5 66,54 63,51.5 66.5,51.5" fill="#d4af37"/>
          <path d="M 33,26 L 52,26 L 52,40 C 52,45 42,48 33,48 C 24,48 24,40 24,40 L 24,26 Z" fill="none" stroke="#d4af37" stroke-width="1.2"/>
          <text x="38" y="36" fill="#d4af37" font-size="7.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">1996</text>
          <path d="M 32,70 C 37,58 48,50 63,45" fill="none" stroke="#d4af37" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="32" y1="70" x2="63" y2="45" stroke="#d4af37" stroke-width="1" />
          <line x1="30" y1="67" x2="68" y2="42" stroke="#d4af37" stroke-width="2.2" stroke-linecap="round"/>
          <polygon points="68,42 62,40 64,46" fill="#d4af37" />
          <circle cx="36" cy="62" r="5" fill="none" stroke="#d4af37" stroke-width="1.6" />
          <path id="textPath" d="M 20,68 A 38,38 0 0,0 80,68" fill="none" />
          <text fill="#d4af37" font-size="7.2" font-weight="bold" letter-spacing="1.5">
            <textPath href="#textPath" startOffset="50%" text-anchor="middle">JENSEN CAMPUS</textPath>
          </text>
        </svg>
      </div>
      <div class="header-titles">
        <h1>Intensivträning: Net-ID & Host-ID</h1>
        <p>Jensen Education • Beräkningsövningar (Net-ID & Host-ID)</p>
      </div>
    </div>

    <div class="progress-row" id="progressRow">
      <div class="segments" id="segments"></div>
      <div class="step-text" id="stepCounter">1/10</div>
      <div class="pill-counter">
        <div class="count-pill pill-red" id="pillWrong">✕ 0</div>
        <div class="count-pill pill-green" id="pillCorrect">✓ 0</div>
      </div>
    </div>

    <div id="quizContent">
      <div class="q-meta">
        <span class="q-badge" id="qBadge">Beräkning</span>
        <span class="q-type-badge" id="qTypeBadge">Fritext</span>
      </div>
      <div class="q-text" id="qText">Laddar fråga...</div>

      <button type="button" class="hint-btn" onclick="toggleHint()">💡 Visa ledtråd</button>
      <div class="hint-box" id="hintBox"></div>

      <div id="questionContainer"></div>
    </div>

    <div class="summary-view" id="summaryView">
      <h2>Träning genomförd!</h2>
      <div class="score-badge-large" id="finalScore">0 / 10</div>
      <p class="summary-desc" id="finalFeedback"></p>
      <button type="button" class="btn-action btn-next" onclick="restartQuiz()">Gör om övningen</button>
    </div>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <button type="button" class="btn-action btn-back" id="btnBack" onclick="prevQuestion()" disabled>Tillbaka</button>
    <button type="button" class="btn-action btn-next" id="btnNext" onclick="nextQuestion()">Nästa</button>
  </div>
</div>

<script>
const questions = [
  {
    id: 1,
    module: "Klass C: Net-ID",
    q: "Vilket Net-ID har en dator med IP 192.168.0.50 och subnätmask 255.255.255.0?",
    hint: "Använd AND-jämförelse. Där masken har 255 behålls siffrorna, resten blir nollor.",
    expectedIp: "192.168.0.0",
    expl: "192.168.0.50 AND 255.255.255.0 ger Net-ID: 192.168.0.0."
  },
  {
    id: 2,
    module: "Klass C: Host-ID",
    q: "Vilket Host-ID har en dator med IP 192.168.0.50 och subnätmask 255.255.255.0?",
    hint: "Ta bort nätverksdelen (192.168.0) – vad blir kvar?",
    expectedIp: ".50",
    expl: "När nätverksdelen (192.168.0) tas bort från 192.168.0.50 blir Host-ID kvar: .50 (eller 50)."
  },
  {
    id: 3,
    module: "Klass B: Net-ID",
    q: "Vilket Net-ID får IP-adressen 172.20.5.8 med standardmasken 255.255.0.0?",
    hint: "Klass B har standardmask 255.255.0.0. De första två oktetterna behålls.",
    expectedIp: "172.20.0.0",
    expl: "172.20.5.8 AND 255.255.0.0 ger Net-ID: 172.20.0.0."
  },
  {
    id: 4,
    module: "Klass B: Host-ID",
    q: "Vilket Host-ID har IP-adressen 172.20.5.8 med standardmasken 255.255.0.0?",
    hint: "Siffrorna som blir över efter nätverksdelen (172.20).",
    expectedIp: "5.8",
    expl: "Host-delen är de två sista oktetterna: 5.8."
  },
  {
    id: 5,
    module: "Klass A: Net-ID",
    q: "Vilket Net-ID har en dator med IP 10.50.20.5 och standardmasken 255.0.0.0?",
    hint: "Klass A har standardmask 255.0.0.0. Endast första oktetten behålls.",
    expectedIp: "10.0.0.0",
    expl: "10.50.20.5 AND 255.0.0.0 ger Net-ID: 10.0.0.0."
  },
  {
    id: 6,
    module: "Klass A: Host-ID",
    q: "Vilket Host-ID har en dator med IP 10.50.20.5 och standardmasken 255.0.0.0?",
    hint: "Ta bort första oktetten (10).",
    expectedIp: "50.20.5",
    expl: "Host-delen är de tre sista oktetterna: 50.20.5."
  },
  {
    id: 7,
    module: "Klass C: Net-ID",
    q: "Beräkna Net-ID för IP 192.168.10.15 med mask 255.255.255.0",
    hint: "Klass C mask nollställer den sista oktetten.",
    expectedIp: "192.168.10.0",
    expl: "192.168.10.15 AND 255.255.255.0 ger Net-ID: 192.168.10.0."
  },
  {
    id: 8,
    module: "Klass C: Host-ID",
    q: "Beräkna Host-ID för IP 192.168.10.15 med mask 255.255.255.0",
    hint: "Sista siffran i IP-adressen.",
    expectedIp: ".15",
    expl: "Host-ID är det som blir över efter nätverket: .15 (eller 15)."
  },
  {
    id: 9,
    module: "Klass B: Net-ID",
    q: "Vad blir Net-ID för 172.16.100.5 med mask 255.255.0.0?",
    hint: "Behåll de två första oktetterna, sätt resten till noll.",
    expectedIp: "172.16.0.0",
    expl: "172.16.100.5 AND 255.255.0.0 ger Net-ID: 172.16.0.0."
  },
  {
    id: 10,
    module: "Klass B: Host-ID",
    q: "Vad blir Host-ID för 172.16.100.5 med mask 255.255.0.0?",
    hint: "De två sista oktetterna.",
    expectedIp: "100.5",
    expl: "Host-ID är de två sista delarna: 100.5."
  }
];

let currentIndex = 0;
let userAnswers = {};

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function randomizeQuiz() {
  shuffleArray(questions);
}

function initSegments() {
  const segContainer = document.getElementById("segments");
  segContainer.innerHTML = questions.map((_, i) => `<div class="seg" id="seg-${i}"></div>`).join("");
}

function updateProgress() {
  const total = questions.length;
  document.getElementById("stepCounter").textContent = `${currentIndex + 1}/${total}`;

  let correctCount = 0;
  let wrongCount = 0;

  questions.forEach((_, i) => {
    const seg = document.getElementById(`seg-${i}`);
    seg.className = "seg";
    if (userAnswers[i] !== undefined) {
      if (userAnswers[i].isCorrect) {
        seg.classList.add("correct");
        correctCount++;
      } else {
        seg.classList.add("wrong");
        wrongCount++;
      }
    } else if (i === currentIndex) {
      seg.classList.add("current");
    }
  });

  document.getElementById("pillCorrect").textContent = `✓ ${correctCount}`;
  document.getElementById("pillWrong").textContent = `✕ ${wrongCount}`;
}

function toggleHint() {
  const box = document.getElementById("hintBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function normalize(str) {
  return str.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, " ").replace(/\s+/g, " ").trim();
}

function loadQuestion(idx) {
  const q = questions[idx];
  document.getElementById("qBadge").textContent = q.module;
  document.getElementById("qTypeBadge").textContent = "Fritext (skriv svar)";
  document.getElementById("qText").textContent = `${idx + 1}. ${q.q}`;
  document.getElementById("hintBox").textContent = q.hint;
  document.getElementById("hintBox").style.display = "none";

  const container = document.getElementById("questionContainer");
  container.innerHTML = "";

  const answerData = userAnswers[idx];

  const wrapper = document.createElement("div");
  wrapper.className = "text-input-wrapper";

  const input = document.createElement("input");
  input.type = "text";
  input.id = "textInput";
  input.placeholder = "Skriv ditt svar här och tryck Enter / Rätta svar...";
  input.autocomplete = "off";

  const resBox = document.createElement("div");
  resBox.id = "textResBox";
  resBox.className = "text-result-box";

  if (answerData) {
    input.value = answerData.textVal;
    input.disabled = true;
    resBox.style.display = "block";
    if (answerData.isCorrect) {
      resBox.className = "text-result-box text-result-correct";
      resBox.innerHTML = `<strong>✓ Helt rätt! (1.0 p)</strong><br>${q.expl}`;
    } else {
      resBox.className = "text-result-box text-result-wrong";
      resBox.innerHTML = `<strong>✕ Inte riktigt (0.0 p)</strong><br><strong>Facit:</strong> ${q.expl}`;
    }
  } else {
    input.onkeydown = (e) => { if (e.key === "Enter") submitTextAnswer(); };
  }

  wrapper.appendChild(input);
  wrapper.appendChild(resBox);

  if (!answerData) {
    const submitBtn = document.createElement("button");
    submitBtn.type = "button";
    submitBtn.className = "btn-action btn-next";
    submitBtn.style.marginTop = "14px";
    submitBtn.textContent = "Rätta svar";
    submitBtn.onclick = submitTextAnswer;
    wrapper.appendChild(submitBtn);
  }

  container.appendChild(wrapper);

  document.getElementById("btnBack").disabled = (idx === 0);
  document.getElementById("btnNext").textContent = (idx === questions.length - 1) ? "Slutför" : "Nästa";
  updateProgress();
}

function submitTextAnswer() {
  const input = document.getElementById("textInput");
  const val = input.value.trim();
  if (!val) return;

  const q = questions[currentIndex];
  const userClean = val.replace(/\s+/g, "").toLowerCase();
  const expectedClean = q.expectedIp.replace(/\s+/g, "").toLowerCase();

  // Smart kontroll: kollar om användarens svar innehåller det förväntade IP-mönstret/värdet
  let isCorrect = userClean.includes(expectedClean);

  // Extra flexibilitet för punkter (t.ex. om man skriver "50" istället för ".50")
  if (!isCorrect && expectedClean.startsWith(".")) {
    const altExpected = expectedClean.replace(".", "");
    if (userClean === altExpected) {
      isCorrect = true;
    }
  }

  userAnswers[currentIndex] = {
    textVal: val,
    isCorrect: isCorrect
  };
  loadQuestion(currentIndex);
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    loadQuestion(currentIndex);
  } else {
    showSummary();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion(currentIndex);
  }
}

function showSummary() {
  document.getElementById("quizContent").style.display = "none";
  document.getElementById("progressRow").style.display = "none";
  document.getElementById("bottomBar").style.display = "none";

  let correctCount = 0;
  questions.forEach((_, i) => {
    if (userAnswers[i] && userAnswers[i].isCorrect) correctCount++;
  });

  document.getElementById("summaryView").style.display = "block";
  document.getElementById("finalScore").textContent = `${correctCount} / ${questions.length}`;

  const pct = (correctCount / questions.length) * 100;
  const fb = document.getElementById("finalFeedback");
  if (pct >= 85) fb.textContent = "Fantastiskt bra! Du har full kontroll på hur man räknar ut Net-ID och Host-ID.";
  else if (pct >= 60) fb.textContent = "Bra jobbat! Grunderna sitter, men kika igenom de du missade en extra gång.";
  else fb.textContent = "Kör gärna igenom övningen en gång till så sätter sig uträkningarna perfekt!";
}

function restartQuiz() {
  currentIndex = 0;
  userAnswers = {};
  randomizeQuiz();
  document.getElementById("summaryView").style.display = "none";
  document.getElementById("quizContent").style.display = "block";
  document.getElementById("progressRow").style.display = "flex";
  document.getElementById("bottomBar").style.display = "flex";
  loadQuestion(0);
}

window.onload = () => {
  randomizeQuiz();
  initSegments();
  loadQuestion(0);
};
</script>
</body>
</html>
