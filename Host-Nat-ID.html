<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Träning: Net-ID & Host-ID - Jensen Campus</title>
  <style>
    :root {
      --bg: #060b11;
      --card-bg: #0b1522;
      --gold-primary: #e6c260;
      --gold-glow: rgba(230, 194, 96, 0.28);
      --gold-gradient: linear-gradient(135deg, #fae287 0%, #d4af37 50%, #9e7d23 100%);
      --gold-border: rgba(212, 175, 55, 0.55);
      --text: #f8fafc;
      --text-muted: #9fb0c3;
      --correct: #22c55e;
      --wrong: #ef4444;
      --opt-bg: #112033;
      --opt-hover: #182c45;
      --opt-border: rgba(212, 175, 55, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .modal-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 880px;
      border-radius: 26px;
      border: 2px solid var(--gold-border);
      padding: 34px 38px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 35px var(--gold-glow);
      display: flex;
      flex-direction: column;
      min-height: 700px;
      justify-content: space-between;
    }

    .header-box {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px;
      border-bottom: 1.5px solid var(--gold-border);
      padding-bottom: 20px;
      box-shadow: 0 6px 15px -8px var(--gold-glow);
    }

    .jensen-logo-svg {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #060b11;
      border: 2px solid var(--gold-primary);
      box-shadow: 0 0 16px var(--gold-glow);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
    }

    .header-titles h1 {
      font-size: 1.55rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    .header-titles p {
      font-size: 0.95rem;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .segments {
      display: flex;
      gap: 3px;
      flex: 1;
    }

    .seg {
      height: 6px;
      flex: 1;
      background: #18283b;
      border-radius: 3px;
      transition: background 0.2s;
    }

    .seg.correct { background: var(--correct); }
    .seg.wrong { background: var(--wrong); }
    .seg.current { 
      background: var(--gold-primary); 
      box-shadow: 0 0 8px var(--gold-primary);
    }

    .step-text {
      font-size: 1rem;
      color: var(--gold-primary);
      font-weight: 700;
      white-space: nowrap;
    }

    .pill-counter {
      display: flex;
      gap: 8px;
    }

    .count-pill {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
    }

    .pill-red { background: rgba(239, 68, 68, 0.22); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .pill-green { background: rgba(34, 197, 94, 0.22); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.4); }

    .q-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .q-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 800;
      color: #070e17;
      background: var(--gold-gradient);
      padding: 3px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      box-shadow: 0 2px 8px var(--gold-glow);
    }

    .q-type-badge {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: #121f30;
      border: 1px solid var(--gold-border);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .q-text {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.5;
      color: #ffffff;
      margin-bottom: 14px;
    }

    .hint-btn {
      background: none;
      border: none;
      color: var(--gold-primary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 18px;
      display: inline-block;
      padding: 0;
    }

    .hint-box {
      display: none;
      background: rgba(212, 175, 55, 0.1);
      border-left: 4px solid var(--gold-primary);
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 0.98rem;
      color: #fef08a;
      margin-bottom: 18px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 20px;
    }

    .opt-card {
      background: var(--opt-bg);
      border: 1px solid var(--opt-border);
      border-radius: 14px;
      padding: 16px 20px;
      color: #f1f5f9;
      text-align: left;
      font-size: 1.05rem;
      line-height: 1.45;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .opt-card:hover:not(:disabled) {
      background: var(--opt-hover);
      border-color: var(--gold-primary);
      transform: translateY(-1px);
    }

    .opt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .badge-result {
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .opt-card.correct-opt {
      background: rgba(34, 197, 94, 0.22);
      border-color: var(--correct);
    }
    .opt-card.correct-opt .badge-result { background: #22c55e; color: #fff; }

    .opt-card.wrong-opt {
      background: rgba(239, 68, 68, 0.22);
      border-color: var(--wrong);
    }
    .opt-card.wrong-opt .badge-result { background: #ef4444; color: #fff; }

    .opt-explanation {
      margin-top: 10px;
      padding-top: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e2e8f0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .text-input-wrapper {
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      border: 1.5px solid var(--gold-border);
      background: var(--opt-bg);
      color: #fff;
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 14px var(--gold-glow);
    }

    .text-result-box {
      display: none;
      margin-top: 16px;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 1.02rem;
      line-height: 1.55;
    }
    .text-result-correct { background: rgba(34, 197, 94, 0.2); border: 1.5px solid var(--correct); color: #86efac; }
    .text-result-wrong { background: rgba(239, 68, 68, 0.2); border: 1.5px solid var(--wrong); color: #fca5a5; }

    .bottom-bar {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      margin-top: 14px;
    }

    .btn-action {
      padding: 12px 30px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-back { background: #132438; color: #cbd5e1; border: 1px solid var(--gold-border); }
    .btn-back:hover:not(:disabled) { background: #1b324e; }

    .btn-next { 
      background: var(--gold-gradient); 
      color: #070e17; 
      box-shadow: 0 0 16px var(--gold-glow); 
    }
    .btn-next:hover:not(:disabled) { 
      filter: brightness(1.1); 
      transform: translateY(-1px);
    }

    .btn-action:disabled { opacity: 0.35; cursor: not-allowed; }

    .summary-view {
      display: none;
      text-align: center;
      padding: 40px 16px;
    }
    .summary-view h2 { 
      font-size: 2.2rem; 
      margin-bottom: 12px; 
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800; 
    }
    .score-badge-large { 
      font-size: 3.8rem; 
      font-weight: 800; 
      color: var(--gold-primary); 
      margin: 16px 0; 
      text-shadow: 0 0 25px var(--gold-glow); 
    }
    .summary-desc { color: var(--text-muted); font-size: 1.15rem; max-width: 600px; margin: 0 auto 28px; line-height: 1.6; }
  </style>
</head>
<body>

<div class="modal-container">
  <div>
    <div class="header-box">
      <div class="jensen-logo-svg">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#d4af37" stroke-width="2.5" />
          <circle cx="50" cy="50" r="41" fill="none" stroke="#d4af37" stroke-width="1.2" />
          <polygon points="50,16 52,21 57,21 53,24 55,29 50,26 45,29 47,24 43,21 48,21" fill="#d4af37"/>
          <polygon points="63,22 64.5,25.5 68,25.5 65,28 66,31.5 63,29.5 60,31.5 61,28 58,25.5 61.5,25.5" fill="#d4af37"/>
          <polygon points="73,34 74.5,37.5 78,37.5 75,40 76,43.5 73,41.5 70,43.5 71,40 68,37.5 71.5,37.5" fill="#d4af37"/>
          <polygon points="58,35 59.5,38.5 63,38.5 60,41 61,44.5 58,42.5 55,44.5 56,41 53,38.5 56.5,38.5" fill="#d4af37"/>
          <polygon points="68,48 69.5,51.5 73,51.5 70,54 71,57.5 68,55.5 65,57.5 66,54 63,51.5 66.5,51.5" fill="#d4af37"/>
          <path d="M 33,26 L 52,26 L 52,40 C 52,45 42,48 33,48 C 24,48 24,40 24,40 L 24,26 Z" fill="none" stroke="#d4af37" stroke-width="1.2"/>
          <text x="38" y="36" fill="#d4af37" font-size="7.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">1996</text>
          <path d="M 32,70 C 37,58 48,50 63,45" fill="none" stroke="#d4af37" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="32" y1="70" x2="63" y2="45" stroke="#d4af37" stroke-width="1" />
          <line x1="30" y1="67" x2="68" y2="42" stroke="#d4af37" stroke-width="2.2" stroke-linecap="round"/>
          <polygon points="68,42 62,40 64,46" fill="#d4af37" />
          <circle cx="36" cy="62" r="5" fill="none" stroke="#d4af37" stroke-width="1.6" />
          <path id="textPath" d="M 20,68 A 38,38 0 0,0 80,68" fill="none" />
          <text fill="#d4af37" font-size="7.2" font-weight="bold" letter-spacing="1.5">
            <textPath href="#textPath" startOffset="50%" text-anchor="middle">JENSEN CAMPUS</textPath>
          </text>
        </svg>
      </div>
      <div class="header-titles">
        <h1>Intensivträning: Net-ID & Host-ID</h1>
        <p>Jensen Education • 15 Instuderingsfrågor (Klass A, B & C)</p>
      </div>
    </div>

    <div class="progress-row" id="progressRow">
      <div class="segments" id="segments"></div>
      <div class="step-text" id="stepCounter">1/15</div>
      <div class="pill-counter">
        <div class="count-pill pill-red" id="pillWrong">✕ 0</div>
        <div class="count-pill pill-green" id="pillCorrect">✓ 0</div>
      </div>
    </div>

    <div id="quizContent">
      <div class="q-meta">
        <span class="q-badge" id="qBadge">Net-ID / Host-ID</span>
        <span class="q-type-badge" id="qTypeBadge">Flerval</span>
      </div>
      <div class="q-text" id="qText">Laddar fråga...</div>

      <button type="button" class="hint-btn" onclick="toggleHint()">💡 Visa ledtråd</button>
      <div class="hint-box" id="hintBox"></div>

      <div id="questionContainer"></div>
    </div>

    <div class="summary-view" id="summaryView">
      <h2>Träning genomförd!</h2>
      <div class="score-badge-large" id="finalScore">0 / 15</div>
      <p class="summary-desc" id="finalFeedback"></p>
      <button type="button" class="btn-action btn-next" onclick="restartQuiz()">Gör om träningen</button>
    </div>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <button type="button" class="btn-action btn-back" id="btnBack" onclick="prevQuestion()" disabled>Tillbaka</button>
    <button type="button" class="btn-action btn-next" id="btnNext" onclick="nextQuestion()">Nästa</button>
  </div>
</div>

<script>
const questions = [
  // 1 (Text)
  {
    id: 1,
    type: "text",
    module: "Teori: Net-ID",
    q: "Hur räknar man ut Net-ID (gatunamnet)?",
    hint: "AND-jämförelse med subnätmasken. Där masken har 255 behåller man siffrorna, resten blir nollor.",
    fullCheck: (txt) => (txt.includes("and") || txt.includes("jämför")) && (txt.includes("mask") || txt.includes("255") || txt.includes("behåll") || txt.includes("noll")),
    partialCheck: (txt) => txt.includes("and") || txt.includes("mask") || txt.includes("255"),
    expl: "Man jämför IP-adressen med subnätmasken (en matematisk AND-jämförelse). Där masken har 255 behåller man siffrorna, resten blir nollor. Ex: 192.168.1.25 AND 255.255.255.0 = 192.168.1.0."
  },
  // 2 (Text)
  {
    id: 2,
    type: "text",
    module: "Teori: Host-ID",
    q: "Hur räknar man ut Host-ID (husnumret)? Ge gärna ett exempel.",
    hint: "Ta bort nätverksdelen – siffrorna som blir över är Host-ID.",
    fullCheck: (txt) => (txt.includes("ta bort") || txt.includes("kvar") || txt.includes("spar") || txt.includes("över")) && (txt.includes("nät") || txt.includes("host") || txt.includes("mask") || txt.includes("ip")),
    partialCheck: (txt) => txt.includes("host") || txt.includes("kvar") || txt.includes("ta bort"),
    expl: "Man tar IP-adressen och tar bort nätverksdelen – siffrorna som blir över är Host-ID. Ex: IP 192.168.1.25 med mask 255.255.255.0 -> Kvar blir: .25 (Host-ID)."
  },
  // 3 (MC)
  {
    id: 3,
    type: "mc",
    module: "Klass C: Net-ID",
    q: "En dator har IP 192.168.1.25 och mask 255.255.255.0. Vad är dess Net-ID?",
    hint: "Behåll siffrorna vid 255, nollställ resten.",
    options: [
      "192.168.1.0",
      "192.168.0.0",
      "192.0.0.0",
      "192.168.1.25",
      "192.168.1.255",
      "255.255.255.0"
    ],
    correct: 0,
    expl: "Där masken har 255 behåller man siffrorna (192.168.1), och där masken har 0 sätter man en nolla (.0). Net-ID blir 192.168.1.0."
  },
  // 4 (Text)
  {
    id: 4,
    type: "text",
    module: "Klass C: Host-ID",
    q: "En dator har IP 192.168.1.25 och mask 255.255.255.0. Vad är dess Host-ID?",
    hint: "Ta bort nätverksdelen 192.168.1 – vad blir kvar?",
    fullCheck: (txt) => txt === "25" || txt === ".25" || txt.includes("25"),
    partialCheck: (txt) => txt.includes("25"),
    expl: "Nätverksdelen är 192.168.1. Tar man bort den blir siffran .25 kvar, vilket är datorns Host-ID."
  },
  // 5 (MC)
  {
    id: 5,
    type: "mc",
    module: "Klass B: Net-ID",
    q: "En dator har IP 172.16.10.5 och standardmasken 255.255.0.0. Vad är dess Net-ID?",
    hint: "Klass B behåller de två första siffrorna och nollställer de två sista.",
    options: [
      "172.16.0.0",
      "172.16.10.0",
      "172.0.0.0",
      "172.16.10.5",
      "172.16.255.255",
      "255.255.0.0"
    ],
    correct: 0,
    expl: "Masken 255.255.0.0 behåller de två första oktetterna (172.16) och nollställer resten (.0.0). Net-ID blir 172.16.0.0."
  },
  // 6 (Text)
  {
    id: 6,
    type: "text",
    module: "Klass B: Host-ID",
    q: "En dator har IP 172.16.10.5 och mask 255.255.0.0. Vad är dess Host-ID?",
    hint: "Ta bort nätverksdelen 172.16 – vad blir kvar?",
    fullCheck: (txt) => txt === "10.5" || txt === ".10.5" || txt.includes("10.5"),
    partialCheck: (txt) => txt.includes("10") && txt.includes("5"),
    expl: "Nätverksdelen är 172.16. Tar man bort den blir .10.5 kvar som datorns Host-ID."
  },
  // 7 (MC)
  {
    id: 7,
    type: "mc",
    module: "Klass A: Net-ID",
    q: "En dator har IP 10.20.30.40 och standardmasken 255.0.0.0. Vad är dess Net-ID?",
    hint: "Klass A behåller bara den första siffran och nollställer resten.",
    options: [
      "10.0.0.0",
      "10.20.0.0",
      "10.20.30.0",
      "10.20.30.40",
      "10.255.255.255",
      "255.0.0.0"
    ],
    correct: 0,
    expl: "Masken 255.0.0.0 behåller bara den allra första siffran (10) och sätter nollor på resten. Net-ID blir 10.0.0.0."
  },
  // 8 (MC)
  {
    id: 8,
    type: "mc",
    module: "Klass A: Host-ID",
    q: "En dator har IP 10.20.30.40 och mask 255.0.0.0. Vad är dess Host-ID?",
    hint: "Ta bort nätverksdelen 10 – vad blir över?",
    options: [
      ".20.30.40",
      ".30.40",
      ".40",
      "10.0.0.40",
      "10.20.30.0",
      ".0.0.0"
    ],
    correct: 0,
    expl: "Nätverksdelen är 10. Tar man bort den är det .20.30.40 som blir kvar som datorns Host-ID."
  },
  // 9 (Text)
  {
    id: 9,
    type: "text",
    module: "Klass C: Snabbfråga",
    q: "Vilket Net-ID har en dator med IP 192.168.0.50 och subnätmask 255.255.255.0?",
    hint: "Skriv hela IP-adressen för nätverket (slutar på .0).",
    fullCheck: (txt) => txt === "192.168.0.0" || txt.includes("192.168.0.0"),
    partialCheck: (txt) => txt.includes("192.168.0"),
    expl: "192.168.0.50 AND 255.255.255.0 ger Net-ID: 192.168.0.0."
  },
  // 10 (Text)
  {
    id: 10,
    type: "text",
    module: "Klass C: Snabbfråga",
    q: "Vad är Host-ID för IP-adressen 192.168.0.50 med masken 255.255.255.0?",
    hint: "Bara siffran som blir kvar efter att 192.168.0 tagits bort.",
    fullCheck: (txt) => txt === "50" || txt === ".50" || txt.includes("50"),
    partialCheck: (txt) => txt.includes("50"),
    expl: "Kvar blir bara .50, vilket är Host-ID."
  },
  // 11 (MC)
  {
    id: 11,
    type: "mc",
    module: "Liknelse: Gatunamn & Husnummer",
    q: "I kursens liknelse med postadresser, vad motsvarar Net-ID respektive Host-ID?",
    hint: "Gatunamnet visar vilket område man bor på, husnumret visar exakt vem du är.",
    options: [
      "Net-ID är gatunamnet (nätverket) och Host-ID är husnumret (den unika datorn).",
      "Net-ID är postnumret och Host-ID är namnet på staden.",
      "Net-ID är routerns lösenord och Host-ID är datorns MAC-adress.",
      "Net-ID är datorns användarnamn och Host-ID är nätverkskortets tillverkare.",
      "Net-ID är kabelns maxlängd och Host-ID är signalens hastighet.",
      "Net-ID är webbadressen och Host-ID är portnumret för HTTP."
    ],
    correct: 0,
    expl: "Precis som i liknelsen: Net-ID är gatunamnet (alla på samma gata delar detta) och Host-ID är husnumret (varje hus/dator har ett eget unikt nummer på gatan)."
  },
  // 12 (MC)
  {
    id: 12,
    type: "mc",
    module: "Standardmasker",
    q: "Vilka standardmasker hör ihop med Klass A, Klass B och Klass C?",
    hint: "Klass A har en 255:a, Klass B har två, Klass C har tre.",
    options: [
      "Klass A: 255.0.0.0, Klass B: 255.255.0.0, Klass C: 255.255.255.0.",
      "Klass A: 255.255.255.0, Klass B: 255.255.0.0, Klass C: 255.0.0.0.",
      "Klass A: 255.0.0.0, Klass B: 255.0.0.0, Klass C: 255.255.0.0.",
      "Klass A: 255.255.0.0, Klass B: 255.255.255.0, Klass C: 255.255.255.255.",
      "Klass A: 126.0.0.0, Klass B: 191.0.0.0, Klass C: 223.0.0.0.",
      "Klass A: 255.255.255.255, Klass B: 255.255.0.0, Klass C: 0.0.0.0."
    ],
    correct: 0,
    expl: "Klass A = 255.0.0.0 (/8). Klass B = 255.255.0.0 (/16). Klass C = 255.255.255.0 (/24)."
  },
  // 13 (MC)
  {
    id: 13,
    type: "mc",
    module: "Kommunicera på samma nät",
    q: "Två datorer har IP 192.168.1.10 och 192.168.1.20 med mask 255.255.255.0. Har de samma Net-ID?",
    hint: "Räkna ut Net-ID för båda: blir det 192.168.1.0 för båda?",
    options: [
      "Ja, båda har Net-ID 192.168.1.0 och tillhör därmed samma nätverk.",
      "Nej, de har olika Net-ID eftersom de har olika siffror i slutet (.10 och .20).",
      "Nej, för att ha samma Net-ID måste de ha exakt samma Host-ID.",
      "Ja, men bara om de är kopplade med en korsad STP-kabel.",
      "Nej, två datorer i Klass C kan aldrig dela samma gatunamn.",
      "Ja, men trafiken måste alltid gå via Default Gateway för att nå fram."
    ],
    correct: 0,
    expl: "Båda har Net-ID 192.168.1.0! De bor alltså på samma gata och kan prata med varandra direkt utan router."
  },
  // 14 (MC)
  {
    id: 14,
    type: "mc",
    module: "Kommunicera på olika nät",
    q: "Dator 1 har IP 192.168.1.10 och Dator 2 har IP 192.168.2.10 (mask 255.255.255.0). Vad gäller?",
    hint: "Jämför deras Net-ID: 192.168.1.0 gentemot 192.168.2.0.",
    options: [
      "De har olika Net-ID (192.168.1.0 och 192.168.2.0) och behöver en router (Default Gateway) för att nå varandra.",
      "De har samma Net-ID eftersom båda slutar på .10.",
      "De kan prata direkt utan router eftersom båda börjar på 192.168.",
      "De kraschar nätverket eftersom de har samma Host-ID (.10).",
      "De kan bara kommunicera om man byter till koaxialkabel.",
      "De kan inte kommunicera alls eftersom Klass C har slut på adresser."
    ],
    correct: 0,
    expl: "Dator 1 tillhör nätet 192.168.1.0 och Dator 2 tillhör nätet 192.168.2.0. De har olika gatunamn och trafiken måste gå via en router (Default Gateway)."
  },
  // 15 (Text)
  {
    id: 15,
    type: "text",
    module: "Klass B: Snabbfråga",
    q: "Vilket Net-ID får IP-adressen 172.20.5.8 med standardmasken 255.255.0.0?",
    hint: "Klass B behåller de två första siffrorna och sätter nollor på resten.",
    fullCheck: (txt) => txt === "172.20.0.0" || txt.includes("172.20.0.0"),
    partialCheck: (txt) => txt.includes("172.20"),
    expl: "172.20.5.8 AND 255.255.0.0 ger Net-ID: 172.20.0.0."
  }
];

let currentIndex = 0;
let userAnswers = {};

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function randomizeQuiz() {
  shuffleArray(questions);
  questions.forEach(q => {
    if (q.type === "mc") {
      const correctText = q.options[q.correct];
      shuffleArray(q.options);
      q.correct = q.options.indexOf(correctText);
    }
  });
}

function initSegments() {
  const segContainer = document.getElementById("segments");
  segContainer.innerHTML = questions.map((_, i) => `<div class="seg" id="seg-${i}"></div>`).join("");
}

function updateProgress() {
  const total = questions.length;
  document.getElementById("stepCounter").textContent = `${currentIndex + 1}/${total}`;

  let correctCount = 0;
  let wrongCount = 0;

  questions.forEach((_, i) => {
    const seg = document.getElementById(`seg-${i}`);
    seg.className = "seg";
    if (userAnswers[i] !== undefined) {
      if (userAnswers[i].isCorrect) {
        seg.classList.add("correct");
        correctCount++;
      } else {
        seg.classList.add("wrong");
        wrongCount++;
      }
    } else if (i === currentIndex) {
      seg.classList.add("current");
    }
  });

  document.getElementById("pillCorrect").textContent = `✓ ${correctCount}`;
  document.getElementById("pillWrong").textContent = `✕ ${wrongCount}`;
}

function toggleHint() {
  const box = document.getElementById("hintBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function normalize(str) {
  return str.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, " ").replace(/\s+/g, " ").trim();
}

function loadQuestion(idx) {
  const q = questions[idx];
  document.getElementById("qBadge").textContent = q.module;
  document.getElementById("qTypeBadge").textContent = (q.type === "mc") ? "Flerval" : "Fritext (skriv svar)";
  document.getElementById("qText").textContent = `${idx + 1}. ${q.q}`;
  document.getElementById("hintBox").textContent = q.hint;
  document.getElementById("hintBox").style.display = "none";

  const container = document.getElementById("questionContainer");
  container.innerHTML = "";

  const answerData = userAnswers[idx];

  if (q.type === "mc") {
    const list = document.createElement("div");
    list.className = "options-list";

    q.options.forEach((optText, optIdx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opt-card";

      let badgeHtml = "";
      let isSelected = (answerData && answerData.selected === optIdx);
      let isCorrectOpt = (optIdx === q.correct);

      if (answerData) {
        btn.disabled = true;
        if (isCorrectOpt) {
          btn.classList.add("correct-opt");
          badgeHtml = `<span class="badge-result">✓ Rätt svar</span>`;
        } else if (isSelected) {
          btn.classList.add("wrong-opt");
          badgeHtml = `<span class="badge-result">✕ Fel svar</span>`;
        }
      } else {
        btn.onclick = () => chooseMcOption(optIdx);
      }

      let extraText = isSelected ? " (Ditt svar)" : "";
      let explHtml = (answerData && (isCorrectOpt || isSelected)) ? `<div class="opt-explanation">${q.expl}</div>` : "";

      btn.innerHTML = `
        <div class="opt-header">
          <span>${optText}<strong>${extraText}</strong></span>
          ${badgeHtml}
        </div>
        ${explHtml}
      `;
      list.appendChild(btn);
    });
    container.appendChild(list);

  } else if (q.type === "text") {
    const wrapper = document.createElement("div");
    wrapper.className = "text-input-wrapper";

    const input = document.createElement("input");
    input.type = "text";
    input.id = "textInput";
    input.placeholder = "Skriv svaret här och tryck Enter / Rätta...";
    input.autocomplete = "off";

    const resBox = document.createElement("div");
    resBox.id = "textResBox";
    resBox.className = "text-result-box";

    if (answerData) {
      input.value = answerData.textVal;
      input.disabled = true;
      resBox.style.display = "block";
      if (answerData.score >= 1.0) {
        resBox.className = "text-result-box text-result-correct";
        resBox.innerHTML = `<strong>✓ Helt rätt! (1.0 p)</strong><br>${q.expl}`;
      } else if (answerData.score >= 0.5) {
        resBox.className = "text-result-box text-result-correct";
        resBox.innerHTML = `<strong>✓ Delvis rätt! (0.5 p)</strong><br>${q.expl}`;
      } else {
        resBox.className = "text-result-box text-result-wrong";
        resBox.innerHTML = `<strong>✕ Inte riktigt (0.0 p)</strong><br><strong>Facit:</strong> ${q.expl}`;
      }
    } else {
      input.onkeydown = (e) => { if (e.key === "Enter") submitTextAnswer(); };
    }

    wrapper.appendChild(input);
    wrapper.appendChild(resBox);

    if (!answerData) {
      const submitBtn = document.createElement("button");
      submitBtn.type = "button";
      submitBtn.className = "btn-action btn-next";
      submitBtn.style.marginTop = "14px";
      submitBtn.textContent = "Rätta svar";
      submitBtn.onclick = submitTextAnswer;
      wrapper.appendChild(submitBtn);
    }

    container.appendChild(wrapper);
  }

  document.getElementById("btnBack").disabled = (idx === 0);
  document.getElementById("btnNext").textContent = (idx === questions.length - 1) ? "Slutför" : "Nästa";
  updateProgress();
}

function chooseMcOption(selectedIdx) {
  if (userAnswers[currentIndex] !== undefined) return;
  const q = questions[currentIndex];
  userAnswers[currentIndex] = {
    selected: selectedIdx,
    isCorrect: (selectedIdx === q.correct)
  };
  loadQuestion(currentIndex);
}

function submitTextAnswer() {
  const input = document.getElementById("textInput");
  const val = input.value.trim();
  if (!val) return;

  const q = questions[currentIndex];
  const clean = normalize(val);
  let score = 0;

  if (q.fullCheck(clean)) score = 1.0;
  else if (q.partialCheck(clean)) score = 0.5;

  userAnswers[currentIndex] = {
    textVal: val,
    score: score,
    isCorrect: (score >= 0.5)
  };
  loadQuestion(currentIndex);
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    loadQuestion(currentIndex);
  } else {
    showSummary();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion(currentIndex);
  }
}

function showSummary() {
  document.getElementById("quizContent").style.display = "none";
  document.getElementById("progressRow").style.display = "none";
  document.getElementById("bottomBar").style.display = "none";

  let correctCount = 0;
  questions.forEach((_, i) => {
    if (userAnswers[i] && userAnswers[i].isCorrect) correctCount++;
  });

  document.getElementById("summaryView").style.display = "block";
  document.getElementById("finalScore").textContent = `${correctCount} / ${questions.length}`;

  const pct = (correctCount / questions.length) * 100;
  const fb = document.getElementById("finalFeedback");
  if (pct >= 85) fb.textContent = "Grymt! Du har full koll på gatunamn (Net-ID) och husnummer (Host-ID) inför provet.";
  else if (pct >= 60) fb.textContent = "Bra jobbat! Grundprincipen sitter, repetera skillnaden mellan Klass A, B och C en extra gång.";
  else fb.textContent = "Kör igenom quizet en gång till så sitter beräkningarna i ryggmärgen!";
}

function restartQuiz() {
  currentIndex = 0;
  userAnswers = {};
  randomizeQuiz();
  document.getElementById("summaryView").style.display = "none";
  document.getElementById("quizContent").style.display = "block";
  document.getElementById("progressRow").style.display = "flex";
  document.getElementById("bottomBar").style.display = "flex";
  loadQuestion(0);
}

window.onload = () => {
  randomizeQuiz();
  initSegments();
  loadQuestion(0);
};
</script>

</html>
