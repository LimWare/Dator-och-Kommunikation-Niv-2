<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flervalsquiz: Datorhårdvara & BIOS/UEFI</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.15);
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.15);
      --opt-hover: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: var(--card-border);
      border-radius: 999px;
      overflow: hidden;
      margin: 16px 0 20px 0;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      color: var(--text-sub);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .question-category {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .question-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-main);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.4;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--opt-hover);
      border-color: var(--primary);
    }

    .option-key {
      font-weight: 700;
      color: var(--primary);
      min-width: 22px;
    }

    .option-btn.correct {
      background: var(--success-bg) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
    }

    .option-btn.correct .option-key {
      color: var(--success) !important;
    }

    .option-btn.incorrect {
      background: var(--error-bg) !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
    }

    .option-btn.incorrect .option-key {
      color: var(--error) !important;
    }

    .explanation-box {
      background: rgba(15, 23, 42, 0.8);
      border-left: 4px solid var(--primary);
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: none;
      font-size: 0.9rem;
      color: var(--text-main);
      line-height: 1.5;
    }

    .explanation-box.active {
      display: block;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
    }

    .btn-next {
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: var(--primary);
      color: #0f172a;
      transition: all 0.2s ease;
      display: none;
    }

    .btn-next:hover {
      background: var(--primary-hover);
    }

    .summary-screen {
      display: none;
      text-align: center;
    }

    .summary-screen.active {
      display: block;
    }

    .summary-title {
      font-size: 1.6rem;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .repeat-list {
      margin-top: 20px;
      text-align: left;
      background: rgba(15, 23, 42, 0.6);
      padding: 18px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    .repeat-list ul {
      padding-left: 20px;
      margin-top: 10px;
    }

    .repeat-list li {
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    .repeat-list li strong {
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Datorhårdvara & BIOS/UEFI</h1>
      <p>Träna med 16 flervalsfrågor och direkt feedback</p>
    </header>

    <div class="stats-bar">
      <span id="progress-text">Fråga 1 av 16</span>
      <span id="score-text">Poäng: 0</span>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- Frågekort -->
    <div class="card" id="quiz-card">
      <div class="question-category" id="q-category">Kategori</div>
      <h2 class="question-title" id="q-text">Frågetext</h2>

      <div class="options-grid" id="options-container"></div>

      <div class="explanation-box" id="explanation-box"></div>

      <div class="actions">
        <button class="btn-next" id="btn-next">Nästa fråga →</button>
      </div>
    </div>

    <!-- Slutskärm -->
    <div class="card summary-screen" id="summary-card">
      <h2 class="summary-title">Quizet är klart!</h2>
      <p id="summary-score" style="font-size: 1.2rem; margin-bottom: 12px;"></p>
      
      <div class="repeat-list" id="repeat-container" style="display: none;">
        <h3 style="color: var(--error); font-size: 1.05rem;">Frågor att repetera:</h3>
        <ul id="repeat-list"></ul>
      </div>

      <div style="margin-top: 24px;">
        <button class="btn-next" id="btn-restart" style="display: inline-block;">Starta om quizet</button>
      </div>
    </div>
  </div>

  <script>
    const QUESTIONS = [
      {
        id: 1,
        category: "Kommandorad",
        question: "Vilket kommandoradsverktyg i Windows fungerar som ett modernt samlingsgränssnitt som kan köra cmd, PowerShell och Linux-kommandon via WSL under samma tak?",
        options: [
          "PowerShell ISE",
          "Windows Terminal",
          "Git Bash",
          "Command Prompt (cmd.exe)"
        ],
        answer: 1,
        explanation: "Windows Terminal samlar cmd.exe, PowerShell och WSL-sessioner i en och samma flikbaserade applikation."
      },
      {
        id: 2,
        category: "CPU-komponenter",
        question: "Vilken del av processorn (CPU) ansvarar för att utföra matematiska beräkningar och logiska jämförelser?",
        options: [
          "Control Unit (CU / Styrenheten)",
          "Bussarna (Adress- och databuss)",
          "Arithmetic Logic Unit (ALU)",
          "Cache-minnet"
        ],
        answer: 2,
        explanation: "ALU utför beräkningar och logik, medan CU tolkar instruktioner och styr processorn."
      },
      {
        id: 3,
        category: "CPU & Moderkort",
        question: "Vad är processorns klocka och vad gör den?",
        options: [
          "Ett batteri på moderkortet som sparar tidszonen när strömmen är avslagen",
          "En komponent som skapar elektriska pulser för att synkronisera operationer och sätta hastigheten i cykler per sekund",
          "Ett diagnostikverktyg som mäter temperaturen i processorns kärnor",
          "En databuss som transporterar instruktioner direkt mellan CPU och grafikkortet"
        ],
        answer: 1,
        explanation: "Klockan sätter hastigheten i antal cykler per sekund (GHz) och synkroniserar processorns alla operationer."
      },
      {
        id: 4,
        category: "Felsökning PSU",
        question: "Vilket mätverktyg används för att kontrollera spänning, ström och motstånd vid felsökning av ett nätaggregat (PSU)?",
        options: [
          "Multimeter",
          "POST-kort",
          "Oscilloskop",
          "MemTest-dongel"
        ],
        answer: 0,
        explanation: "En multimeter mäter elektriska värden som likspänning (12V, 5V, 3.3V), ström och resistans i kretsar och nätaggregat."
      },
      {
        id: 5,
        category: "Felsökning RAM",
        question: "Hur skiljer sig MemTest86 från Windows Memory Diagnostic vid felsökning av arbetsminne?",
        options: [
          "MemTest86 körs automatiskt vid Windows inloggningsskärm",
          "MemTest86 kan bara testa ECC-minnen på servrar",
          "MemTest86 körs som en bakgrundsprocess inuti Windows Aktivitethanterare",
          "MemTest86 bootas från ett USB-minne/CD innan operativsystemet laddas för att hitta djupare fel"
        ],
        answer: 3,
        explanation: "MemTest86 körs helt fristående från operativsystemet via ett startbart USB-minne, vilket ger djupare tester utan Windows-begränsningar."
      },
      {
        id: 6,
        category: "Felsökning Hårddisk",
        question: "Vad är den rekommenderade metoden för att felsöka mekaniska hårddiskar efter dåliga sektorer?",
        options: [
          "Koppla in disken via USB 2.0 för att tvinga fram en långsam avläsning",
          "Köra hårddisktillverkarnas egna diagnosverktyg (t.ex. Seagate SeaTools eller WD Data Lifeguard)",
          "Formatera disken till FAT32 och sedan tillbaka till NTFS",
          "Öppna chassit på hårddisken för att visuellt kontrollera läshuvudena"
        ],
        answer: 1,
        explanation: "Tillverkarnas egna mjukvaror (SeaTools, WD Lifeguard m.fl.) gör djupa S.M.A.R.T.-kontroller och ytskanningar för defekta sektorer."
      },
      {
        id: 7,
        category: "Felsökning Moderkort",
        question: "Vad innebär rekommendationen att starta ett misstänkt defekt moderkort med 'minimal hårdvara'?",
        options: [
          "Att montera bort CPU-kylaren under en kort start för att se om den blir varm",
          "Att endast ansluta moderkort, PSU, CPU och en enda RAM-modul för att utesluta andra komponenter",
          "Att köra systemet utan nätaggregat via ett internt CMOS-batteri",
          "Att endast ansluta hårddisken och nätverkskabeln för att se om nätverkslampan blinkar"
        ],
        answer: 1,
        explanation: "Minimal hårdvara isolerar basen (moderkort + CPU + PSU + 1 RAM) så att trasiga tillbehör, extra RAM eller diskar inte blockerar uppstarten."
      },
      {
        id: 8,
        category: "Uppstart / BIOS",
        question: "Vad är POST (Power-On Self Test) och vad händer om ett fel upptäcks under testet?",
        options: [
          "Ett antivirusprogram som skannar MBR och varnar via e-post om filer är skadade",
          "Ett självtest som körs av operativsystemets kernel vid inloggning",
          "Ett hårdvarutest som körs direkt vid start av BIOS/UEFI, och som varnar med pipkoder eller textfel om något är trasigt",
          "Ett prestandatest som överklockar grafikkortet vid uppstart"
        ],
        answer: 2,
        explanation: "POST testar CPU, minne, GPU och grundläggande hårdvara innan operativsystemet ens laddas, och varnar med pipkoder eller koder på skärmen."
      },
      {
        id: 9,
        category: "Uppstart / BIOS",
        question: "Hur skiljer sig Bootstrap Loaders funktion på en modern GPT-disk jämfört med en äldre MBR-disk?",
        options: [
          "På GPT letar UEFI efter en EFI System Partition (ESP), medan BIOS på äldre diskar söker i MBR/boot-sektorn",
          "På GPT hoppar UEFI helt över bootloadern och startar kerneln direkt från BIOS-chippet",
          "På MBR laddas kerneln till grafikkortets minne, medan GPT laddar till RAM",
          "På GPT krävs alltid en internetanslutning för att ladda bootloadern"
        ],
        answer: 0,
        explanation: "BIOS läser den första fysiska sektorn (MBR), medan modernt UEFI letar efter bootfiler i partitionen ESP (EFI System Partition)."
      },
      {
        id: 10,
        category: "BIOS/UEFI",
        question: "Vad är BIOS och vad är dess primära syfte innan operativsystemet tar över?",
        options: [
          "En drivrutin i Windows som hanterar 3D-acceleration och ljudkort",
          "Ett system som tillhandahåller inbyggda I/O-funktioner för att kommunicera med skärm, tangentbord och diskar vid start",
          "Ett programvarugränssnitt för att skapa virtuella diskar i molnet",
          "En krypteringsteknik som låser RAM-minnet vid strömavbrott"
        ],
        answer: 1,
        explanation: "Basic Input/Output System (BIOS) hjälper datorn att starta och hanterar grundläggande in-/utdata innan OS laddats."
      },
      {
        id: 11,
        category: "Lagringsgränssnitt",
        question: "Vilka är två stora fördelar med AHCI jämfört med äldre ATA/IDE-läge för lagringsenheter?",
        options: [
          "Dubblerar nätverkskortets hastighet och inaktiverar virtuella maskiner",
          "Gör att mekaniska hårddiskar kan läsas utan rotationsmotor",
          "Native Command Queuing (NCQ) för optimerad läsordning och bättre prestanda för SSD",
          "Kräver inte att moderkortet har SATA-kablar anslutna"
        ],
        answer: 2,
        explanation: "AHCI erbjuder NCQ (optimerad köhantering) samt fullt stöd och optimering för moderna SSD-enheter och Hot Swap."
      },
      {
        id: 12,
        category: "Processorinställningar",
        question: "När bör funktionen Core Multi-Processing i BIOS sättas till Disabled?",
        options: [
          "När man spelar moderna krävande 3D-spel",
          "När man ska installera flera virtuella maskiner",
          "När man felsöker äldre mjukvara som har kompatibilitetsproblem med flera processorkärnor",
          "När man vill förlänga batteritiden på en bärbar dator vid videorendering"
        ],
        answer: 2,
        explanation: "Core Multi-Processing bör normalt alltid vara Enabled, men kan inaktiveras för att felsöka äldre mjukvara som kraschar med mer än en aktiv kärna."
      },
      {
        id: 13,
        category: "Virtualisering",
        question: "Vad gör Intel Virtualization Technology (Intel VT-x) och när ska det aktiveras i BIOS?",
        options: [
          "Tillåter datorn att köra flera operativsystem samtidigt via virtuella maskiner (VMware, VirtualBox, Hyper-V)",
          "Ökar grafikkortets upplösning i Windows-spel",
          "Kopplar ihop datorns CPU-kärnor med en extern molnserver",
          "Skapar virtuellt RAM-minne på hårddisken om RAM tar slut"
        ],
        answer: 0,
        explanation: "Intel VT-x ger hårdvaruacceleration för hypervisors så att virtuella maskiner kan köra gäst-OS med full prestanda."
      },
      {
        id: 14,
        category: "Energihantering",
        question: "Vad är huvudsyftet med inställningarna under menyn Power Management i BIOS/UEFI?",
        options: [
          "Att tvinga nätaggregatet att alltid leverera maximal effekt oavsett belastning",
          "Att konfigurera strömförbrukning och vilolägen för att spara energi och batteritid",
          "Att ladda batteriet i trådlösa möss via USB när datorn är avstängd",
          "Att mäta spänningsfall i moderkortets kondensatorer"
        ],
        answer: 1,
        explanation: "Power Management styr datorns vilolägen och strömsparfunktioner när systemet inte används aktivt."
      },
      {
        id: 15,
        category: "Nätverk / Uppstart",
        question: "Vad innebär funktionen Wake-on-LAN (WoL)?",
        options: [
          "Att datorn automatiskt kopplar upp sig mot ett dolt trådlöst nätverk",
          "Att datorn startas eller väcks ur viloläge på distans när en speciell nätverksförfrågan (Magic Packet) tas emot",
          "Att nätverkskortet piper högt om nätverkskabeln lossnar",
          "Att datorn blockerar all trafik från internet när användaren sover"
        ],
        answer: 1,
        explanation: "Wake-on-LAN gör att nätverkskortet lyssnar i strömsparläge och väcker datorn när en specifik nätverksförfrågan skickas."
      },
      {
        id: 16,
        category: "Underhåll / BIOS",
        question: "Vilket av följande är en vanlig och viktig anledning till att göra en BIOS-uppdatering?",
        options: [
          "För att få kompatibilitet med nyare CPU/RAM, buggfixar samt säkerhetsfixar mot Spectre/Meltdown",
          "För att permanent ta bort behovet av ett nätaggregat",
          "För att rensa bort virus och skadlig kod från Windows-skrivbordet",
          "För att återställa glömda lösenord på sociala medier"
        ],
        answer: 0,
        explanation: "BIOS-uppdateringar ger mikrokodsstöd för nyare hårdvara, åtgärdar kända buggar och täpper till hårdvarunära sårbarheter som Spectre och Meltdown."
      }
    ];

    let currentIndex = 0;
    let score = 0;
    let reviewList = [];

    const qCategoryEl = document.getElementById("q-category");
    const qTextEl = document.getElementById("q-text");
    const optionsContainerEl = document.getElementById("options-container");
    const explanationBoxEl = document.getElementById("explanation-box");
    const btnNextEl = document.getElementById("btn-next");
    const progressTextEl = document.getElementById("progress-text");
    const scoreTextEl = document.getElementById("score-text");
    const progressBarEl = document.getElementById("progress-bar");
    const quizCardEl = document.getElementById("quiz-card");
    const summaryCardEl = document.getElementById("summary-card");
    const summaryScoreEl = document.getElementById("summary-score");
    const repeatContainerEl = document.getElementById("repeat-container");
    const repeatListEl = document.getElementById("repeat-list");
    const btnRestartEl = document.getElementById("btn-restart");

    const OPTION_KEYS = ["A", "B", "C", "D"];

    function renderQuestion() {
      if (currentIndex >= QUESTIONS.length) {
        showSummary();
        return;
      }

      const q = QUESTIONS[currentIndex];
      qCategoryEl.textContent = `Fråga ${currentIndex + 1} av ${QUESTIONS.length} • ${q.category}`;
      qTextEl.textContent = q.question;

      optionsContainerEl.innerHTML = "";
      explanationBoxEl.classList.remove("active");
      explanationBoxEl.textContent = "";
      btnNextEl.style.display = "none";

      progressTextEl.textContent = `Fråga ${currentIndex + 1} av ${QUESTIONS.length}`;
      scoreTextEl.textContent = `Poäng: ${score}`;
      progressBarEl.style.width = `${(currentIndex / QUESTIONS.length) * 100}%`;

      q.options.forEach((optText, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<span class="option-key">${OPTION_KEYS[index]})</span> <span>${optText}</span>`;
        btn.addEventListener("click", () => handleSelectAnswer(index));
        optionsContainerEl.appendChild(btn);
      });
    }

    function handleSelectAnswer(selectedIndex) {
      const q = QUESTIONS[currentIndex];
      const buttons = optionsContainerEl.querySelectorAll(".option-btn");

      buttons.forEach(btn => btn.disabled = true);

      if (selectedIndex === q.answer) {
        score++;
        buttons[selectedIndex].classList.add("correct");
        explanationBoxEl.innerHTML = `<strong>Rätt svar!</strong> ${q.explanation}`;
      } else {
        buttons[selectedIndex].classList.add("incorrect");
        buttons[q.answer].classList.add("correct");
        explanationBoxEl.innerHTML = `<strong>Fel svar.</strong> Rätt alternativ var <strong>${OPTION_KEYS[q.answer]}</strong>.<br>${q.explanation}`;
        
        if (!reviewList.some(item => item.id === q.id)) {
          reviewList.push({
            category: q.category,
            question: q.question,
            correctAnswer: q.options[q.answer]
          });
        }
      }

      scoreTextEl.textContent = `Poäng: ${score}`;
      explanationBoxEl.classList.add("active");
      btnNextEl.style.display = "inline-block";
    }

    function handleNext() {
      currentIndex++;
      renderQuestion();
    }

    function showSummary() {
      quizCardEl.style.display = "none";
      summaryCardEl.classList.add("active");
      progressBarEl.style.width = "100%";
      progressTextEl.textContent = `Avslutad (${QUESTIONS.length}/${QUESTIONS.length})`;
      scoreTextEl.textContent = `Slutpoäng: ${score}`;

      const pct = Math.round((score / QUESTIONS.length) * 100);
      summaryScoreEl.textContent = `Du fick ${score} av ${QUESTIONS.length} rätt (${pct}%)!`;

      if (reviewList.length > 0) {
        repeatContainerEl.style.display = "block";
        repeatListEl.innerHTML = "";
        reviewList.forEach(item => {
          const li = document.createElement("li");
          li.innerHTML = `<strong>${item.category}:</strong> ${item.question}<br><span style="color: var(--success);">Rätt svar: ${item.correctAnswer}</span>`;
          repeatListEl.appendChild(li);
        });
      } else {
        repeatContainerEl.style.display = "none";
      }
    }

    function restart() {
      currentIndex = 0;
      score = 0;
      reviewList = [];
      quizCardEl.style.display = "block";
      summaryCardEl.classList.remove("active");
      renderQuestion();
    }

    btnNextEl.addEventListener("click", handleNext);
    btnRestartEl.addEventListener("click", restart);

    // Starta quizet direkt
    renderQuestion();
  </script>
</body>
</html>
