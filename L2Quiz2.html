<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hårdvara & BIOS/UEFI - 20 Flervalsfrågor</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.15);
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.15);
      --opt-hover: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 740px;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: var(--card-border);
      border-radius: 999px;
      overflow: hidden;
      margin: 16px 0 20px 0;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      color: var(--text-sub);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .question-category {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-main);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.4;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--opt-hover);
      border-color: var(--primary);
    }

    .option-key {
      font-weight: 700;
      color: var(--primary);
      min-width: 22px;
    }

    .option-btn.correct {
      background: var(--success-bg) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
    }

    .option-btn.correct .option-key {
      color: var(--success) !important;
    }

    .option-btn.incorrect {
      background: var(--error-bg) !important;
      border-color: var(--error) !important;
      color: var(--error) !important;
    }

    .option-btn.incorrect .option-key {
      color: var(--error) !important;
    }

    .explanation-box {
      background: rgba(15, 23, 42, 0.8);
      border-left: 4px solid var(--primary);
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: none;
      font-size: 0.9rem;
      color: var(--text-main);
      line-height: 1.5;
    }

    .explanation-box.active {
      display: block;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
    }

    .btn-next {
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: var(--primary);
      color: #0f172a;
      transition: all 0.2s ease;
      display: none;
    }

    .btn-next:hover {
      background: var(--primary-hover);
    }

    .summary-screen {
      display: none;
      text-align: center;
    }

    .summary-screen.active {
      display: block;
    }

    .summary-title {
      font-size: 1.6rem;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .repeat-list {
      margin-top: 20px;
      text-align: left;
      background: rgba(15, 23, 42, 0.6);
      padding: 18px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    .repeat-list ul {
      padding-left: 20px;
      margin-top: 10px;
    }

    .repeat-list li {
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    .repeat-list li strong {
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Hårdvara, Felsökning & BIOS/UEFI</h1>
      <p>Komplett träningspass med 20 flervalsfrågor</p>

    <div class="stats-bar">

    </div>

      <div class="explanation-box" id="explanation-box"></div>

      <div class="actions">
        <button class="btn-next" id="btn-next">Nästa fråga →</button>
      </div>

        <ul id="repeat-list"></ul>
      </div>

      <div style="margin-top: 24px;">
        <button class="btn-next" id="btn-restart" style="display: inline-block;">Starta om quizet</button>
      </div>
    </div>
  </div>

      qTextEl.textContent = q.question;

      optionsContainerEl.innerHTML = "";
      explanationBoxEl.classList.remove("active");
      explanationBoxEl.textContent = "";
      btnNextEl.style.display = "none";

      progressTextEl.textContent = `Fråga ${currentIndex + 1} av ${QUESTIONS.length}`;
      scoreTextEl.textContent = `Poäng: ${score}`;
      progressBarEl.style.width = `${(currentIndex / QUESTIONS.length) * 100}%`;

      q.options.forEach((optText, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<span class="option-key">${OPTION_KEYS[index]})</span> <span>${optText}</span>`;
        btn.addEventListener("click", () => handleSelectAnswer(index));
        optionsContainerEl.appendChild(btn);
      });
    }

    function handleSelectAnswer(selectedIndex) {
      const q = QUESTIONS[currentIndex];
      const buttons = optionsContainerEl.querySelectorAll(".option-btn");

      buttons.forEach(btn => btn.disabled = true);

      if (selectedIndex === q.answer) {
        score++;
        buttons[selectedIndex].classList.add("correct");
        explanationBoxEl.innerHTML = `<strong>Rätt svar!</strong> ${q.explanation}`;
      } else {
        buttons[selectedIndex].classList.add("incorrect");
        buttons[q.answer].classList.add("correct");
        explanationBoxEl.innerHTML = `<strong>Fel svar.</strong> Rätt alternativ var <strong>${OPTION_KEYS[q.answer]}</strong>.<br>${q.explanation}`;
        
        if (!reviewList.some(item => item.id === q.id)) {
          reviewList.push({
            category: q.category,
            question: q.question,
            correctAnswer: q.options[q.answer]
          });
        }
      }

      scoreTextEl.textContent = `Poäng: ${score}`;
      explanationBoxEl.classList.add("active");
      btnNextEl.style.display = "inline-block";
    }

    function handleNext() {
      currentIndex++;
      renderQuestion();
    }

    function showSummary() {
      quizCardEl.style.display = "none";
      summaryCardEl.classList.add("active");
      progressBarEl.style.width = "100%";
      progressTextEl.textContent = `Avslutad (${QUESTIONS.length}/${QUESTIONS.length})`;
      scoreTextEl.textContent = `Slutpoäng: ${score}`;

      const pct = Math.round((score / QUESTIONS.length) * 100);
      summaryScoreEl.textContent = `Du fick ${score} av ${QUESTIONS.length} rätt (${pct}%)!`;

      if (reviewList.length > 0) {
        repeatContainerEl.style.display = "block";
        repeatListEl.innerHTML = "";
        reviewList.forEach(item => {
          const li = document.createElement("li");
          li.innerHTML = `<strong>${item.category}:</strong> ${item.question}<br><span style="color: var(--success);">Rätt svar: ${item.correctAnswer}</span>`;
          repeatListEl.appendChild(li);
        });
      } else {
        repeatContainerEl.style.display = "none";
      }
    }

    function restart() {
      currentIndex = 0;
      score = 0;
      reviewList = [];
      quizCardEl.style.display = "block";
      summaryCardEl.classList.remove("active");
      renderQuestion();
    }

    btnNextEl.addEventListener("click", handleNext);
    btnRestartEl.addEventListener("click", restart);

    renderQuestion();
  </script>
</body>
</html>
