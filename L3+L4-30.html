<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provfrågor: L3 Nätverk & L4 Internet - Jensen Campus</title>
  <style>
    :root {
      --bg: #060b11;
      --card-bg: #0b1522;
      --gold-primary: #e6c260;
      --gold-glow: rgba(230, 194, 96, 0.28);
      --gold-gradient: linear-gradient(135deg, #fae287 0%, #d4af37 50%, #9e7d23 100%);
      --gold-border: rgba(212, 175, 55, 0.55);
      --text: #f8fafc;
      --text-muted: #9fb0c3;
      --correct: #22c55e;
      --wrong: #ef4444;
      --opt-bg: #112033;
      --opt-hover: #182c45;
      --opt-border: rgba(212, 175, 55, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .modal-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 880px;
      border-radius: 26px;
      border: 2px solid var(--gold-border);
      padding: 34px 38px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 35px var(--gold-glow);
      display: flex;
      flex-direction: column;
      min-height: 740px;
      justify-content: space-between;
    }

    /* Header med guldstil och fullständig Jensen-logo */
    .header-box {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px;
      border-bottom: 1.5px solid var(--gold-border);
      padding-bottom: 20px;
      box-shadow: 0 6px 15px -8px var(--gold-glow);
    }

    .jensen-logo-svg {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #060b11;
      border: 2px solid var(--gold-primary);
      box-shadow: 0 0 16px var(--gold-glow);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
    }

    .header-titles h1 {
      font-size: 1.55rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    .header-titles p {
      font-size: 0.95rem;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    /* Progress bar */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .segments {
      display: flex;
      gap: 3px;
      flex: 1;
    }

    .seg {
      height: 6px;
      flex: 1;
      background: #18283b;
      border-radius: 3px;
      transition: background 0.2s;
    }

    .seg.correct { background: var(--correct); }
    .seg.wrong { background: var(--wrong); }
    .seg.current { 
      background: var(--gold-primary); 
      box-shadow: 0 0 8px var(--gold-primary);
    }

    .step-text {
      font-size: 1rem;
      color: var(--gold-primary);
      font-weight: 700;
      white-space: nowrap;
    }

    .pill-counter {
      display: flex;
      gap: 8px;
    }

    .count-pill {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
    }

    .pill-red { background: rgba(239, 68, 68, 0.22); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .pill-green { background: rgba(34, 197, 94, 0.22); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.4); }

    /* Metadata & Question */
    .q-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .q-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 800;
      color: #070e17;
      background: var(--gold-gradient);
      padding: 3px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      box-shadow: 0 2px 8px var(--gold-glow);
    }

    .q-type-badge {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: #121f30;
      border: 1px solid var(--gold-border);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .q-text {
      font-size: 1.28rem;
      font-weight: 700;
      line-height: 1.5;
      color: #ffffff;
      margin-bottom: 14px;
    }

    .hint-btn {
      background: none;
      border: none;
      color: var(--gold-primary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 18px;
      display: inline-block;
      padding: 0;
    }

    .hint-box {
      display: none;
      background: rgba(212, 175, 55, 0.1);
      border-left: 4px solid var(--gold-primary);
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 0.98rem;
      color: #fef08a;
      margin-bottom: 18px;
    }

    /* Options - Större och tydligare */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 20px;
    }

    .opt-card {
      background: var(--opt-bg);
      border: 1px solid var(--opt-border);
      border-radius: 14px;
      padding: 16px 20px;
      color: #f1f5f9;
      text-align: left;
      font-size: 1.05rem;
      line-height: 1.45;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .opt-card:hover:not(:disabled) {
      background: var(--opt-hover);
      border-color: var(--gold-primary);
      transform: translateY(-1px);
    }

    .opt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .badge-result {
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .opt-card.correct-opt {
      background: rgba(34, 197, 94, 0.22);
      border-color: var(--correct);
    }
    .opt-card.correct-opt .badge-result { background: #22c55e; color: #fff; }

    .opt-card.wrong-opt {
      background: rgba(239, 68, 68, 0.22);
      border-color: var(--wrong);
    }
    .opt-card.wrong-opt .badge-result { background: #ef4444; color: #fff; }

    .opt-explanation {
      margin-top: 10px;
      padding-top: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e2e8f0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Text input */
    .text-input-wrapper {
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      border: 1.5px solid var(--gold-border);
      background: var(--opt-bg);
      color: #fff;
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 14px var(--gold-glow);
    }

    .text-result-box {
      display: none;
      margin-top: 16px;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 1.02rem;
      line-height: 1.55;
    }
    .text-result-correct { background: rgba(34, 197, 94, 0.2); border: 1.5px solid var(--correct); color: #86efac; }
    .text-result-wrong { background: rgba(239, 68, 68, 0.2); border: 1.5px solid var(--wrong); color: #fca5a5; }

    /* Bottom actions */
    .bottom-bar {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      margin-top: 14px;
    }

    .btn-action {
      padding: 12px 30px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-back { background: #132438; color: #cbd5e1; border: 1px solid var(--gold-border); }
    .btn-back:hover:not(:disabled) { background: #1b324e; }

    .btn-next { 
      background: var(--gold-gradient); 
      color: #070e17; 
      box-shadow: 0 0 16px var(--gold-glow); 
    }
    .btn-next:hover:not(:disabled) { 
      filter: brightness(1.1); 
      transform: translateY(-1px);
    }

    .btn-action:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Summary view */
    .summary-view {
      display: none;
      text-align: center;
      padding: 40px 16px;
    }
    .summary-view h2 { 
      font-size: 2.2rem; 
      margin-bottom: 12px; 
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800; 
    }
    .score-badge-large { 
      font-size: 3.8rem; 
      font-weight: 800; 
      color: var(--gold-primary); 
      margin: 16px 0; 
      text-shadow: 0 0 25px var(--gold-glow); 
    }
    .summary-desc { color: var(--text-muted); font-size: 1.15rem; max-width: 600px; margin: 0 auto 28px; line-height: 1.6; }
  </style>
</head>
<body>

<div class="modal-container">
  <div>
    <div class="header-box">
      <!-- Jensen Campus Emblem SVG -->
      <div class="jensen-logo-svg">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#d4af37" stroke-width="2.5" />
          <circle cx="50" cy="50" r="41" fill="none" stroke="#d4af37" stroke-width="1.2" />
          <!-- Stjärnor -->
          <polygon points="50,16 52,21 57,21 53,24 55,29 50,26 45,29 47,24 43,21 48,21" fill="#d4af37"/>
          <polygon points="63,22 64.5,25.5 68,25.5 65,28 66,31.5 63,29.5 60,31.5 61,28 58,25.5 61.5,25.5" fill="#d4af37"/>
          <polygon points="73,34 74.5,37.5 78,37.5 75,40 76,43.5 73,41.5 70,43.5 71,40 68,37.5 71.5,37.5" fill="#d4af37"/>
          <polygon points="58,35 59.5,38.5 63,38.5 60,41 61,44.5 58,42.5 55,44.5 56,41 53,38.5 56.5,38.5" fill="#d4af37"/>
          <polygon points="68,48 69.5,51.5 73,51.5 70,54 71,57.5 68,55.5 65,57.5 66,54 63,51.5 66.5,51.5" fill="#d4af37"/>
          <!-- Sköld med bok 1996 -->
          <path d="M 33,26 L 52,26 L 52,40 C 52,45 42,48 33,48 C 24,48 24,40 24,40 L 24,26 Z" fill="none" stroke="#d4af37" stroke-width="1.2"/>
          <text x="38" y="36" fill="#d4af37" font-size="7.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">1996</text>
          <!-- Bågskytt / Pilbåge -->
          <path d="M 32,70 C 37,58 48,50 63,45" fill="none" stroke="#d4af37" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="32" y1="70" x2="63" y2="45" stroke="#d4af37" stroke-width="1" />
          <line x1="30" y1="67" x2="68" y2="42" stroke="#d4af37" stroke-width="2.2" stroke-linecap="round"/>
          <polygon points="68,42 62,40 64,46" fill="#d4af37" />
          <circle cx="36" cy="62" r="5" fill="none" stroke="#d4af37" stroke-width="1.6" />
          <!-- Text längst ner i cirkel -->
          <path id="textPath" d="M 20,68 A 38,38 0 0,0 80,68" fill="none" />
          <text fill="#d4af37" font-size="7.2" font-weight="bold" letter-spacing="1.5">
            <textPath href="#textPath" startOffset="50%" text-anchor="middle">JENSEN CAMPUS</textPath>
          </text>
        </svg>
      </div>
      <div class="header-titles">
        <h1>Provfrågor: L3 Nätverk & L4 Internet</h1>
        <p>Jensen Education • Slutprovsträning (30 Frågor: Flerval & Fritext)</p>
      </div>
    </div>

    <div class="progress-row" id="progressRow">
      <div class="segments" id="segments"></div>
      <div class="step-text" id="stepCounter">1/30</div>
      <div class="pill-counter">
        <div class="count-pill pill-red" id="pillWrong">✕ 0</div>
        <div class="count-pill pill-green" id="pillCorrect">✓ 0</div>
      </div>
    </div>

    <div id="quizContent">
      <div class="q-meta">
        <span class="q-badge" id="qBadge">L3 / L4</span>
        <span class="q-type-badge" id="qTypeBadge">Flerval</span>
      </div>
      <div class="q-text" id="qText">Laddar fråga...</div>

      <button type="button" class="hint-btn" onclick="toggleHint()">💡 Visa ledtråd</button>
      <div class="hint-box" id="hintBox"></div>

      <div id="questionContainer"></div>
    </div>

    <div class="summary-view" id="summaryView">
      <h2>Provträning genomförd!</h2>
      <div class="score-badge-large" id="finalScore">0 / 30</div>
      <p class="summary-desc" id="finalFeedback"></p>
      <button type="button" class="btn-action btn-next" onclick="restartQuiz()">Gör om provet</button>
    </div>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <button type="button" class="btn-action btn-back" id="btnBack" onclick="prevQuestion()" disabled>Tillbaka</button>
    <button type="button" class="btn-action btn-next" id="btnNext" onclick="nextQuestion()">Nästa</button>
  </div>
</div>

<script>
const questions = [
  // 1 (L3 - MC)
  {
    id: 1,
    type: "mc",
    module: "L3: Nätverkstyper",
    q: "Vilket alternativ beskriver nätverkstyperna PAN, LAN, MAN och WAN helt korrekt?",
    hint: "Tänk från minsta personliga (Bluetooth) till hela världens nätverk.",
    options: [
      "PAN: Personligt/nära (Bluetooth), LAN: Lokalt (hem/skola), MAN: Stadsnät, WAN: Över länder/världen (Internet).",
      "PAN: Offentliga nätverk, LAN: Satellitnätverk, MAN: Datacenter, WAN: Bluetooth-enheter.",
      "PAN: Industriella nät, LAN: Stadskommunikation, MAN: Privata hem, WAN: Trådlösa sensorer.",
      "PAN: Virtuella switchar, LAN: Fiber backbone, MAN: Mobila basstationer, WAN: Lokala servrar.",
      "PAN: Molnservrar, LAN: Fordonskablar, MAN: Radiolänkar, WAN: Skrivarnätverk.",
      "PAN: PTP-länkar, LAN: Telefonväxlar, MAN: Datorprocessorer, WAN: Campusnätverk."
    ],
    correct: 0,
    expl: "PAN är personligt (Bluetooth), LAN är lokalt (hem/skola/kontor), MAN är stadsnät och WAN täcker länder/världen (Internet)."
  },
  // 2 (L3 - Text)
  {
    id: 2,
    type: "text",
    module: "L3: Topologier",
    q: "Nämn minst tre olika typer av nätverkstopologier och förklara kort var en av dem används.",
    hint: "T.ex. stjärna, buss, ring, mesh, träd eller hybrid.",
    fullCheck: (txt) => {
      let c = 0;
      if (txt.includes("stjärn")) c++;
      if (txt.includes("buss")) c++;
      if (txt.includes("ring")) c++;
      if (txt.includes("mesh")) c++;
      if (txt.includes("träd")) c++;
      if (txt.includes("hybrid")) c++;
      let hasUsage = txt.includes("switch") || txt.includes("kontor") || txt.includes("bil") || txt.includes("fordon") || txt.includes("datacenter") || txt.includes("företag") || txt.includes("hem");
      return c >= 3 && hasUsage;
    },
    partialCheck: (txt) => {
      let c = 0;
      if (txt.includes("stjärn")) c++;
      if (txt.includes("buss")) c++;
      if (txt.includes("ring")) c++;
      if (txt.includes("mesh")) c++;
      if (txt.includes("träd")) c++;
      return c >= 2;
    },
    expl: "Stjärna (switch, standard hem/kontor), Buss (fordon/bilar för att spara kabel), Ring (telekomnät), Mesh (datacenter för hög driftsäkerhet) eller Träd (stora företag)."
  },
  // 3 (L3 - MC)
  {
    id: 3,
    type: "mc",
    module: "L3: Topologianvändning",
    q: "Varför och var används buss- respektive mesh-topologier typiskt i praktiken?",
    hint: "Spara kabel i bilar gentemot redundans i datacenter.",
    options: [
      "Buss används mest i fordon/bilar för att spara kabel; Mesh används i datacenter för att det aldrig får gå ner.",
      "Buss används för internetleverantörer; Mesh används enbart hemma i sovrummet.",
      "Buss används i ubåtar; Mesh används endast i enkla leksaker.",
      "Buss används för trådlösa nät; Mesh används för gamla telegrafledningar.",
      "Buss används i stjärnnätverk; Mesh används enbart mellan skrivare.",
      "Buss kräver alltid fiber; Mesh kan enbart byggas med koaxialkablar."
    ],
    correct: 0,
    expl: "Buss: alla delar samma kabel, vanligt i fordon för att spara kabel. Mesh: alla har kontakt via flera vägar, används i datacenter för att förhindra driftstopp."
  },
  // 4 (L3 - MC)
  {
    id: 4,
    type: "mc",
    module: "L3: Nätverksmedia",
    q: "Vilka är de tre typerna av nätverksmedia och vad skickar de för signaler?",
    hint: "Koppar, fiber och trådlöst.",
    options: [
      "Koppar (skickar el), Fiber (skickar ljus) och Trådlöst (skickar radiovågor).",
      "Koax (ljud), Akustisk (ultraljud) och Laser (värme).",
      "Magnetband (magnetism), Infrarött (värme) och Koppar (el).",
      "Optisk disk (reflektion), Partvinnad (el) och Bluetooth (ljud).",
      "Mikrovågor (el), Batteri (ström) och Koax (ljus).",
      "Ethernet (el), IP (paket) och MAC (ramar)."
    ],
    correct: 0,
    expl: "Koppar (TP/koax) skickar el, Fiber (glas/plast) skickar ljus, och Trådlöst (Wi-Fi, 4G/5G, radio) skickar radiovågor."
  },
  // 5 (L3 - Text)
  {
    id: 5,
    type: "text",
    module: "L3: Bunden kommunikation",
    q: "Vad är bunden kommunikation?",
    hint: "Allt som går via en fysisk kabel gentemot luften.",
    fullCheck: (txt) => (txt.includes("kabel") || txt.includes("fysisk")) && (txt.includes("inte trådlös") || txt.includes("tråd") || txt.includes("fiber") || txt.includes("tp") || txt.includes("luften")),
    partialCheck: (txt) => txt.includes("kabel") || txt.includes("sladd") || txt.includes("fysisk"),
    expl: "Allt som går via en fysisk kabel (t.ex. vanlig nätverkskabel eller fiber), alltså inte trådlöst via luften."
  },
  // 6 (L3 - MC)
  {
    id: 6,
    type: "mc",
    module: "L3: TP-kablar",
    q: "Vad skiljer UTP från STP och vad är TP-kabelns absoluta maxlängd?",
    hint: "U = Unshielded, S = Shielded, max 100 meter.",
    options: [
      "UTP saknar skärm (billigast); STP har metallskärm mot elstörningar. Maxlängd: Alltid max 100 meter.",
      "UTP är optisk; STP är elektrisk. Maxlängd: 500 meter.",
      "UTP är för utomhusbruk; STP är för inomhusbruk. Maxlängd: 50 meter.",
      "UTP klarar 100 Gbps; STP klarar 1 Gbps. Maxlängd: 1 000 meter.",
      "UTP är halogenfri; STP innehåller bly. Maxlängd: 10 meter.",
      "UTP kräver PoE; STP kräver fiberomvandlare. Maxlängd: 250 meter."
    ],
    correct: 0,
    expl: "UTP saknar skärm (billigast). STP har metallskärm mot elstörningar. Maxlängden är alltid max 100 meter."
  },
  // 7 (L3 - MC)
  {
    id: 7,
    type: "mc",
    module: "L3: Koaxialkabel",
    q: "Beskriv en koaxialkabel samt dess främsta för- och nackdelar:",
    hint: "Tjock koppartråd i mitten, skärm runt, tål stryk men styv.",
    options: [
      "Tjock koppartråd i mitten, plastisolering och metallskärm runtom. Fördel: tål yttre störningar och stryk. Nackdel: styv och lägre kapacitet än fiber.",
      "Tunn glastråd med plastmantel. Fördel: lätt att böja. Nackdel: extremt känslig för åska.",
      "Två partvinnade silverledare. Fördel: böjbar. Nackdel: dyr.",
      "Koaxialkabel har 8 tunna koppartrådar. Fördel: billig. Nackdel: max 10 meter.",
      "Aluminiumkärna med gummi. Fördel: tål vatten. Nackdel: tål ej ström.",
      "Plastkärna för laser. Fördel: ingen fördröjning. Nackdel: går sönder vid 10 Mbps."
    ],
    correct: 0,
    expl: "Koax har en tjock koppartråd i mitten, plastisolering och metallskärm runtom (klassisk TV-sladd). Tål yttre störningar och stryk jättebra, men är styv, svårböjd och har lägre kapacitet än fiber."
  },
  // 8 (L3 - MC)
  {
    id: 8,
    type: "mc",
    module: "L3: Fiberkablar",
    q: "Vad är skillnaden mellan Singlemode och Multimode fiber?",
    hint: "Laser på milsvida sträckor gentemot LED för korta avstånd.",
    options: [
      "Singlemode: supertunn kärna med laser för flera mil; Multimode: tjockare kärna med LED för korta sträckor (hus/datacenter).",
      "Singlemode: för kopparnät; Multimode: för radionät.",
      "Singlemode: böjbar plast; Multimode: stelt glas.",
      "Singlemode: skickar 1 bit i taget; Multimode: skickar 8 bitar parallellt.",
      "Singlemode: max 100 meter; Multimode: max 50 mil.",
      "Singlemode: för hemmabruk; Multimode: enbart för rymdstationer."
    ],
    correct: 0,
    expl: "Singlemode har supertunn kärna med laser för jättelånga sträckor (flera mil). Multimode har tjockare kärna med enklare ljus (LED) för korta sträckor inom hus eller datacenter."
  },
  // 9 (L3 - Text)
  {
    id: 9,

let currentIndex = 0;
let userAnswers = {};

function initSegments() {
  const segContainer = document.getElementById("segments");
  segContainer.innerHTML = questions.map((_, i) => `<div class="seg" id="seg-${i}"></div>`).join("");
}

function updateProgress() {
  const total = questions.length;
  document.getElementById("stepCounter").textContent = `${currentIndex + 1}/${total}`;

  let correctCount = 0;
  let wrongCount = 0;

  questions.forEach((_, i) => {
    const seg = document.getElementById(`seg-${i}`);
    seg.className = "seg";
    if (userAnswers[i] !== undefined) {
      if (userAnswers[i].isCorrect) {
        seg.classList.add("correct");
        correctCount++;
      } else {
        seg.classList.add("wrong");
        wrongCount++;
      }
    } else if (i === currentIndex) {
      seg.classList.add("current");
    }
  });

  document.getElementById("pillCorrect").textContent = `✓ ${correctCount}`;
  document.getElementById("pillWrong").textContent = `✕ ${wrongCount}`;
}

function toggleHint() {
  const box = document.getElementById("hintBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function normalize(str) {
  return str.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, " ").replace(/\s+/g, " ").trim();
}

function loadQuestion(idx) {
  const q = questions[idx];
  document.getElementById("qBadge").textContent = q.module;
  document.getElementById("qTypeBadge").textContent = (q.type === "mc") ? "Flerval (6 alternativ)" : "Fritext (skriv själv)";
  document.getElementById("qText").textContent = `${idx + 1}. ${q.q}`;
  document.getElementById("hintBox").textContent = q.hint;
  document.getElementById("hintBox").style.display = "none";

  const container = document.getElementById("questionContainer");
  container.innerHTML = "";

  const answerData = userAnswers[idx];

  if (q.type === "mc") {
    const list = document.createElement("div");
    list.className = "options-list";

    q.options.forEach((optText, optIdx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opt-card";

      let badgeHtml = "";
      let isSelected = (answerData && answerData.selected === optIdx);
      let isCorrectOpt = (optIdx === q.correct);

      if (answerData) {
        btn.disabled = true;
        if (isCorrectOpt) {
          btn.classList.add("correct-opt");
          badgeHtml = `<span class="badge-result">✓ Rätt svar</span>`;
        } else if (isSelected) {
          btn.classList.add("wrong-opt");
          badgeHtml = `<span class="badge-result">✕ Fel svar</span>`;
        }
      } else {
        btn.onclick = () => chooseMcOption(optIdx);
      }

      let extraText = isSelected ? " (Ditt svar)" : "";
      let explHtml = (answerData && (isCorrectOpt || isSelected)) ? `<div class="opt-explanation">${q.expl}</div>` : "";

      btn.innerHTML = `
        <div class="opt-header">
          <span>${optText}<strong>${extraText}</strong></span>
          ${badgeHtml}
        </div>
        ${explHtml}
      `;
      list.appendChild(btn);
    });
    container.appendChild(list);

  } else if (q.type === "text") {
    const wrapper = document.createElement("div");
    wrapper.className = "text-input-wrapper";

    const input = document.createElement("input");
    input.type = "text";
    input.id = "textInput";
    input.placeholder = "Skriv ditt svar här och tryck Enter / Rätta svar...";
    input.autocomplete = "off";

    const resBox = document.createElement("div");
    resBox.id = "textResBox";
    resBox.className = "text-result-box";

    if (answerData) {
      input.value = answerData.textVal;
      input.disabled = true;
      resBox.style.display = "block";
      if (answerData.score >= 1.0) {
        resBox.className = "text-result-box text-result-correct";
        resBox.innerHTML = `<strong>✓ Helt rätt! (1.0 p)</strong><br>${q.expl}`;
      } else if (answerData.score >= 0.5) {
        resBox.className = "text-result-box text-result-correct";
        resBox.innerHTML = `<strong>✓ Delvis rätt! (0.5 p)</strong><br>${q.expl}`;
      } else {
        resBox.className = "text-result-box text-result-wrong";
        resBox.innerHTML = `<strong>✕ Inte riktigt (0.0 p)</strong><br><strong>Facit:</strong> ${q.expl}`;
      }
    } else {
      input.onkeydown = (e) => { if (e.key === "Enter") submitTextAnswer(); };
    }

    wrapper.appendChild(input);
    wrapper.appendChild(resBox);

    if (!answerData) {
      const submitBtn = document.createElement("button");
      submitBtn.type = "button";
      submitBtn.className = "btn-action btn-next";
      submitBtn.style.marginTop = "14px";
      submitBtn.textContent = "Rätta svar";
      submitBtn.onclick = submitTextAnswer;
      wrapper.appendChild(submitBtn);
    }

    container.appendChild(wrapper);
  }

  document.getElementById("btnBack").disabled = (idx === 0);
  document.getElementById("btnNext").textContent = (idx === questions.length - 1) ? "Slutför" : "Nästa";
  updateProgress();
}

function chooseMcOption(selectedIdx) {
  if (userAnswers[currentIndex] !== undefined) return;
  const q = questions[currentIndex];
  userAnswers[currentIndex] = {
    selected: selectedIdx,
    isCorrect: (selectedIdx === q.correct)
  };
  loadQuestion(currentIndex);
}

function submitTextAnswer() {
  const input = document.getElementById("textInput");
  const val = input.value.trim();
  if (!val) return;

  const q = questions[currentIndex];
  const clean = normalize(val);
  let score = 0;

  if (q.fullCheck(clean)) score = 1.0;
  else if (q.partialCheck(clean)) score = 0.5;

  userAnswers[currentIndex] = {
    textVal: val,
    score: score,
    isCorrect: (score >= 0.5)
  };
  loadQuestion(currentIndex);
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    loadQuestion(currentIndex);
  } else {
    showSummary();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion(currentIndex);
  }
}

function showSummary() {
  document.getElementById("quizContent").style.display = "none";
  document.getElementById("progressRow").style.display = "none";
  document.getElementById("bottomBar").style.display = "none";

  let correctCount = 0;
  questions.forEach((_, i) => {
    if (userAnswers[i] && userAnswers[i].isCorrect) correctCount++;
  });

  document.getElementById("summaryView").style.display = "block";
  document.getElementById("finalScore").textContent = `${correctCount} / ${questions.length}`;

  const pct = (correctCount / questions.length) * 100;
  const fb = document.getElementById("finalFeedback");
  if (pct >= 85) fb.textContent = "Fantastiskt bra! Du har full kontroll på alla 30 instuderingsfrågor inför provet på onsdag.";
  else if (pct >= 60) fb.textContent = "Bra jobbat! Grunderna sitter, läs igenom facit på frågorna du missade så sätter du toppbetyg på onsdag.";
  else fb.textContent = "Kör gärna igenom provet en gång till så sitter alla begrepp och adresser som ett smäck!";
}

function restartQuiz() {
  currentIndex = 0;
  userAnswers = {};
  document.getElementById("summaryView").style.display = "none";
  document.getElementById("quizContent").style.display = "block";
  document.getElementById("progressRow").style.display = "flex";
  document.getElementById("bottomBar").style.display = "flex";
  loadQuestion(0);
}

window.onload = () => {
  initSegments();
  loadQuestion(0);
};
</script>
