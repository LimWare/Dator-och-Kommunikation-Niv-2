<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nätverksquiz L4 - Direkt rättning</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border: #334155;
      --correct: #22c55e;
      --partial: #eab308;
      --wrong: #ef4444;
      --badge-bg: #1e1b4b;
      --badge-txt: #818cf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.85rem;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .smart-badge {
      display: inline-block;
      background: var(--badge-bg);
      border: 1px solid var(--badge-txt);
      color: var(--badge-txt);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 3px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .progress-container {
      margin-bottom: 18px;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #818cf8);
      transition: width 0.3s ease;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      min-height: 290px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .q-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .q-title {
      font-weight: 600;
      font-size: 1.2rem;
      line-height: 1.4;
    }

    .q-badge {
      background: #0f172a;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--accent);
      white-space: nowrap;
      border: 1px solid var(--border);
    }

    .hint-toggle {
      background: none;
      border: none;
      color: #fbbf24;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 12px;
      align-self: flex-start;
      padding: 0;
    }

    .hint-box {
      display: none;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: rgba(245, 158, 11, 0.08);
      border-left: 3px solid #f59e0b;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #fde68a;
    }

    .input-wrapper {
      margin-top: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b1120;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .result-box {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .result-correct {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid var(--correct);
      color: #86efac;
    }

    .result-partial {
      background: rgba(234, 179, 8, 0.12);
      border: 1px solid var(--partial);
      color: #fde047;
    }

    .result-wrong {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--wrong);
      color: #fca5a5;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      gap: 12px;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-submit {
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-nav {
      background: #334155;
      color: #fff;
    }

    .btn-nav:hover:not(:disabled) {
      background: #475569;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .summary-card {
      display: none;
      background: var(--card-bg);
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 36px 20px;
      text-align: center;
    }

    .summary-score {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent);
      margin: 12px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="smart-badge">⚡ Direkt rättning med tolerans</div>
    <h1>Nätverksquiz: L4</h1>
  </header>

  <div class="progress-container" id="progressContainer">
    <div class="progress-labels">
      <span id="stepLabel">Fråga 1 av 16</span>
      <span id="scoreLabel">Poäng: 0.0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="card" id="quizCard">
    <div>
      <div class="q-top">
        <div class="q-title" id="qTitle">Laddar fråga...</div>
        <div class="q-badge" id="qBadge">1.0 p</div>
      </div>

      <button type="button" class="hint-toggle" onclick="toggleHint()">💡 Visa ledtråd</button>
      <div class="hint-box" id="qHint"></div>

      <div class="input-wrapper">
        <input type="text" id="ansInput" placeholder="Skriv ditt svar här..." autocomplete="off" onkeydown="handleKey(event)" />
      </div>

      <div class="result-box" id="resBox"></div>
    </div>

    <div class="card-actions">
      <button type="button" class="btn btn-nav" id="btnPrev" onclick="prevQuestion()" disabled>← Föregående</button>
      <button type="button" class="btn btn-submit" id="btnCheck" onclick="submitAnswer()">Rätta svar</button>
      <button type="button" class="btn btn-nav" id="btnNext" onclick="nextQuestion()">Nästa →</button>
    </div>
  </div>

  <div class="summary-card" id="summaryCard">
    <h2>Resultat</h2>
    <div class="summary-score" id="finalScore">0 / 16</div>
    <p id="finalFeedback" style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 24px;"></p>
    <button type="button" class="btn btn-submit" onclick="restartQuiz()">🔄 Gör om quizet</button>
  </div>
</div>

<script>
const questions = [
  {
    id: 1,
    q: "Hur är en MAC-adress uppbyggd?",
    hint: "Tänk på hur många bitar/bytes den består av och vad de två halvorna representerar.",
    fullCheck: (txt) => (txt.includes("48") || txt.includes("6 byte") || txt.includes("12")) && (txt.includes("tillverk") || txt.includes("oui") || txt.includes("enhet") || txt.includes("produkt")),
    partialCheck: (txt) => txt.includes("3 första") || txt.includes("3 sista") || txt.includes("tillverk") || txt.includes("48") || txt.includes("6 byte"),
    expl: "En MAC-adress består av 48 bitar (6 bytes / 12 hex-tecken). Första halvan (3 bytes) är OUI (tillverkare) och sista halvan är enhetens unika ID."
  },
  {
    id: 2,
    q: "Vad är en MAC-adress?",
    hint: "Vilket lager i OSI-modellen och vad är funktionen på det fysiska nätverkskortet?",
    fullCheck: (txt) => txt.includes("fysisk") || txt.includes("personnummer") || txt.includes("lager 2") || txt.includes("hårdvar") || (txt.includes("unik") && txt.includes("kort")),
    partialCheck: (txt) => txt.includes("adress") || txt.includes("identifier") || txt.includes("id"),
    expl: "En MAC-adress är en unik fysisk hårdvaruadress som är inbränd i nätverkskortet (Lager 2). Kan liknas vid ett personnummer för nätverksenheten."
  },
  {
    id: 3,
    q: "Vilka historiska nätverksklasser för unicast finns det och ge exempel på deras adressintervall?",
    hint: "Klasserna har bokstäverna A, B och C. Tänk på vad första oktetten börjar på.",
    fullCheck: (txt) => txt.includes("klass a") && txt.includes("klass b") && txt.includes("klass c") && (txt.includes("126") || txt.includes("191") || txt.includes("192")),
    partialCheck: (txt) => (txt.includes("klass a") || txt.includes("klass b") || txt.includes("klass c")) || txt.includes("1-126"),
    expl: "Klass A (1–126), Klass B (128–191) och Klass C (192–223). Adress 127 är loopback, och 224+ är Klass D/E."
  },
  {
    id: 4,
    q: "Hur kan man beräkna Host-ID? (Förklara kort)",
    hint: "Vilka bitar i nätmasken tillhör host-delen (ettor eller nollor)?",
    fullCheck: (txt) => txt.includes("noll") || txt.includes("inverterad") || (txt.includes("host") && txt.includes("mask")),
    partialCheck: (txt) => txt.includes("nätmask") || txt.includes("subnät") || txt.includes("sista"),
    expl: "Host-ID motsvaras av de bitar i IP-adressen där nätmasken har binära nollor."
  },
  {
    id: 5,
    q: "Hur kan man beräkna Net-ID? (Förklara kort)",
    hint: "Vilken logisk grind/operation görs mellan IP-adressen och nätmasken?",
    fullCheck: (txt) => txt.includes("and") || (txt.includes("mask") && txt.includes("ettor")) || txt.includes("255"),
    partialCheck: (txt) => txt.includes("nätmask") || txt.includes("maska") || txt.includes("ettor"),
    expl: "Net-ID beräknas genom en bitvis logisk AND-operation mellan IP-adressen och nätmasken."
  },
  {
    id: 6,
    q: "Vilket adressintervall har Klass A och vad är dess typiska användningsområde?",
    hint: "Börjar på 1 och slutar precis före loopback.",
    fullCheck: (txt) => (txt.includes("1-126") || (txt.includes("1") && txt.includes("126"))) && (txt.includes("stor") || txt.includes("företag") || txt.includes("organis")),
    partialCheck: (txt) => txt.includes("1-126") || txt.includes("126") || txt.includes("stor"),
    expl: "Klass A har 1.0.0.0 – 126.255.255.255 och är avsett för mycket stora organisationer med enormt många värdenheter."
  },
  {
    id: 7,
    q: "Hur många nätverk kan Klass A maximalt ha?",
    hint: "7 bitar för nätverksdelen (2^7 = 128 minus nätverk 0 och loopback).",
    fullCheck: (txt) => txt.includes("126"),
    partialCheck: (txt) => txt.includes("128") || txt.includes("127"),
    expl: "126 användbara nätverk (2^7 = 128 minus nätverk 0 och loopback 127)."
  },
  {
    id: 8,
    q: "Hur många värdenheter (hosts) kan ett Klass A-nätverk ha?",
    hint: "24 bitar för hostdelen (2^24 minus 2 reserverade).",
    fullCheck: (txt) => txt.includes("16 777 214") || txt.includes("16777214") || txt.includes("16 miljon") || txt.includes("16777216"),
    partialCheck: (txt) => txt.includes("16") && txt.includes("miljon"),
    expl: "16 777 214 användbara värdenheter per nätverk (2^24 - 2)."
  },
  {
    id: 9,
    q: "Vilket adressintervall har Klass B och varför hoppas adressen 127 över?",
    hint: "Börjar på 128. Vad används 127 till lokalt på en dator?",
    fullCheck: (txt) => (txt.includes("128") && txt.includes("191")) && (txt.includes("loopback") || txt.includes("localhost") || txt.includes("intern") || txt.includes("test")),
    partialCheck: (txt) => txt.includes("128-191") || txt.includes("loopback") || txt.includes("localhost"),
    expl: "Klass B har 128.0.0.0 – 191.255.255.255. 127.0.0.0/8 hoppas över då det är reserverat för loopback (egen maskin)."
  },
  {
    id: 10,
    q: "Hur många nätverk kan Klass B ha?",
    hint: "14 bitar är tillgängliga för nätverket (2^14).",
    fullCheck: (txt) => txt.includes("16 384") || txt.includes("16384") || txt.includes("16 tusen"),
    partialCheck: (txt) => txt.includes("16"),
    expl: "16 384 nätverk (2^14)."
  },
  {
    id: 11,
    q: "Hur många användbara värdenheter (hosts) kan ett Klass B-nätverk ha?",
    hint: "16 bitar för hostdelen (2^16 - 2). Drygt 65 tusen.",
    fullCheck: (txt) => txt.includes("65 534") || txt.includes("65534") || txt.includes("65536") || txt.includes("65 tusen"),
    partialCheck: (txt) => txt.includes("65"),
    expl: "65 534 användbara värdenheter per nätverk (2^16 - 2)."
  },
  {
    id: 12,
    q: "Vilket adressintervall har Klass C?",
    hint: "Börjar direkt efter Klass B (191) och slutar vid 223.",
    fullCheck: (txt) => (txt.includes("192") && txt.includes("223")),
    partialCheck: (txt) => txt.includes("192") || (txt.includes("192") && (txt.includes("254") || txt.includes("255"))),
    expl: "Klass C sträcker sig från 192.0.0.0 till 223.255.255.255 (224 och uppåt är multicast Klass D/E)."
  },
  {
    id: 13,
    q: "Hur många nätverk kan Klass C ha?",
    hint: "21 bitar används för nätverket (2^21). Drygt 2 miljoner.",
    fullCheck: (txt) => txt.includes("2 097 152") || txt.includes("2097152") || txt.includes("2 miljon"),
    partialCheck: (txt) => txt.includes("2"),
    expl: "2 097 152 nätverk (2^21)."
  },
  {
    id: 14,
    q: "Hur många användbara värdenheter (hosts) kan ett Klass C-nätverk ha?",
    hint: "8 bitar för host (2^8 = 256), minus nätadress och broadcast.",
    fullCheck: (txt) => txt.includes("254"),
    partialCheck: (txt) => txt.includes("256"),
    expl: "254 användbara värdenheter (2^8 - 2 = 254). Adress .0 och .255 är reserverade."
  },
  {
    id: 15,
    q: "Vad är en Default Gateway och vilken enhet agerar oftast som detta?",
    hint: "Vart skickas paket som ska ut från det lokala nätet?",
    fullCheck: (txt) => txt.includes("router") && (txt.includes("annat") || txt.includes("utanför") || txt.includes("vidare") || txt.includes("skicka")),
    partialCheck: (txt) => txt.includes("router") || txt.includes("gateway"),
    expl: "En Default Gateway är den enhet (oftast en router) som vidarebefordrar trafik till andra nätverk eller internet."
  },
  {
    id: 16,
    q: "Nämn minst tre olika typer av IPv4-adresser/sändningstyper.",
    hint: "Tänk på sändningssätt (till en, till alla, till en grupp) eller loopback.",
    fullCheck: (txt) => {
      const types = ["unicast", "multicast", "broadcast", "loopback", "link-local", "privat"];
      let count = 0;
      types.forEach(t => { if (txt.includes(t)) count++; });
      return count >= 3;
    },
    partialCheck: (txt) => {
      const types = ["unicast", "multicast", "broadcast", "loopback", "link-local", "privat"];
      let count = 0;
      types.forEach(t => { if (txt.includes(t)) count++; });
      return count >= 1;
    },
    expl: "T.ex. Unicast (en-till-en), Multicast (en-till-grupp), Broadcast (en-till-alla) och Loopback (127.0.0.1)."
  }
];

let currentIndex = 0;
let userAnswers = {};
let results = {};

function toggleHint() {
  const box = document.getElementById("qHint");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function handleKey(e) {
  if (e.key === "Enter") {
    submitAnswer();
  }
}

function normalize(str) {
  return str.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, " ").replace(/\s+/g, " ").trim();
}

function updateProgress() {
  const total = questions.length;
  const pct = ((currentIndex + 1) / total) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("stepLabel").textContent = `Fråga ${currentIndex + 1} av ${total}`;

  let totalScore = 0;
  for (let id in results) {
    totalScore += results[id].score;
  }
  document.getElementById("scoreLabel").textContent = `Poäng: ${totalScore.toFixed(1)}`;
}

function loadQuestion(idx) {
  const q = questions[idx];
  document.getElementById("qTitle").textContent = `${idx + 1}. ${q.q}`;
  document.getElementById("qHint").textContent = q.hint;
  document.getElementById("qHint").style.display = "none";

  const input = document.getElementById("ansInput");
  input.value = userAnswers[q.id] || "";
  input.focus();

  const resBox = document.getElementById("resBox");
  const badge = document.getElementById("qBadge");

  if (results[q.id]) {
    const res = results[q.id];
    resBox.style.display = "block";
    if (res.score >= 1.0) {
      resBox.className = "result-box result-correct";
      resBox.innerHTML = `<strong>Rätt! (1.0 p)</strong><br>${q.expl}`;
      badge.textContent = "1.0 / 1.0 p";
      badge.style.borderColor = "var(--correct)";
      badge.style.color = "#86efac";
    } else if (res.score >= 0.5) {
      resBox.className = "result-box result-partial";
      resBox.innerHTML = `<strong>Delvis rätt / nära! (0.5 p)</strong><br>${q.expl}`;
      badge.textContent = "0.5 / 1.0 p";
      badge.style.borderColor = "var(--partial)";
      badge.style.color = "#fde047";
    } else {
      resBox.className = "result-box result-wrong";
      resBox.innerHTML = `<strong>Inte riktigt (0.0 p)</strong><br><strong>Facit:</strong> ${q.expl}`;
      badge.textContent = "0.0 / 1.0 p";
      badge.style.borderColor = "var(--wrong)";
      badge.style.color = "#fca5a5";
    }
  } else {
    resBox.style.display = "none";
    badge.textContent = "1.0 p";
    badge.style.borderColor = "var(--border)";
    badge.style.color = "var(--accent)";
  }

  document.getElementById("btnPrev").disabled = (idx === 0);
  document.getElementById("btnNext").textContent = (idx === questions.length - 1) ? "Visa resultat →" : "Nästa →";
  updateProgress();
}

function submitAnswer() {
  const q = questions[currentIndex];
  const input = document.getElementById("ansInput");
  const userAns = input.value.trim();
  userAnswers[q.id] = userAns;

  if (!userAns) {
    results[q.id] = { score: 0 };
    loadQuestion(currentIndex);
    return;
  }

  const clean = normalize(userAns);
  let score = 0;

  if (q.fullCheck(clean)) {
    score = 1.0;
  } else if (q.partialCheck(clean)) {
    score = 0.5;
  }

  results[q.id] = { score: score };
  loadQuestion(currentIndex);
}

function nextQuestion() {
  const q = questions[currentIndex];
  userAnswers[q.id] = document.getElementById("ansInput").value.trim();

  if (currentIndex < questions.length - 1) {
    currentIndex++;
    loadQuestion(currentIndex);
  } else {
    showSummary();
  }
}

function prevQuestion() {
  const q = questions[currentIndex];
  userAnswers[q.id] = document.getElementById("ansInput").value.trim();

  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion(currentIndex);
  }
}

function showSummary() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressContainer").style.display = "none";

  let totalScore = 0;
  for (let id in results) {
    totalScore += results[id].score;
  }

  const summary = document.getElementById("summaryCard");
  summary.style.display = "block";
  document.getElementById("finalScore").textContent = `${totalScore.toFixed(1)} / ${questions.length} p`;

  const feedback = document.getElementById("finalFeedback");
  const pct = (totalScore / questions.length) * 100;
  if (pct >= 85) feedback.textContent = "Grymt jobbat! Du har stenkoll på nätverksgrunderna.";
  else if (pct >= 50) feedback.textContent = "Bra jobbat! Vissa delar sitter bra, repetera gärna intervallen och beräkningarna.";
  else feedback.textContent = "Bra försök! Gå gärna igenom facit och gör om quizet för att träna mer.";
}

function restartQuiz() {
  currentIndex = 0;
  userAnswers = {};
  results = {};
  document.getElementById("summaryCard").style.display = "none";
  document.getElementById("quizCard").style.display = "flex";
  document.getElementById("progressContainer").style.display = "block";
  loadQuestion(0);
}

window.onload = () => loadQuestion(0);
</script>
</body>
</html>
