<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internet L4</title>
  <style>
    :root {
      --bg: #131314;
      --card-bg: #1e1f20;
      --opt-bg: #282a2c;
      --opt-hover: #333537;
      --text: #e3e3e3;
      --text-muted: #8e918f;
      --correct-bg: #1e3a29;
      --correct-border: #34a853;
      --correct-pill: #c4eed0;
      --correct-pill-txt: #072711;
      --wrong-bg: #3c1e1e;
      --wrong-border: #ea4335;
      --wrong-pill: #f9d5d2;
      --wrong-pill-txt: #3c0c08;
      --btn-blue: #1b6ef3;
      --btn-blue-hover: #1557bf;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Google Sans", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .modal-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 680px;
      border-radius: 28px;
      padding: 24px 28px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      min-height: 620px;
      justify-content: space-between;
    }

    /* Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .quiz-title {
      font-size: 1.05rem;
      font-weight: 500;
      color: #f1f3f4;
    }

    /* Progress bar with segments */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .segments {
      display: flex;
      gap: 4px;
      flex: 1;
    }

    .seg {
      height: 4px;
      flex: 1;
      background: #3c4043;
      border-radius: 2px;
      position: relative;
      transition: background 0.3s;
    }

    .seg.correct {
      background: #34a853;
    }

    .seg.wrong {
      background: #ea4335;
    }

    .seg.current {
      background: #8ab4f8;
    }

    .step-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .pill-counter {
      display: flex;
      gap: 6px;
    }

    .count-pill {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pill-red {
      background: rgba(234, 67, 53, 0.2);
      color: #f28b82;
    }

    .pill-green {
      background: rgba(52, 168, 83, 0.2);
      color: #81c995;
    }

    /* Question content */
    .q-number {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .q-text {
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.45;
      color: #f1f3f4;
      margin-bottom: 18px;
    }

    .hint-btn {
      background: none;
      border: none;
      color: #fbbc04;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 16px;
      display: inline-block;
      padding: 0;
    }

    .hint-box {
      display: none;
      background: rgba(251, 188, 4, 0.08);
      border-left: 3px solid #fbbc04;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      color: #fde293;
      margin-bottom: 16px;
    }

    /* Options */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .opt-card {
      background: var(--opt-bg);
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 14px 18px;
      color: #e3e3e3;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      width: 100%;
    }

    .opt-card:hover:not(:disabled) {
      background: var(--opt-hover);
    }

    .opt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .opt-title {
      font-weight: 400;
      line-height: 1.4;
    }

    .badge-result {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .opt-card.correct-opt {
      background: var(--correct-bg);
      border-color: var(--correct-border);
    }

    .opt-card.correct-opt .badge-result {
      background: var(--correct-pill);
      color: var(--correct-pill-txt);
    }

    .opt-card.wrong-opt {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
    }

    .opt-card.wrong-opt .badge-result {
      background: var(--wrong-pill);
      color: var(--wrong-pill-txt);
    }

    .opt-explanation {
      margin-top: 10px;
      padding-top: 8px;
      font-size: 0.88rem;
      line-height: 1.45;
      color: #c4c7c5;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    /* Bottom actions */
    .bottom-bar {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 10px;
    }

    .btn-action {
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    .btn-back {
      background: #282a2c;
      color: #c4c7c5;
    }

    .btn-back:hover:not(:disabled) {
      background: #333537;
    }

    .btn-next {
      background: var(--btn-blue);
      color: #ffffff;
    }

    .btn-next:hover:not(:disabled) {
      background: var(--btn-blue-hover);
    }

    .btn-action:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Summary screen */
    .summary-view {
      display: none;
      text-align: center;
      padding: 40px 10px;
    }

    .summary-view h2 {
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: #f1f3f4;
    }

    .score-badge-large {
      font-size: 3rem;
      font-weight: 700;
      color: #8ab4f8;
      margin: 16px 0;
    }

    .summary-desc {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 480px;
      margin: 0 auto 28px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="modal-container">
  <div>
    <div class="top-bar">
      <div class="quiz-title">Internet L4</div>
    </div>

    <div class="progress-row" id="progressRow">
      <div class="segments" id="segments"></div>
      <div class="step-text" id="stepCounter">1/16</div>
      <div class="pill-counter">
        <div class="count-pill pill-red" id="pillWrong">✕ 0</div>
        <div class="count-pill pill-green" id="pillCorrect">✓ 0</div>
      </div>
    </div>

    <div id="quizContent">
      <div class="q-number" id="qNumber">Fråga 1</div>
      <div class="q-text" id="qText">Laddar fråga...</div>

      <button type="button" class="hint-btn" onclick="toggleHint()">💡 Visa ledtråd</button>
      <div class="hint-box" id="hintBox"></div>

      <div class="options-list" id="optionsList"></div>
    </div>

    <div class="summary-view" id="summaryView">
      <h2>Quiz genomfört!</h2>
      <div class="score-badge-large" id="finalScore">0 / 16</div>
      <p class="summary-desc" id="finalFeedback"></p>
      <button type="button" class="btn-action btn-next" onclick="restartQuiz()">Gör om quizet</button>
    </div>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <button type="button" class="btn-action btn-back" id="btnBack" onclick="prevQuestion()" disabled>Tillbaka</button>
    <button type="button" class="btn-action btn-next" id="btnNext" onclick="nextQuestion()">Nästa</button>
  </div>
</div>

let currentIndex = 0;
let userAnswers = {};

function initSegments() {
  const segContainer = document.getElementById("segments");
  segContainer.innerHTML = questions.map((_, i) => `<div class="seg" id="seg-${i}"></div>`).join("");
}

function updateProgress() {
  const total = questions.length;
  document.getElementById("stepCounter").textContent = `${currentIndex + 1}/${total}`;

  let correctCount = 0;
  let wrongCount = 0;

  questions.forEach((_, i) => {
    const seg = document.getElementById(`seg-${i}`);
    seg.className = "seg";
    if (userAnswers[i] !== undefined) {
      if (userAnswers[i].isCorrect) {
        seg.classList.add("correct");
        correctCount++;
      } else {
        seg.classList.add("wrong");
        wrongCount++;
      }
    } else if (i === currentIndex) {
      seg.classList.add("current");
    }
  });

  document.getElementById("pillCorrect").textContent = `✓ ${correctCount}`;
  document.getElementById("pillWrong").textContent = `✕ ${wrongCount}`;
}

function toggleHint() {
  const box = document.getElementById("hintBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function loadQuestion(idx) {
  const q = questions[idx];
  document.getElementById("qNumber").textContent = `Fråga ${idx + 1}`;
  document.getElementById("qText").textContent = q.q;
  document.getElementById("hintBox").textContent = q.hint;
  document.getElementById("hintBox").style.display = "none";

  const list = document.getElementById("optionsList");
  list.innerHTML = "";

  const answerData = userAnswers[idx];

  q.options.forEach((optText, optIdx) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opt-card";

    let badgeHtml = "";
    let isSelected = (answerData && answerData.selected === optIdx);
    let isCorrectOpt = (optIdx === q.correct);

    if (answerData) {
      btn.disabled = true;
      if (isCorrectOpt) {
        btn.classList.add("correct-opt");
        badgeHtml = `<span class="badge-result">✓ Rätt svar</span>`;
      } else if (isSelected) {
        btn.classList.add("wrong-opt");
        badgeHtml = `<span class="badge-result">✕ Fel svar</span>`;
      }
    } else {
      btn.onclick = () => chooseOption(optIdx);
    }

    let extraText = isSelected ? " (Ditt svar)" : "";
    let explHtml = (answerData && (isCorrectOpt || isSelected)) ? `<div class="opt-explanation">${q.expl}</div>` : "";

    btn.innerHTML = `
      <div class="opt-header">
        <span class="opt-title">${optText}<strong>${extraText}</strong></span>
        ${badgeHtml}
      </div>
      ${explHtml}
    `;

    list.appendChild(btn);
  });

  document.getElementById("btnBack").disabled = (idx === 0);
  document.getElementById("btnNext").textContent = (idx === questions.length - 1) ? "Slutför" : "Nästa";
  updateProgress();
}

function chooseOption(selectedIdx) {
  if (userAnswers[currentIndex] !== undefined) return;
  const q = questions[currentIndex];
  userAnswers[currentIndex] = {
    selected: selectedIdx,
    isCorrect: (selectedIdx === q.correct)
  };
  loadQuestion(currentIndex);
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    loadQuestion(currentIndex);
  } else {
    showSummary();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion(currentIndex);
  }
}

function showSummary() {
  document.getElementById("quizContent").style.display = "none";
  document.getElementById("progressRow").style.display = "none";
  document.getElementById("bottomBar").style.display = "none";

  let correctCount = 0;
  questions.forEach((_, i) => {
    if (userAnswers[i] && userAnswers[i].isCorrect) correctCount++;
  });

  document.getElementById("summaryView").style.display = "block";
  document.getElementById("finalScore").textContent = `${correctCount} / ${questions.length}`;

  const pct = (correctCount / questions.length) * 100;
  const fb = document.getElementById("finalFeedback");
  if (pct >= 85) fb.textContent = "Grymt jobbat! Du har full koll på alla nätverksklasser, MAC-adresser och beräkningar!";
  else if (pct >= 50) fb.textContent = "Bra resultat! Grunderna sitter, men repetera gärna detaljerna kring intervall och formler.";
  else fb.textContent = "Kämpa på! Gå igenom svaren och förklaringarna och testa igen för att sätta teorin.";
}

function restartQuiz() {
  currentIndex = 0;
  userAnswers = {};
  document.getElementById("summaryView").style.display = "none";
  document.getElementById("quizContent").style.display = "block";
  document.getElementById("progressRow").style.display = "flex";
  document.getElementById("bottomBar").style.display = "flex";
  loadQuestion(0);
}

window.onload = () => {
  initSegments();
  loadQuestion(0);
};
</script>
</body>
</html>
