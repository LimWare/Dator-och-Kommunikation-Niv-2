<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provfrågor Del 2: L3 & L4 - Jensen Campus</title>
  <style>
    :root {
      --bg: #060b11;
      --card-bg: #0b1522;
      --gold-primary: #e6c260;
      --gold-glow: rgba(230, 194, 96, 0.28);
      --gold-gradient: linear-gradient(135deg, #fae287 0%, #d4af37 50%, #9e7d23 100%);
      --gold-border: rgba(212, 175, 55, 0.55);
      --text: #f8fafc;
      --text-muted: #9fb0c3;
      --correct: #22c55e;
      --wrong: #ef4444;
      --opt-bg: #112033;
      --opt-hover: #182c45;
      --opt-border: rgba(212, 175, 55, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .modal-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 880px;
      border-radius: 26px;
      border: 2px solid var(--gold-border);
      padding: 34px 38px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 35px var(--gold-glow);
      display: flex;
      flex-direction: column;
      min-height: 740px;
      justify-content: space-between;
    }

    .header-box {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px;
      border-bottom: 1.5px solid var(--gold-border);
      padding-bottom: 20px;
      box-shadow: 0 6px 15px -8px var(--gold-glow);
    }

    .jensen-logo-svg {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #060b11;
      border: 2px solid var(--gold-primary);
      box-shadow: 0 0 16px var(--gold-glow);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
    }

    .header-titles h1 {
      font-size: 1.55rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    .header-titles p {
      font-size: 0.95rem;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .segments {
      display: flex;
      gap: 3px;
      flex: 1;
    }

    .seg {
      height: 6px;
      flex: 1;
      background: #18283b;
      border-radius: 3px;
      transition: background 0.2s;
    }

    .seg.correct { background: var(--correct); }
    .seg.wrong { background: var(--wrong); }
    .seg.current { 
      background: var(--gold-primary); 
      box-shadow: 0 0 8px var(--gold-primary);
    }

    .step-text {
      font-size: 1rem;
      color: var(--gold-primary);
      font-weight: 700;
      white-space: nowrap;
    }

    .pill-counter {
      display: flex;
      gap: 8px;
    }

    .count-pill {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
    }

    .pill-red { background: rgba(239, 68, 68, 0.22); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .pill-green { background: rgba(34, 197, 94, 0.22); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.4); }

    .q-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .q-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 800;
      color: #070e17;
      background: var(--gold-gradient);
      padding: 3px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      box-shadow: 0 2px 8px var(--gold-glow);
    }

    .q-type-badge {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: #121f30;
      border: 1px solid var(--gold-border);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .q-text {
      font-size: 1.28rem;
      font-weight: 700;
      line-height: 1.5;
      color: #ffffff;
      margin-bottom: 14px;
    }

    .hint-btn {
      background: none;
      border: none;
      color: var(--gold-primary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      margin-bottom: 18px;
      display: inline-block;
      padding: 0;
    }

    .hint-box {
      display: none;
      background: rgba(212, 175, 55, 0.1);
      border-left: 4px solid var(--gold-primary);
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 0.98rem;
      color: #fef08a;
      margin-bottom: 18px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 20px;
    }

    .opt-card {
      background: var(--opt-bg);
      border: 1px solid var(--opt-border);
      border-radius: 14px;
      padding: 16px 20px;
      color: #f1f5f9;
      text-align: left;
      font-size: 1.05rem;
      line-height: 1.45;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .opt-card:hover:not(:disabled) {
      background: var(--opt-hover);
      border-color: var(--gold-primary);
      transform: translateY(-1px);
    }

    .opt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .badge-result {
      font-size: 0.85rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .opt-card.correct-opt {
      background: rgba(34, 197, 94, 0.22);
      border-color: var(--correct);
    }
    .opt-card.correct-opt .badge-result { background: #22c55e; color: #fff; }

    .opt-card.wrong-opt {
      background: rgba(239, 68, 68, 0.22);
      border-color: var(--wrong);
    }
    .opt-card.wrong-opt .badge-result { background: #ef4444; color: #fff; }

    .opt-explanation {
      margin-top: 10px;
      padding-top: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e2e8f0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .text-input-wrapper {
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      border: 1.5px solid var(--gold-border);
      background: var(--opt-bg);
      color: #fff;
      font-size: 1.1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 14px var(--gold-glow);
    }

    .text-result-box {
      display: none;
      margin-top: 16px;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 1.02rem;
      line-height: 1.55;
    }
    .text-result-correct { background: rgba(34, 197, 94, 0.2); border: 1.5px solid var(--correct); color: #86efac; }
    .text-result-wrong { background: rgba(239, 68, 68, 0.2); border: 1.5px solid var(--wrong); color: #fca5a5; }

    .bottom-bar {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      margin-top: 14px;
    }

    .btn-action {
      padding: 12px 30px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-back { background: #132438; color: #cbd5e1; border: 1px solid var(--gold-border); }
    .btn-back:hover:not(:disabled) { background: #1b324e; }

    .btn-next { 
      background: var(--gold-gradient); 
      color: #070e17; 
      box-shadow: 0 0 16px var(--gold-glow); 
    }
    .btn-next:hover:not(:disabled) { 
      filter: brightness(1.1); 
      transform: translateY(-1px);
    }

    .btn-action:disabled { opacity: 0.35; cursor: not-allowed; }

    .summary-view {
      display: none;
      text-align: center;
      padding: 40px 16px;
    }
    .summary-view h2 { 
      font-size: 2.2rem; 
      margin-bottom: 12px; 
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800; 
    }
    .score-badge-large { 
      font-size: 3.8rem; 
      font-weight: 800; 
      color: var(--gold-primary); 
      margin: 16px 0; 
      text-shadow: 0 0 25px var(--gold-glow); 
    }
    .summary-desc { color: var(--text-muted); font-size: 1.15rem; max-width: 600px; margin: 0 auto 28px; line-height: 1.6; }
  </style>
</head>
<body>

<div class="modal-container">
  <div>
    <div class="header-box">
      <div class="jensen-logo-svg">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#d4af37" stroke-width="2.5" />
          <circle cx="50" cy="50" r="41" fill="none" stroke="#d4af37" stroke-width="1.2" />
          <polygon points="50,16 52,21 57,21 53,24 55,29 50,26 45,29 47,24 43,21 48,21" fill="#d4af37"/>
          <polygon points="63,22 64.5,25.5 68,25.5 65,28 66,31.5 63,29.5 60,31.5 61,28 58,25.5 61.5,25.5" fill="#d4af37"/>
          <polygon points="73,34 74.5,37.5 78,37.5 75,40 76,43.5 73,41.5 70,43.5 71,40 68,37.5 71.5,37.5" fill="#d4af37"/>
          <polygon points="58,35 59.5,38.5 63,38.5 60,41 61,44.5 58,42.5 55,44.5 56,41 53,38.5 56.5,38.5" fill="#d4af37"/>
          <polygon points="68,48 69.5,51.5 73,51.5 70,54 71,57.5 68,55.5 65,57.5 66,54 63,51.5 66.5,51.5" fill="#d4af37"/>
          <path d="M 33,26 L 52,26 L 52,40 C 52,45 42,48 33,48 C 24,48 24,40 24,40 L 24,26 Z" fill="none" stroke="#d4af37" stroke-width="1.2"/>
          <text x="38" y="36" fill="#d4af37" font-size="7.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">1996</text>
          <path d="M 32,70 C 37,58 48,50 63,45" fill="none" stroke="#d4af37" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="32" y1="70" x2="63" y2="45" stroke="#d4af37" stroke-width="1" />
          <line x1="30" y1="67" x2="68" y2="42" stroke="#d4af37" stroke-width="2.2" stroke-linecap="round"/>
          <polygon points="68,42 62,40 64,46" fill="#d4af37" />
          <circle cx="36" cy="62" r="5" fill="none" stroke="#d4af37" stroke-width="1.6" />
          <path id="textPath" d="M 20,68 A 38,38 0 0,0 80,68" fill="none" />
          <text fill="#d4af37" font-size="7.2" font-weight="bold" letter-spacing="1.5">
            <textPath href="#textPath" startOffset="50%" text-anchor="middle">JENSEN CAMPUS</textPath>
          </text>
        </svg>
      </div>
      <div class="header-titles">
        <h1>Provfrågor Del 2: L3 Nätverk & L4 Internet</h1>
        <p>Jensen Education • Slutprovsträning (30 Frågor: Protokoll, Utrustning & Nätverksdrift)</p>
      </div>
    </div>

    <div class="progress-row" id="progressRow">
      <div class="segments" id="segments"></div>
      <div class="step-text" id="stepCounter">1/30</div>
      <div class="pill-counter">
        <div class="count-pill pill-red" id="pillWrong">✕ 0</div>
        <div class="count-pill pill-green" id="pillCorrect">✓ 0</div>
      </div>
    </div>

    <div id="quizContent">
      <div class="q-meta">
        <span class="q-badge" id="qBadge">L3 / L4</span>
        <span class="q-type-badge" id="qTypeBadge">Flerval</span>
      </div>
      <div class="q-text" id="qText">Laddar fråga...</div>

      <button type="button" class="hint-btn" onclick="toggleHint()">💡 Visa ledtråd</button>
      <div class="hint-box" id="hintBox"></div>

      <div id="questionContainer"></div>
    </div>

    <div class="summary-view" id="summaryView">
      <h2>Provträning del 2 genomförd!</h2>
      <div class="score-badge-large" id="finalScore">0 / 30</div>
      <p class="summary-desc" id="finalFeedback"></p>
      <button type="button" class="btn-action btn-next" onclick="restartQuiz()">Gör om provet</button>
    </div>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <button type="button" class="btn-action btn-back" id="btnBack" onclick="prevQuestion()" disabled>Tillbaka</button>
    <button type="button" class="btn-action btn-next" id="btnNext" onclick="nextQuestion()">Nästa</button>
  </div>
</div>

<script>
const questions = [
  // 1 (L3 - MC)
  {
    id: 1,
    type: "mc",
    module: "L3: Nätverksenheter",
    q: "Vad är den principiella skillnaden mellan en Hubb och en Switch?",
    hint: "Kollisionsdomäner och MAC-tabell.",
    options: [
      "Hubben skickar data till alla portar; Switchen lär sig MAC-adresser och skickar enbart till mottagaren.",
      "Hubben fungerar enbart i datacenter; Switchen är begränsad till trådlösa lokala nätverk.",
      "Hubben har en inbyggd brandvägg; Switchen kräver en extern hårdvarugateway för all drift.",
      "Hubben konverterar ljus till radio; Switchen kan enbart vidarebefordra analoga ljudsignaler.",
      "Hubben krypterar all nättrafik; Switchen saknar helt stöd för moderna nätverkskort.",
      "Hubben kräver alltid koaxialkabel; Switchen kan enbart anslutas med optisk fiberkabel."
    ],
    correct: 0,
    expl: "En hubb repeterar all inkommande trafik till samtliga portar (en enda kollisionsdomän). En switch läser MAC-adresser och skickar dataramen endast till avsedd port."
  },
  // 2 (L3 - Text)
  {
    id: 2,
    type: "text",
    module: "L3: Duplex",
    q: "Vad är skillnaden mellan Halv duplex (Half duplex) och Full duplex?",
    hint: "Walkie-talkie gentemot vanlig telefon.",
    fullCheck: (txt) => (txt.includes("båda") || txt.includes("samtid")) && (txt.includes("ett håll") || txt.includes("en i taget") || txt.includes("samtidigt")),
    partialCheck: (txt) => txt.includes("samtidigt") || txt.includes("riktning") || txt.includes("tur"),
    expl: "Halv duplex: data kan bara skickas i en riktning åt gången (som en walkie-talkie). Full duplex: data kan skickas och tas emot samtidigt i båda riktningarna (som ett telefonsamtal)."
  },
  // 3 (L3 - MC)
  {
    id: 3,
    type: "mc",
    module: "L3: Trådlösa frekvenser",
    q: "Vilka egenskaper särskiljer Wi-Fi-frekvenserna 2.4 GHz och 5 GHz?",
    hint: "Räckvidd och hinder gentemot kapacitet.",
    options: [
      "2.4 GHz når längre och tränger genom hinder bättre; 5 GHz har högre hastighet men kortare räckvidd.",
      "2.4 GHz har mycket högre kapacitet genom betong; 5 GHz har en räckvidd på flera mil utomhus.",
      "2.4 GHz används uteslutande för Bluetooth-länkar; 5 GHz är reserverat för satellitkommunikation.",
      "2.4 GHz saknar helt krypteringsstöd; 5 GHz kräver alltid fri siktlinje utan minsta hinder.",
      "2.4 GHz kräver dubbla fiberomvandlare; 5 GHz fungerar enbart i fordon och rörliga miljöer.",
      "2.4 GHz är reserverat för industrin; 5 GHz är den enda frekvensen som är godkänd i hemmet."
    ],
    correct: 0,
    expl: "2.4 GHz tränger igenom väggar bättre och når längre men är långsammare och mer stört. 5 GHz har mycket högre kapacitet/hastighet men dämpas kraftigt av hinder."
  },
  // 4 (L3 - Text)
  {
    id: 4,
    type: "text",
    module: "L3: CSMA/CD",
    q: "Vad står metoden CSMA/CD för och vad har den för funktion i ett nätverk?",
    hint: "Lyssnar före sändning och hanterar datakollisioner.",
    fullCheck: (txt) => (txt.includes("kollision") || txt.includes("collision")) && (txt.includes("lyssn") || txt.includes("känner av") || txt.includes("upptäck")),
    partialCheck: (txt) => txt.includes("kollision") || txt.includes("collision"),
    expl: "Carrier Sense Multiple Access with Collision Detection. Metoden ser till att enheter lyssnar på kabeln innan de sänder, och om två sänder samtidigt avbryts överföringen för att undvika datakrasch."
  },
  // 5 (L3 - MC)
  {
    id: 5,
    type: "mc",
    module: "L3: Nätverkskategori (Cat)",
    q: "Vilken standardprestanda har en Cat6 nätverkskabel under normala förhållanden?",
    hint: "1 Gbps upp till 100m, klarar 10 Gbps på kortare sträckor.",
    options: [
      "Klarar 1 Gbps upp till 100 meter samt 10 Gbps upp till 55 meter.",
      "Klarar 100 Mbps upp till maximalt 50 meter utan repeater.",
      "Klarar 40 Gbps över 200 meter oavsett yttre störningar.",
      "Klarar 10 Mbps och är enbart avsedd för äldre telefoni.",
      "Klarar 100 Gbps och kräver alltid optiska tranceivrar.",
      "Klarar 500 Mbps men får inte dras nära metallstrukturer."
    ],
    correct: 0,
    expl: "Cat6 klarar 1 Gbps (1000BASE-T) upp till 100 meter, och kan köra 10 Gbps (10GBASE-T) på sträckor upp till ca 55 meter."
  },
  // 6 (L4 - MC)
  {
    id: 6,
    type: "mc",
    module: "L4: TCP vs UDP",
    q: "Vad är den grundläggande skillnaden mellan protokollen TCP och UDP?",
    hint: "Garanterad leverans gentemot snabbhet utan kvittens.",
    options: [
      "TCP är pålitligt med felkontroll och kvittenser; UDP skickar snabbt utan leveransgaranti.",
      "TCP används enbart för ljudsamtal; UDP hanterar säkra krypterade banköverföringar.",
      "TCP saknar helt stöd för portar; UDP konfigurerar nätverkskortens IP-adresser.",
      "TCP sänder alla paket via broadcast; UDP kräver en fullständig förhandssynkronisering.",
      "TCP fungerar enbart över fiberoptik; UDP är optimerat för analoga telefonlinjer.",
      "TCP krypterar alltid datapaketen; UDP skickar uteslutande okomprimerade filer."
    ],
    correct: 0,
    expl: "TCP säkerställer att all data kommer fram i rätt ordning med kvittenser och omsändning. UDP skickar utan garantier vilket gör det snabbare och perfekt för gaming, DNS och VoIP."
  },
  // 7 (L4 - Text)
  {
    id: 7,
    type: "text",
    module: "L4: Trevägshandskakning",
    q: "Vilka tre steg (flaggor) ingår i TCP:s trevägshandskakning (Three-way handshake)?",
    hint: "SYN, SYN-ACK, ACK.",
    fullCheck: (txt) => txt.includes("syn") && txt.includes("ack"),
    partialCheck: (txt) => txt.includes("syn") || txt.includes("ack"),
    expl: "1. SYN (klienten ber om kontakt), 2. SYN-ACK (servern svarar och bekräftar), 3. ACK (klienten bekräftar att anslutningen är etablerad)."
  },
  // 8 (L4 - MC)
  {
    id: 8,
    type: "mc",
    module: "L4: Kända portnummer",
    q: "Vilka standardportar använder webbtrafik via HTTP respektive HTTPS?",
    hint: "Okrypterat 80, krypterat 443.",
    options: [
      "HTTP använder port 80; HTTPS använder port 443.",
      "HTTP använder port 21; HTTPS använder port 22.",
      "HTTP använder port 25; HTTPS använder port 110.",
      "HTTP använder port 53; HTTPS använder port 67.",
      "HTTP använder port 3389; HTTPS använder port 8080.",
      "HTTP använder port 123; HTTPS använder port 161."
    ],
    correct: 0,
    expl: "HTTP använder port 80 (okrypterad webb) och HTTPS använder port 443 (krypterad webb via SSL/TLS)."
  },
  // 9 (L4 - MC)
  {
    id: 9,
    type: "mc",
    module: "L4: DNS-funktion",
    q: "Vad är DNS huvudsakliga funktion i ett nätverk och vilken port används?",
    hint: "Översätter domännamn till IP över port 53.",
    options: [
      "Översätter domännamn till IP-adresser via port 53.",
      "Delar ut nätverkskonfiguration dynamiskt via port 68.",
      "Krypterar e-postmeddelanden mellan klienter via port 993.",
      "Styr den fysiska MAC-adressen i switchar via port 23.",
      "Säkerställer klocksynkronisering mellan enheter via port 123.",
      "Blockerar obehörig inkommande nättrafik via port 8080."
    ],
    correct: 0,
    expl: "Domain Name System (DNS) översätter läsbara adresser (som google.se) till maskinläsbara IP-adresser via port 53 (oftast UDP)."
  },
  // 10 (L4 - Text)
  {
    id: 10,
    type: "text",
    module: "L4: DHCP DORA",
    q: "Vilka fyra steg ingår i DHCP-processen när en dator begär en IP-adress?",
    hint: "DORA: Discover, Offer, Request, Acknowledge.",
    fullCheck: (txt) => {
      let c = 0;
      if (txt.includes("discover") || txt.includes("upptäck")) c++;
      if (txt.includes("offer") || txt.includes("erbjud")) c++;
      if (txt.includes("request") || txt.includes("begär")) c++;
      if (txt.includes("ack") || txt.includes("bekräft")) c++;
      return c >= 3 || txt.includes("dora");
    },
    partialCheck: (txt) => txt.includes("dora") || txt.includes("discover") || txt.includes("request"),
    expl: "DORA: 1. Discover (klienten ropar efter DHCP), 2. Offer (servern erbjuder en IP), 3. Request (klienten tackar ja till adressen), 4. Acknowledge (servern bekräftar lånet)."
  },
  // 11 (L4 - MC)
  {
    id: 11,
    type: "mc",

let currentIndex = 0;
let userAnswers = {};

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function randomizeQuiz() {
  shuffleArray(questions);
  questions.forEach(q => {
    if (q.type === "mc") {
      const correctText = q.options[q.correct];
      shuffleArray(q.options);
      q.correct = q.options.indexOf(correctText);
    }
  });
}

function initSegments() {
  const segContainer = document.getElementById("segments");
  segContainer.innerHTML = questions.map((_, i) => `<div class="seg" id="seg-${i}"></div>`).join("");
}

function updateProgress() {
  const total = questions.length;
  document.getElementById("stepCounter").textContent = `${currentIndex + 1}/${total}`;

  let correctCount = 0;
  let wrongCount = 0;

  questions.forEach((_, i) => {
    const seg = document.getElementById(`seg-${i}`);
    seg.className = "seg";
    if (userAnswers[i] !== undefined) {
      if (userAnswers[i].isCorrect) {
        seg.classList.add("correct");
        correctCount++;
      } else {
        seg.classList.add("wrong");
        wrongCount++;
      }
    } else if (i === currentIndex) {
      seg.classList.add("current");
    }
  });

  document.getElementById("pillCorrect").textContent = `✓ ${correctCount}`;
  document.getElementById("pillWrong").textContent = `✕ ${wrongCount}`;
}

function toggleHint() {
  const box = document.getElementById("hintBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function normalize(str) {
  return str.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, " ").replace(/\s+/g, " ").trim();
}

function loadQuestion(idx) {
  const q = questions[idx];
  document.getElementById("qBadge").textContent = q.module;
  document.getElementById("qTypeBadge").textContent = (q.type === "mc") ? "Flerval (6 alternativ)" : "Fritext (skriv själv)";
  document.getElementById("qText").textContent = `${idx + 1}. ${q.q}`;
  document.getElementById("hintBox").textContent = q.hint;
  document.getElementById("hintBox").style.display = "none";

  const container = document.getElementById("questionContainer");
  container.innerHTML = "";

  const answerData = userAnswers[idx];

  if (q.type === "mc") {
    const list = document.createElement("div");
    list.className = "options-list";

    q.options.forEach((optText, optIdx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opt-card";

      let badgeHtml = "";
      let isSelected = (answerData && answerData.selected === optIdx);
      let isCorrectOpt = (optIdx === q.correct);

      if (answerData) {
        btn.disabled = true;
        if (isCorrectOpt) {
          btn.classList.add("correct-opt");
          badgeHtml = `<span class="badge-result">✓ Rätt svar</span>`;
        } else if (isSelected) {
          btn.classList.add("wrong-opt");
          badgeHtml = `<span class="badge-result">✕ Fel svar</span>`;
        }
      } else {
        btn.onclick = () => chooseMcOption(optIdx);
      }

      let extraText = isSelected ? " (Ditt svar)" : "";
      let explHtml = (answerData && (isCorrectOpt || isSelected)) ? `<div class="opt-explanation">${q.expl}</div>` : "";

      btn.innerHTML = `
        <div class="opt-header">
          <span>${optText}<strong>${extraText}</strong></span>
          ${badgeHtml}
        </div>
        ${explHtml}
      `;
      list.appendChild(btn);
    });
    container.appendChild(list);

  } else if (q.type === "text") {
    const wrapper = document.createElement("div");
    wrapper.className = "text-input-wrapper";

    const input = document.createElement("input");
    input.type = "text";
    input.id = "textInput";
    input.placeholder = "Skriv ditt svar här och tryck Enter / Rätta svar...";
    input.autocomplete = "off";

    const resBox = document.createElement("div");
    resBox.id = "textResBox";
    resBox.className = "text-result-box";

    if (answerData) {
      input.value = answerData.textVal;
      input.disabled = true;
      resBox.style.display = "block";
      if (answerData.score >= 1.0) {
        resBox.className = "text-result-box text-result-correct";
        resBox.innerHTML = `<strong>✓ Helt rätt! (1.0 p)</strong><br>${q.expl}`;
      } else if (answerData.score >= 0.5) {
        resBox.className = "text-result-box text-result-correct";
        resBox.innerHTML = `<strong>✓ Delvis rätt! (0.5 p)</strong><br>${q.expl}`;
      } else {
        resBox.className = "text-result-box text-result-wrong";
        resBox.innerHTML = `<strong>✕ Inte riktigt (0.0 p)</strong><br><strong>Facit:</strong> ${q.expl}`;
      }
    } else {
      input.onkeydown = (e) => { if (e.key === "Enter") submitTextAnswer(); };
    }

    wrapper.appendChild(input);
    wrapper.appendChild(resBox);

    if (!answerData) {
      const submitBtn = document.createElement("button");
      submitBtn.type = "button";
      submitBtn.className = "btn-action btn-next";
      submitBtn.style.marginTop = "14px";
      submitBtn.textContent = "Rätta svar";
      submitBtn.onclick = submitTextAnswer;
      wrapper.appendChild(submitBtn);
    }

    container.appendChild(wrapper);
  }

  document.getElementById("btnBack").disabled = (idx === 0);
  document.getElementById("btnNext").textContent = (idx === questions.length - 1) ? "Slutför" : "Nästa";
  updateProgress();
}

function chooseMcOption(selectedIdx) {
  if (userAnswers[currentIndex] !== undefined) return;
  const q = questions[currentIndex];
  userAnswers[currentIndex] = {
    selected: selectedIdx,
    isCorrect: (selectedIdx === q.correct)
  };
  loadQuestion(currentIndex);
}

function submitTextAnswer() {
  const input = document.getElementById("textInput");
  const val = input.value.trim();
  if (!val) return;

  const q = questions[currentIndex];
  const clean = normalize(val);
  let score = 0;

  if (q.fullCheck(clean)) score = 1.0;
  else if (q.partialCheck(clean)) score = 0.5;

  userAnswers[currentIndex] = {
    textVal: val,
    score: score,
    isCorrect: (score >= 0.5)
  };
  loadQuestion(currentIndex);
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    loadQuestion(currentIndex);
  } else {
    showSummary();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion(currentIndex);
  }
}

function showSummary() {
  document.getElementById("quizContent").style.display = "none";
  document.getElementById("progressRow").style.display = "none";
  document.getElementById("bottomBar").style.display = "none";

  let correctCount = 0;
  questions.forEach((_, i) => {
    if (userAnswers[i] && userAnswers[i].isCorrect) correctCount++;
  });

  document.getElementById("summaryView").style.display = "block";
  document.getElementById("finalScore").textContent = `${correctCount} / ${questions.length}`;

  const pct = (correctCount / questions.length) * 100;
  const fb = document.getElementById("finalFeedback");
  if (pct >= 85) fb.textContent = "Grymt bra! Du har stenkoll på protokoll, felsökning och nätverksutrustning.";
  else if (pct >= 60) fb.textContent = "Bra jobbat! Grunderna i del 2 sitter, repetera portnummer och IPv6 en extra vända inför provet.";
  else fb.textContent = "Kör gärna om del 2 en gång till så sätter sig protokollen och begreppen ordentligt!";
}

function restartQuiz() {
  currentIndex = 0;
  userAnswers = {};
  randomizeQuiz();
  document.getElementById("summaryView").style.display = "none";
  document.getElementById("quizContent").style.display = "block";
  document.getElementById("progressRow").style.display = "flex";
  document.getElementById("bottomBar").style.display = "flex";
  loadQuestion(0);
}

window.onload = () => {
  randomizeQuiz();
  initSegments();
  loadQuestion(0);
};
</script>
</body>
</html>
